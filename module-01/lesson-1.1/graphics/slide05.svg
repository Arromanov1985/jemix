<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
  <title id="title">Урок 1.1, слайд 05 — Простыми словами</title>
  <desc id="desc">Насос забирает воду из источника и подаёт её в систему дома.</desc>
  <defs>
    <style>
      .h1{font:700 66px Arial,sans-serif;fill:#111827}.h2{font:700 34px Arial,sans-serif;fill:#111827}
      .body{font:400 34px Arial,sans-serif;fill:#303640}.label{font:700 28px Arial,sans-serif;fill:#111827}
      .small{font:400 25px Arial,sans-serif;fill:#303640}.red{fill:#e30613}.line{fill:none;stroke-width:6;stroke-linecap:round;stroke-linejoin:round}
    </style>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="12" stdDeviation="14" flood-opacity=".14"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#e30613"/></marker>
  </defs>
  <rect width="1920" height="1080" fill="#fff"/>
  <rect x="58" y="48" width="116" height="116" rx="18" class="red"/>
  <text x="116" y="126" text-anchor="middle" font-family="Arial" font-size="58" font-weight="700" fill="#fff">05</text>
  <text x="212" y="128" class="h1">Простыми словами</text>

  <text x="110" y="270" class="body">Насос забирает воду</text>
  <text x="110" y="326" class="body">из источника и подаёт её</text>
  <text x="110" y="382" class="body">туда, где она нужна:</text>
  <text x="110" y="470" class="h2">в дом, систему полива</text>
  <text x="110" y="520" class="h2">или отопления.</text>

  <g transform="translate(650 245)">
    <circle cx="180" cy="310" r="176" fill="#fafafa" stroke="#d9dde3" stroke-width="4"/>
    <path d="M44 380 Q92 346 140 380 T236 380 T332 380" fill="none" stroke="#53a9e8" stroke-width="8"/>
    <path d="M44 420 Q92 386 140 420 T236 420 T332 420" fill="none" stroke="#53a9e8" stroke-width="8" opacity=".8"/>
    <rect x="164" y="150" width="32" height="240" rx="10" fill="#cfd4da" stroke="#4b5563" stroke-width="4"/>
    <rect x="157" y="330" width="46" height="92" rx="12" fill="#56aee8" stroke="#2f6f9f" stroke-width="4"/>
    <text x="180" y="548" text-anchor="middle" class="label">ИСТОЧНИК</text>
    <text x="180" y="584" text-anchor="middle" class="small">откуда забираем воду</text>
  </g>

  <line x1="1010" y1="555" x2="1125" y2="555" class="line" stroke="#e30613" marker-end="url(#arrow)"/>

  <g transform="translate(1090 290)" filter="url(#shadow)">
    <rect x="190" y="98" width="250" height="180" rx="38" fill="#e30613" stroke="#a80008" stroke-width="5"/>
    <rect x="402" y="116" width="88" height="145" rx="28" fill="#d30712" stroke="#a80008" stroke-width="5"/>
    <circle cx="166" cy="190" r="120" fill="#ed101d" stroke="#a80008" stroke-width="6"/>
    <circle cx="166" cy="190" r="70" fill="#d4d7db" stroke="#525963" stroke-width="6"/>
    <circle cx="166" cy="190" r="43" fill="#15191d"/>
    <path d="M138 96 C172 48 230 44 264 84 L264 120 L208 120 C198 99 169 93 138 108Z" fill="#e30613" stroke="#a80008" stroke-width="5"/>
    <rect x="258" y="40" width="150" height="72" rx="14" fill="#ef1c26" stroke="#a80008" stroke-width="5"/>
    <g stroke="#8f0007" stroke-width="6"><line x1="234" y1="128" x2="234" y2="258"/><line x1="267" y1="122" x2="267" y2="262"/><line x1="300" y1="122" x2="300" y2="262"/><line x1="333" y1="122" x2="333" y2="262"/><line x1="366" y1="122" x2="366" y2="262"/></g>
    <rect x="120" y="292" width="350" height="35" rx="10" fill="#a80008"/>
    <rect x="153" y="274" width="66" height="50" rx="8" fill="#c8000a"/><rect x="378" y="274" width="66" height="50" rx="8" fill="#c8000a"/>
  </g>
  <text x="1390" y="720" text-anchor="middle" class="label">НАСОС</text>
  <text x="1390" y="758" text-anchor="middle" class="small">создаёт напор и перемещает воду</text>

  <line x1="1575" y1="555" x2="1690" y2="555" class="line" stroke="#e30613" marker-end="url(#arrow)"/>

  <g transform="translate(1620 290)">
    <path d="M38 218 L170 82 L302 218 V470 H38Z" fill="#fff" stroke="#111827" stroke-width="6"/>
    <path d="M8 234 L170 66 L332 234" fill="none" stroke="#111827" stroke-width="7"/>
    <g fill="none" stroke="#e30613" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M84 268 v82 h48 v-82"/><path d="M93 268 q15-34 30 0"/><line x1="102" y1="292" x2="102" y2="331"/><line x1="114" y1="292" x2="114" y2="331"/>
      <path d="M194 270 h58 v48 h-58z"/><circle cx="223" cy="294" r="12"/>
      <path d="M202 362 h76 v63 h-76z"/><circle cx="240" cy="393" r="22"/>
    </g>
    <g stroke="#111827" stroke-width="6" fill="none"><line x1="100" y1="435" x2="100" y2="390"/><line x1="122" y1="435" x2="122" y2="390"/><line x1="144" y1="435" x2="144" y2="390"/><line x1="166" y1="435" x2="166" y2="390"/><line x1="90" y1="435" x2="176" y2="435"/></g>
    <text x="170" y="548" text-anchor="middle" class="label">СИСТЕМА</text>
    <text x="170" y="584" text-anchor="middle" class="small">куда подаём воду</text>
  </g>

  <rect x="160" y="900" width="1600" height="112" rx="24" fill="#fff" stroke="#e30613" stroke-width="3"/>
  <circle cx="235" cy="956" r="35" fill="#fff4f4" stroke="#e30613" stroke-width="3"/>
  <path d="M217 956 h36 M235 938 v36" stroke="#e30613" stroke-width="6" stroke-linecap="round"/>
  <text x="300" y="947" class="body">Насос не создаёт воду — он</text>
  <text x="760" y="947" class="h2">перемещает её и создаёт нужный напор.</text>
</svg>