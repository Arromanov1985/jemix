<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
  <title id="title">Урок 1.1, слайд 04 — Что такое насос</title>
  <desc id="desc">Единая инфографика: красный насос перемещает воду и создаёт напор.</desc>
  <defs>
    <style>
      .h1{font:700 66px Arial,sans-serif;fill:#111827}.h2{font:700 34px Arial,sans-serif;fill:#111827}
      .body{font:400 31px Arial,sans-serif;fill:#303640}.label{font:700 25px Arial,sans-serif;fill:#111827}
      .small{font:400 24px Arial,sans-serif;fill:#303640}.red{fill:#e30613}.line{fill:none;stroke-width:6;stroke-linecap:round;stroke-linejoin:round}
    </style>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="14" stdDeviation="16" flood-opacity=".16"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#e30613"/></marker>
  </defs>
  <rect width="1920" height="1080" fill="#fff"/>
  <rect x="58" y="48" width="116" height="116" rx="18" class="red"/>
  <text x="116" y="126" text-anchor="middle" font-family="Arial" font-size="58" font-weight="700" fill="#fff">04</text>
  <text x="212" y="128" class="h1">Что такое насос</text>

  <text x="100" y="270" class="body">Насос — это устройство, которое:</text>
  <g transform="translate(110 340)">
    <circle cx="30" cy="30" r="28" fill="#fff4f4" stroke="#e30613" stroke-width="3"/>
    <path d="M17 30 l10 10 20-24" fill="none" stroke="#e30613" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="88" y="40" class="h2">забирает воду из источника</text>
  </g>
  <g transform="translate(110 445)">
    <circle cx="30" cy="30" r="28" fill="#fff4f4" stroke="#e30613" stroke-width="3"/>
    <path d="M17 30 l10 10 20-24" fill="none" stroke="#e30613" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="88" y="40" class="h2">создаёт напор</text>
  </g>
  <g transform="translate(110 550)">
    <circle cx="30" cy="30" r="28" fill="#fff4f4" stroke="#e30613" stroke-width="3"/>
    <path d="M17 30 l10 10 20-24" fill="none" stroke="#e30613" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="88" y="40" class="h2">перемещает воду к потребителю</text>
  </g>

  <g transform="translate(880 265)">
    <text x="0" y="0" text-anchor="middle" class="label">ВХОД ВОДЫ</text>
    <path d="M-220 190 C-120 130 -60 250 35 190" fill="none" stroke="#53a9e8" stroke-width="18" opacity=".85"/>
    <line x1="-260" y1="190" x2="-60" y2="190" class="line" stroke="#e30613" marker-end="url(#arrow)"/>
  </g>

  <g transform="translate(820 275)" filter="url(#shadow)">
    <rect x="240" y="170" width="300" height="210" rx="42" fill="#e30613" stroke="#a80008" stroke-width="6"/>
    <rect x="500" y="195" width="100" height="160" rx="30" fill="#cf0711" stroke="#a80008" stroke-width="6"/>
    <circle cx="210" cy="275" r="135" fill="#ee111d" stroke="#a80008" stroke-width="7"/>
    <circle cx="210" cy="275" r="76" fill="#d7dbe0" stroke="#525963" stroke-width="7"/>
    <circle cx="210" cy="275" r="46" fill="#15191d"/>
    <path d="M174 165 C218 95 285 98 326 145 L326 185 L255 185 C240 154 208 145 174 165Z" fill="#e30613" stroke="#a80008" stroke-width="6"/>
    <rect x="320" y="88" width="178" height="84" rx="15" fill="#ef1c26" stroke="#a80008" stroke-width="6"/>
    <g stroke="#8f0007" stroke-width="7"><line x1="300" y1="198" x2="300" y2="354"/><line x1="338" y1="190" x2="338" y2="362"/><line x1="376" y1="190" x2="376" y2="362"/><line x1="414" y1="190" x2="414" y2="362"/><line x1="452" y1="190" x2="452" y2="362"/></g>
    <rect x="160" y="395" width="420" height="38" rx="10" fill="#a80008"/>
    <rect x="205" y="378" width="72" height="55" rx="8" fill="#c8000a"/><rect x="472" y="378" width="72" height="55" rx="8" fill="#c8000a"/>
  </g>

  <g transform="translate(1475 265)">
    <text x="0" y="0" text-anchor="middle" class="label">ВЫХОД ВОДЫ</text>
    <line x1="-120" y1="190" x2="90" y2="190" class="line" stroke="#e30613" marker-end="url(#arrow)"/>
    <path d="M110 188 q55-55 110 0 t110 0" fill="none" stroke="#53a9e8" stroke-width="18" opacity=".85"/>
  </g>

  <rect x="180" y="855" width="1560" height="145" rx="26" fill="#fff" stroke="#e30613" stroke-width="3"/>
  <circle cx="265" cy="928" r="38" fill="#fff4f4" stroke="#e30613" stroke-width="3"/>
  <path d="M245 930 h40 M265 910 v40" stroke="#e30613" stroke-width="6" stroke-linecap="round"/>
  <text x="335" y="914" class="body">Насос не создаёт воду — он передаёт ей энергию.</text>
  <text x="335" y="962" class="h2">Результат: вода движется с нужным напором.</text>
</svg>