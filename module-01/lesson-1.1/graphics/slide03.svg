    <circle cx="164" cy="185" r="68" fill="#d4d7db" stroke="#525963" stroke-width="6"/>
    <circle cx="164" cy="185" r="42" fill="#15191d"/>
    <path d="M136 94 C170 46 226 42 260 82 L260 118 L205 118 C195 97 167 91 136 106Z" fill="#e30613" stroke="#a80008" stroke-width="5"/>
    <rect x="252" y="38" width="146" height="70" rx="14" fill="#ef1c26" stroke="#a80008" stroke-width="5"/>
    <g stroke="#8f0007" stroke-width="6"><line x1="230" y1="126" x2="230" y2="254"/><line x1="262" y1="120" x2="262" y2="258"/><line x1="294" y1="120" x2="294" y2="258"/><line x1="326" y1="120" x2="326" y2="258"/><line x1="358" y1="120" x2="358" y2="258"/></g>
    <rect x="118" y="286" width="338" height="34" rx="10" fill="#a80008"/>
    <rect x="150" y="270" width="64" height="48" rx="8" fill="#c8000a"/><rect x="365" y="270" width="64" height="48" rx="8" fill="#c8000a"/>
  </g>
  <text x="1345" y="278" text-anchor="middle" class="label">НАСОС</text>
  <text x="1345" y="820" text-anchor="middle" class="small">создаёт напор и перемещает воду</text>
  <line x1="1578" y1="500" x2="1700" y2="500" class="line red-stroke" marker-end="url(#arrow)"/>

  <g transform="translate(1640 275)">
    <path d="M25 188 L160 54 L295 188 V444 H25Z" fill="#fff" stroke="#111827" stroke-width="6"/>
    <path d="M-6 205 L160 38 L326 205" fill="none" stroke="#111827" stroke-width="7"/>
    <g fill="none" stroke="#e30613" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M66 242 v82 h48 v-82"/><path d="M75 242 q15-34 30 0"/><line x1="84" y1="266" x2="84" y2="305"/><line x1="96" y1="266" x2="96" y2="305"/>
      <path d="M176 243 h58 v48 h-58z"/><circle cx="205" cy="267" r="12"/>
      <path d="M184 334 h76 v63 h-76z"/><circle cx="222" cy="365" r="22"/>
