    <g stroke="#111827" stroke-width="6" fill="none"><line x1="82" y1="407" x2="82" y2="362"/><line x1="104" y1="407" x2="104" y2="362"/><line x1="126" y1="407" x2="126" y2="362"/><line x1="148" y1="407" x2="148" y2="362"/><line x1="72" y1="407" x2="158" y2="407"/></g>
  </g>
  <text x="1800" y="278" text-anchor="middle" class="label">СИСТЕМА ДОМА</text>

  <rect x="160" y="900" width="1600" height="112" rx="24" fill="#fff" stroke="#e30613" stroke-width="3"/>
  <circle cx="235" cy="956" r="35" fill="#fff4f4" stroke="#e30613" stroke-width="3"/>
  <path d="M225 958 l12 12 24-30" fill="none" stroke="#e30613" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="300" y="947" class="body">Правильное понимание работы насоса помогает подобрать</text>
  <text x="300" y="988" class="h2">надёжное решение и избежать ошибок.</text>
