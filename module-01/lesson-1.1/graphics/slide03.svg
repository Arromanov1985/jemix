<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
  <title id="title">Урок 1.1, слайд 03 — Почему тема важна?</title>
  <desc id="desc">Единая инфографика JEMIX Academy: источник воды, красный насос и система дома.</desc>
  <defs>
    <style>
      .h1{font:700 66px Arial,sans-serif;fill:#111827}.h2{font:700 34px Arial,sans-serif;fill:#111827}
      .body{font:400 30px Arial,sans-serif;fill:#303640}.label{font:700 25px Arial,sans-serif;fill:#111827}
      .small{font:400 23px Arial,sans-serif;fill:#303640}.red{fill:#e30613}.red-stroke{stroke:#e30613}
      .gray{stroke:#9aa1aa}.line{fill:none;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
    </style>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="12" stdDeviation="14" flood-opacity=".14"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#e30613"/></marker>
  </defs>
  <rect width="1920" height="1080" fill="#fff"/>
  <rect x="58" y="48" width="116" height="116" rx="18" class="red"/>
  <text x="116" y="126" text-anchor="middle" font-family="Arial" font-size="58" font-weight="700" fill="#fff">03</text>
  <text x="212" y="128" class="h1">Почему тема важна?</text>

  <text x="92" y="266" class="body">Насосное оборудование — основа</text>
  <text x="92" y="318" class="body">водоснабжения и отопления.</text>
  <text x="92" y="398" class="body">Понимание принципов работы помогает</text>
  <text x="92" y="450" class="body">правильно подобрать оборудование</text>
  <text x="92" y="502" class="body">и избежать ошибок.</text>

  <circle cx="790" cy="500" r="185" fill="#fafafa" stroke="#d9dde3" stroke-width="4"/>
  <text x="790" y="278" text-anchor="middle" class="label">ИСТОЧНИК ВОДЫ</text>
  <path d="M690 557 Q735 525 780 557 T870 557 T950 557" fill="none" stroke="#53a9e8" stroke-width="7"/>
  <path d="M690 595 Q735 563 780 595 T870 595 T950 595" fill="none" stroke="#53a9e8" stroke-width="7" opacity=".8"/>
  <rect x="776" y="368" width="28" height="202" rx="10" fill="#cfd4da" stroke="#4b5563" stroke-width="4"/>
  <rect x="770" y="528" width="40" height="86" rx="12" fill="#56aee8" stroke="#2f6f9f" stroke-width="4"/>
  <line x1="972" y1="500" x2="1110" y2="500" class="line red-stroke" marker-end="url(#arrow)"/>

  <g transform="translate(1115 325)" filter="url(#shadow)">
    <rect x="186" y="96" width="242" height="178" rx="38" fill="#e30613" stroke="#a80008" stroke-width="5"/>
