title: "JEMIX Academy - 1.4 Основные виды насосов"
module: 1
lesson: 4
duration_min: 25
slides:
  - type: text
    title: "1.4 Основные виды насосов"
    body: "<h3 style='color:#e30613'>JEMIX Academy · Модуль 1</h3><p>Основы насосной техники</p>"
  - type: text
    title: "Цели обучения"
    body: "<ul><li>назвать основные виды насосов;</li><li>отличать поверхностные насосы от погружных;</li><li>понимать разницу между насосами для чистой воды, дренажа и стоков;</li><li>определять группу насоса по задаче клиента.</li></ul>"
  - type: text
    title: "Почему насосы бывают разными?"
    body: "<p>Нет одного универсального насоса для всех задач. Насос для отопления, насос для скважины и насос для канализации работают в разных условиях и решают разные задачи.</p><p><strong>Правило:</strong> сначала задача, потом тип насоса, затем модель.</p>"
  - type: text
    title: "Основные группы"
    body: "<ul><li>Поверхностные — насос стоит вне воды.</li><li>Погружные — насос работает в жидкости.</li><li>Циркуляционные — движение воды по замкнутому контуру.</li><li>Дренажные — быстрая откачка воды.</li><li>Фекальные — стоки и крупные включения.</li><li>Повышающие — увеличение давления.</li></ul>"
  - type: quiz
    title: "Квиз 1"
    question: "Какой насос обычно применяют в системе отопления?"
    answers: ["Дренажный", "Циркуляционный", "Фекальный", "Скважинный"]
    correct: 1
  - type: text
    title: "Поверхностные и погружные"
    body: "<p><strong>Поверхностный насос</strong> устанавливается рядом с источником и работает вне воды.</p><p><strong>Погружной насос</strong> опускается в воду и поднимает жидкость из источника.</p>"
  - type: quiz
    title: "Квиз 2"
    question: "Где работает погружной насос?"
    answers: ["Внутри жидкости", "Только на стене", "Только в сухом помещении", "Только на трубопроводе отопления"]
    correct: 0
  - type: text
    title: "По типу жидкости"
    body: "<ul><li>Чистая вода — водоснабжение, скважины, колодцы.</li><li>Слабозагрязнённая вода — дренаж, ливневая вода, приямки.</li><li>Сточные воды — канализация, септики, фекальные насосы.</li></ul>"
  - type: quiz
    title: "Квиз 3"
    question: "Что важно учитывать при выборе насоса для грязной воды?"
    answers: ["Цвет корпуса", "Размер пропускаемых частиц", "Длину упаковки", "Только мощность"]
    correct: 1
  - type: text
    title: "Дренажные и фекальные насосы"
    body: "<p>Дренажные насосы применяют для откачки воды из подвалов, приямков, ёмкостей и котлованов. Фекальные насосы предназначены для сточных вод и более тяжёлых условий.</p>"
  - type: true_false
    title: "Квиз 4"
    question: "Дренажный насос обычно выбирают для циркуляции воды в системе отопления."
    correct: false
  - type: quiz
    title: "Мини-кейс"
    question: "Клиенту нужно водоснабжение дома из скважины глубиной 35 м. Какая группа насоса наиболее вероятна?"
    answers: ["Циркуляционный", "Скважинный", "Дренажный", "Фекальный"]
    correct: 1
  - type: text
    title: "Итоги урока"
    body: "<ul><li>Насосы делятся по установке, задаче и типу жидкости.</li><li>Поверхностный насос стоит вне воды, погружной работает в жидкости.</li><li>Для отопления применяют циркуляционные насосы.</li><li>Для откачки воды — дренажные.</li><li>Для скважины — скважинные.</li></ul>"
