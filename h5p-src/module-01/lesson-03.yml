title: "JEMIX Academy - 1.3 История насосов"
module: 1
lesson: 3
duration_min: 20
slides:
  - type: text
    title: "1.3 История насосов"
    body: "<h3 style='color:#e30613'>JEMIX Academy · Модуль 1</h3><p>Основы насосной техники</p>"
  - type: text
    title: "Цели обучения"
    body: "<ul><li>понимать, как развивалась насосная техника;</li><li>объяснить, почему современные насосы стали автоматическими;</li><li>связать историю насосов с современными решениями JEMIX.</li></ul>"
  - type: text
    title: "Зачем знать историю насосов?"
    body: "<p>История насосов показывает одну главную идею: человеку всегда нужно было перемещать воду туда, где она нужна.</p><p>Менялись источники энергии, материалы и автоматика, но задача оставалась прежней: подать жидкость с нужным расходом и напором.</p>"
  - type: quiz
    title: "Квиз 1"
    question: "Какая главная задача насосной техники сохранялась на протяжении всей истории?"
    answers: ["Украшать водоёмы", "Перемещать жидкость туда, где она нужна", "Изменять цвет воды", "Заменять трубопровод"]
    correct: 1
  - type: text
    title: "От древности до автоматики"
    body: "<ul><li>Шадуф — ручной водоподъём.</li><li>Винт Архимеда — механический подъём воды.</li><li>Поршневые насосы — развитие механизации.</li><li>Центробежные насосы — массовое применение.</li><li>Современные насосы — автоматика, защита, комфорт.</li></ul>"
  - type: text
    title: "Архимедов винт"
    body: "<p>Один из древнейших водоподъёмных механизмов — винт Архимеда. Он использовался для подъёма воды на небольшую высоту и до сих пор применяется в некоторых специальных задачах.</p>"
  - type: true_false
    title: "Квиз 2"
    question: "Архимедов винт относится к древним способам подъёма воды."
    correct: true
  - type: text
    title: "Электропривод"
    body: "<p>Появление электродвигателей сделало насосы компактными, надёжными и доступными. Насос можно стало устанавливать в доме, на даче, в скважине, котельной или системе отопления.</p>"
  - type: quiz
    title: "Квиз 3"
    question: "Что стало важным этапом развития бытовых насосов?"
    answers: ["Появление электродвигателя", "Отказ от труб", "Использование только ручного труда", "Запрет автоматики"]
    correct: 0
  - type: text
    title: "Современный этап"
    body: "<p>Современный насос — это уже не только двигатель и рабочее колесо. Это система с защитой, реле, датчиками, гидроаккумулятором и удобным монтажом.</p>"
  - type: quiz
    title: "Квиз 4"
    question: "Почему современный насос нужно рассматривать как часть системы?"
    answers: ["Потому что он работает вместе с трубами, арматурой, автоматикой и потребителями", "Потому что насос не имеет двигателя", "Потому что трубы не влияют на работу", "Потому что автоматика всегда не нужна"]
    correct: 0
  - type: text
    title: "Итоги урока"
    body: "<ul><li>Насосная техника развивалась от ручного водоподъёма к автоматическим системам.</li><li>Главная задача всегда одна: переместить жидкость с нужными параметрами.</li><li>Современный насос работает как часть инженерной системы.</li></ul>"
