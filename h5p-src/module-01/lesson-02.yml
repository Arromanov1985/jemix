title: "JEMIX Academy - 1.2 Где применяются насосы"
module: 1
lesson: 2
duration_min: 20
slides:
  - type: text
    title: "1.2 Где применяются насосы?"
    body: "<h3 style='color:#e30613'>JEMIX Academy · Модуль 1</h3><p>Основы насосной техники</p>"
  - type: text
    title: "Цели обучения"
    body: "<ul><li>объяснить, где применяются насосы;</li><li>связать задачу с типом насоса;</li><li>различать бытовые и промышленные области применения;</li><li>назвать основные группы насосов JEMIX.</li></ul>"
  - type: text
    title: "Насосы окружают нас каждый день"
    body: "<p>Насосы работают в водоснабжении, отоплении, канализации, дренажных системах, бытовой технике, коммунальном хозяйстве и промышленности.</p><p><strong>Главная мысль:</strong> насос выбирают не по названию, а по задаче.</p>"
  - type: quiz
    title: "Квиз 1"
    question: "Что является правильным утверждением?"
    answers: ["Насос производит воду", "Насос передает жидкости энергию", "Насос всегда очищает воду", "Насос нужен только в промышленности"]
    correct: 1
  - type: text
    title: "Насосы в частном доме"
    body: "<ul><li>Скважина — подача воды из источника.</li><li>Отопление — циркуляция теплоносителя.</li><li>Дренаж — откачка воды из подвала.</li><li>Канализация — перекачка стоков.</li></ul>"
  - type: quiz
    title: "Квиз 2"
    question: "Какой насос чаще применяют для движения теплоносителя в отоплении?"
    answers: ["Дренажный", "Циркуляционный", "Фекальный", "Вибрационный"]
    correct: 1
  - type: text
    title: "Насосы на даче и участке"
    body: "<ul><li>Полив — подача воды на участок.</li><li>Ёмкости — перекачка воды из баков.</li><li>Дренаж — откачка дождевой воды.</li><li>Колодец — подача воды в дом или систему полива.</li></ul>"
  - type: quiz
    title: "Квиз 3"
    question: "Что обычно используют для откачки воды из подвала?"
    answers: ["Скважинный насос", "Дренажный насос", "Циркуляционный насос", "Повышающий насос"]
    correct: 1
  - type: text
    title: "Основные группы JEMIX"
    body: "<ul><li>Автоматические насосные станции.</li><li>Поверхностные насосы.</li><li>Скважинные насосы.</li><li>Дренажные и фекальные насосы.</li><li>Повышающие и циркуляционные насосы.</li></ul>"
  - type: true_false
    title: "Квиз 4"
    question: "Один универсальный насос подходит для скважины, отопления, дренажа и канализации."
    correct: false
  - type: quiz
    title: "Мини-кейс"
    question: "Клиент говорит: «Нужно откачать воду из затопленного подвала». Что предложить в первую очередь?"
    answers: ["Дренажный насос", "Циркуляционный насос", "Поверхностный насос для чистой воды", "Повышающий насос"]
    correct: 0
  - type: text
    title: "Итоги урока"
    body: "<ul><li>Насосы применяются почти во всех инженерных системах.</li><li>Тип насоса зависит от задачи, жидкости и условий работы.</li><li>Правильный подбор начинается с вопроса: что нужно сделать?</li></ul>"
