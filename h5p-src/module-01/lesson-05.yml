title: "JEMIX Academy - 1.5 Ассортимент JEMIX"
module: 1
lesson: 5
duration_min: 25
slides:
  - type: text
    title: "1.5 Ассортимент JEMIX"
    body: "<h3 style='color:#e30613'>JEMIX Academy · Модуль 1</h3><p>Основы насосной техники</p>"
  - type: text
    title: "Цели обучения"
    body: "<ul><li>назвать основные группы насосного оборудования JEMIX;</li><li>понимать, для каких задач применяется каждая группа;</li><li>объяснить клиенту логику выбора раздела каталога;</li><li>подготовиться к подробному изучению каждой линейки.</li></ul>"
  - type: text
    title: "Что такое ассортимент JEMIX?"
    body: "<p>Ассортимент JEMIX — это набор групп насосного оборудования для разных инженерных задач: водоснабжение, отопление, дренаж, канализация, повышение давления и работа с источниками воды.</p><p><strong>Важно:</strong> в следующих модулях все модели и характеристики разбираются только по официальному каталогу JEMIX.</p>"
  - type: text
    title: "Карта разделов"
    body: "<ul><li>Автоматические насосные станции.</li><li>Поверхностные насосы.</li><li>Скважинные насосы.</li><li>Винтовые насосы.</li><li>Колодезные насосы.</li><li>Дренажные насосы.</li><li>Фекальные насосы.</li><li>Канализационные и туалетные насосы.</li><li>Повышающие и циркуляционные насосы.</li></ul>"
  - type: quiz
    title: "Квиз 1"
    question: "С чего начинается работа с ассортиментом JEMIX?"
    answers: ["С выбора самой мощной модели", "С определения задачи клиента", "С цвета корпуса", "С цены без учета условий"]
    correct: 1
  - type: text
    title: "Группы для водоснабжения"
    body: "<ul><li>автоматические насосные станции;</li><li>поверхностные насосы;</li><li>скважинные насосы;</li><li>колодезные насосы;</li><li>винтовые насосы.</li></ul><p>Выбор зависит от источника воды, глубины, расхода и требуемого давления.</p>"
  - type: quiz
    title: "Квиз 2"
    question: "Какая группа чаще всего связана с подачей воды из глубокой скважины?"
    answers: ["Циркуляционные насосы", "Скважинные насосы", "Дренажные насосы", "Туалетные установки"]
    correct: 1
  - type: text
    title: "Группы для откачки и стоков"
    body: "<ul><li>дренажные насосы — для откачки воды;</li><li>фекальные насосы — для стоков и включений;</li><li>канализационные погружные насосы — для систем водоотведения;</li><li>туалетные насосы — для санузлов, где невозможен самотёк.</li></ul>"
  - type: quiz
    title: "Квиз 3"
    question: "Что обычно применяют для откачки воды из подвала или приямка?"
    answers: ["Дренажный насос", "Циркуляционный насос", "Повышающий насос", "Скважинный насос"]
    correct: 0
  - type: text
    title: "Отопление и повышение давления"
    body: "<p><strong>Циркуляционные насосы</strong> применяют для отопления, ГВС и тёплого пола.</p><p><strong>Повышающие насосы</strong> применяют для увеличения давления в системе водоснабжения.</p>"
  - type: true_false
    title: "Квиз 4"
    question: "Циркуляционный насос обычно применяют для движения теплоносителя в системе отопления."
    correct: true
  - type: quiz
    title: "Мини-кейс"
    question: "Клиент говорит: «В доме слабое давление воды, источник уже есть». С какой группой оборудования стоит работать в первую очередь?"
    answers: ["Повышающие насосы", "Фекальные насосы", "Дренажные насосы", "Винтовые насосы"]
    correct: 0
  - type: text
    title: "Итоги урока"
    body: "<ul><li>Ассортимент JEMIX делится по задачам и условиям работы.</li><li>Для водоснабжения применяют станции, поверхностные, скважинные, колодезные и винтовые насосы.</li><li>Для откачки и стоков — дренажные, фекальные, канализационные и туалетные насосы.</li><li>Для отопления — циркуляционные насосы.</li><li>Для слабого давления — повышающие насосы.</li></ul>"
