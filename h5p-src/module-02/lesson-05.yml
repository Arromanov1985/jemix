title: "JEMIX Academy - 2.5 Итоговый расчётный кейс"
module: 2
lesson: 5
duration_min: 30
slides:
  - type: text
    title: "2.5 Итоговый расчётный кейс"
    body: "<h3 style='color:#e30613'>JEMIX Academy · Модуль 2</h3><p>Гидравлика</p>"
  - type: text
    title: "Цели обучения"
    body: "<ul><li>собрать исходные данные для подбора насоса;</li><li>посчитать требуемый напор;</li><li>учесть давление и потери;</li><li>понять, где находится рабочая точка;</li><li>избежать типичных ошибок в расчёте.</li></ul>"
  - type: text
    title: "Условие задачи"
    body: "<p>Есть частный дом на 2 этажа. Источник воды — колодец. Нужно подобрать насос для стабильного водоснабжения.</p><ul><li>Геометрическая высота: 12 м;</li><li>Длина трассы: 25 м;</li><li>Желаемое давление у потребителя: 2 бар;</li><li>Ориентировочный расход: 2,5 м³/ч;</li><li>Потери в трубах и арматуре: 7 м.</li></ul>"
  - type: quiz
    title: "Квиз 1"
    question: "С чего начинается подбор насоса?"
    answers: ["С задачи и исходных данных", "С цвета корпуса", "С самой высокой мощности", "С веса упаковки"]
    correct: 0
  - type: text
    title: "Шаг 1. Расход"
    body: "<p>Расход показывает, сколько воды должна подать система за единицу времени. В этом кейсе принимаем ориентировочный расход <strong>2,5 м³/ч</strong>.</p>"
  - type: quiz
    title: "Квиз 2"
    question: "Что показывает расход?"
    answers: ["Сколько воды проходит за время", "Высоту подъёма воды", "Цвет воды", "Материал корпуса"]
    correct: 0
  - type: text
    title: "Шаг 2. Давление"
    body: "<p>Требуемое давление у потребителя — <strong>2 бар</strong>. Для быстрого расчёта используем правило: <strong>1 бар ≈ 10 м водяного столба</strong>. Значит, 2 бар ≈ 20 м напора.</p>"
  - type: quiz
    title: "Квиз 3"
    question: "Сколько примерно метров водяного столба соответствует 2 бар?"
    answers: ["2 м", "10 м", "20 м", "40 м"]
    correct: 2
  - type: text
    title: "Шаг 3. Общий напор"
    body: "<p>Считаем: H = Hгео + Hдавл + Hпотерь + Hзапас.</p><ul><li>Hгео = 12 м;</li><li>Hдавл = 20 м;</li><li>Hпотерь = 7 м;</li><li>Hзапас = 3 м.</li></ul><p><strong>Итого: H = 42 м.</strong></p>"
  - type: quiz
    title: "Квиз 4"
    question: "Если Hгео = 12 м, Hдавл = 20 м, Hпотерь = 7 м и запас = 3 м, чему равен общий напор?"
    answers: ["32 м", "39 м", "42 м", "52 м"]
    correct: 2
  - type: text
    title: "Рабочая точка"
    body: "<p>В этом кейсе насос должен обеспечить примерно <strong>2,5 м³/ч при 42 м</strong>. Подбор выполняется по рабочей точке, а не только по максимальному расходу или максимальному напору.</p>"
  - type: true_false
    title: "Квиз 5"
    question: "Для выбора насоса достаточно знать только максимальный напор Hmax."
    correct: false
  - type: text
    title: "Типичные ошибки расчёта"
    body: "<ul><li>Не учитывают потери в трубах и фильтрах.</li><li>Путают давление в барах и напор в метрах.</li><li>Выбирают насос только по максимальному расходу.</li><li>Не проверяют рабочую точку.</li><li>Не учитывают высоту всасывания и риск кавитации.</li></ul>"
  - type: text
    title: "Итоги урока"
    body: "<ul><li>Подбор начинается с задачи и исходных данных.</li><li>1 бар ≈ 10 м водяного столба.</li><li>Общий напор складывается из высоты, давления, потерь и запаса.</li><li>В нашем кейсе требуется около 2,5 м³/ч при 42 м.</li><li>Дальше насос выбирают по рабочей точке, а не по Qmax/Hmax.</li></ul>"
