title: "JEMIX Academy - 2.4 Кавитация и высота всасывания"
module: 2
lesson: 4
duration_min: 25
slides:
  - type: text
    title: "2.4 Кавитация и высота всасывания"
    body: "<h3 style='color:#e30613'>JEMIX Academy · Модуль 2</h3><p>Гидравлика</p>"
  - type: text
    title: "Цели обучения"
    body: "<ul><li>объяснить, что такое кавитация;</li><li>назвать причины её появления;</li><li>понимать ограничение по высоте всасывания;</li><li>избегать типичных ошибок монтажа.</li></ul>"
  - type: text
    title: "Что такое кавитация?"
    body: "<p><strong>Кавитация</strong> — это образование паровых пузырьков в жидкости при слишком низком давлении и их последующее схлопывание в зоне более высокого давления.</p><p><strong>Важно:</strong> кавитация разрушает рабочее колесо и снижает ресурс насоса.</p>"
  - type: quiz
    title: "Квиз 1"
    question: "Что чаще всего вызывает кавитацию на входе насоса?"
    answers: ["Недостаточное давление на входе", "Слишком большой гидроаккумулятор", "Цвет корпуса насоса", "Большое напряжение сети"]
    correct: 0
  - type: text
    title: "Как появляется кавитация"
    body: "<ol><li>На входе насоса падает давление.</li><li>Вода частично превращается в паровые пузырьки.</li><li>Пузырьки попадают в зону более высокого давления.</li><li>Они схлопываются.</li><li>Возникают микрогидроудары по рабочему колесу.</li></ol>"
  - type: quiz
    title: "Квиз 2"
    question: "Какой признак может указывать на кавитацию?"
    answers: ["Шум и вибрация насоса", "Идеально тихая работа", "Увеличение КПД", "Отсутствие воды в трубах всегда без шума"]
    correct: 0
  - type: text
    title: "Высота всасывания"
    body: "<p>Поверхностный насос не всасывает воду с любой глубины. В реальных условиях практический предел высоты всасывания обычно составляет около <strong>7–8 м</strong>.</p>"
  - type: quiz
    title: "Квиз 3"
    question: "Какой практический предел высоты всасывания обычно используют для обычных поверхностных насосов?"
    answers: ["1–2 м", "7–8 м", "20–25 м", "50 м"]
    correct: 1
  - type: text
    title: "Причины кавитации"
    body: "<ul><li>Большая высота всасывания.</li><li>Длинная всасывающая линия.</li><li>Малый диаметр трубы.</li><li>Подсос воздуха.</li><li>Грязный фильтр.</li><li>Горячая вода.</li></ul>"
  - type: quiz
    title: "Квиз 4"
    question: "Почему обычный поверхностный насос плохо подходит для подъёма воды с глубины 12 м?"
    answers: ["Из-за ограничения атмосферного давления и высоты всасывания", "Потому что вода слишком тяжёлая по цвету", "Потому что труба всегда замерзает", "Потому что насос не имеет рабочего колеса"]
    correct: 0
  - type: true_false
    title: "Квиз 5"
    question: "Подсос воздуха на всасывающей линии может усилить кавитацию и нарушить работу насоса."
    correct: true
  - type: text
    title: "Итоги урока"
    body: "<ul><li>Кавитация возникает при недостаточном давлении на входе насоса.</li><li>Она вызывает шум, вибрацию, падение подачи и разрушение рабочего колеса.</li><li>Практический предел всасывания обычного поверхностного насоса — около 7–8 м.</li><li>При большей глубине нужны другие решения: погружной или скважинный насос.</li></ul>"
