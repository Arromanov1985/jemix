id: "2.5"
title: "Типичные неисправности и диагностика"
module: 2
lesson: "2_5"
format: "H5P Course Presentation"
status: "v1_h5p_ready"
h5p_file: "h5p/JEMIX_Academy_2_5_Tipichnye_neispravnosti_i_diagnostika.h5p"

objectives:
  - Различать симптом и причину неисправности.
  - Задавать правильные вопросы клиенту.
  - Знать простые проверки без разборки насоса.
  - Понимать, когда проблему нужно передать в сервис.
  - Избегать опасных обещаний и неверной диагностики.

slides:
  - type: title
    title: "2.5 Типичные неисправности и диагностика"
    body: "Как продавцу правильно опросить клиента, найти вероятную причину и не обещать лишнего."
  - type: image
    title: "Логика диагностики"
    asset: "diagnostic_flow.png"
  - type: image
    title: "Симптомы и вероятные причины"
    asset: "symptom_table.png"
  - type: theory
    title: "Симптом ≠ причина"
    body: "Клиент обычно описывает симптом: не качает, слабый напор, шумит, часто включается. Задача продавца — уточнить условия работы, монтаж, источник воды, автоматику и историю проблемы."
  - type: quiz
    title: "Квиз 1"
    question: "Клиент говорит: «Насос не качает». Что правильно сделать сначала?"
    answers:
      - "Уточнить условия и проверить базовые причины"
      - "Сразу обещать замену"
      - "Сразу обвинить насос"
      - "Посоветовать любой другой насос"
    correct: 0
  - type: image
    title: "Первые вопросы клиенту"
    asset: "first_questions.png"
  - type: image
    title: "Простые проверки без разборки"
    asset: "simple_checks.png"
  - type: theory
    title: "Ситуация: насос не качает"
    body: "Первые проверки: есть ли вода в источнике, заполнена ли линия, нет ли воздуха, правильно ли стоит обратный клапан, не забит ли фильтр, есть ли питание и не сработала ли защита."
  - type: theory
    title: "Ситуация: слабый напор"
    body: "Слабый напор может быть связан не только с насосом. Частые причины: забитый фильтр, узкая или длинная труба, потери в системе, неправильный подбор, подсос воздуха или падение уровня воды."
  - type: quiz
    title: "Квиз 2"
    question: "Что может вызвать слабый напор?"
    answers:
      - "Забитый фильтр, потери, подсос воздуха или неверный подбор"
      - "Только цвет корпуса"
      - "Только название насоса"
      - "Только наклейка на коробке"
    correct: 0
  - type: theory
    title: "Ситуация: частые включения"
    body: "Если насос часто включается и выключается, проверяют гидроаккумулятор, давление воздуха в баке, утечки, обратный клапан и настройки реле давления."
  - type: theory
    title: "Ситуация: шум и вибрация"
    body: "Шум может указывать на воздух в системе, неправильный режим, кавитацию, механическую проблему, загрязнение или неправильное крепление. Если звук необычный и есть риск повреждения — лучше направить в сервис."
  - type: case
    title: "Кейс 1"
    situation: "Насос часто включается, даже когда водой почти не пользуются."
    correct_solution: "Проверить утечки, гидробак, обратный клапан и реле."
  - type: case
    title: "Кейс 2"
    situation: "Насос выбивает автомат защиты."
    correct_solution: "Не вскрывать, проверить базовые условия и направить в сервис/электрику."
  - type: image
    title: "Что продавец не должен обещать"
    asset: "do_not_do.png"
  - type: image
    title: "Когда отправлять в сервис"
    asset: "service_reasons.png"
  - type: true_false
    title: "Проверка"
    question: "Продавец должен обещать точную причину неисправности без осмотра системы и насоса."
    correct: false
  - type: checklist
    title: "Чек-лист диагностики"
    items:
      - "Какой симптом и когда начался?"
      - "Какой насос и какая система?"
      - "Есть ли вода в источнике?"
      - "Есть ли питание и не сработала ли защита?"
      - "Что показывает манометр?"
      - "Есть ли утечки, воздух, засор фильтра?"
      - "Меняли ли трубы, клапаны, автоматику или настройки?"
      - "Нужен ли сервисный осмотр?"
  - type: quiz
    title: "Итоговый тест 1"
    question: "Что сначала проверяют при частых пусках насоса?"
    answers:
      - "Гидроаккумулятор, утечки, обратный клапан и настройки"
      - "Только цвет насоса"
      - "Только высоту коробки"
      - "Только дату покупки"
    correct: 0
  - type: true_false
    title: "Итоговый тест 2"
    question: "Запах гари, выбивание автомата и подозрение на заклинивание — повод направить насос в сервис."
    correct: true
  - type: summary
    title: "Итоги"
    body: "Диагностика начинается с симптома и условий работы. Модуль 2 готов к итоговому тесту."
