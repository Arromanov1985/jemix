lesson: 2.4
title: Кавитация и высота всасывания
questions:
  - type: single_choice
    title: Что такое кавитация?
    options:
      - text: Появление и схлопывание пузырьков в потоке воды
        correct: true
      - text: Обычная замена фильтра
        correct: false
      - text: Цвет корпуса насоса
        correct: false
    feedback: Кавитация связана с пузырьками, которые возникают и схлопываются внутри потока.
  - type: true_false
    title: Поверхностный насос может стабильно всасывать воду с любой глубины.
    correct: false
    feedback: У поверхностных насосов есть ограничения по высоте всасывания.
  - type: matching
    title: Соотнесите проблему и возможную причину
    pairs:
      - left: Насос трещит
        right: Риск кавитации
      - left: Вода идёт рывками
        right: Подсос воздуха
      - left: Источник глубоко
        right: Превышение высоты всасывания
      - left: Длинная всасывающая труба
        right: Больше сопротивление
  - type: single_choice
    title: Что сделать, если уровень воды слишком глубоко для поверхностного насоса?
    options:
      - text: Рассмотреть погружной насос
        correct: true
      - text: Просто выбрать насос другого цвета
        correct: false
      - text: Не учитывать глубину
        correct: false
    feedback: Если условия всасывания неподходящие, часто требуется погружное решение.
