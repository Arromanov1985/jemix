    title: "Финальный кейс"
    situation: "Дом питается из скважины. Клиенту нужны стабильное давление, меньше частых пусков и защита при падении уровня воды."
    correct_solution: "Насос + автоматика/реле + гидроаккумулятор + защита сухого хода + правильная обвязка."
  - type: summary
    title: "Итоги модуля 2"
    body: "Модуль 2 завершён. Насос подбирают как часть системы: источник, расход, напор, потери, автоматика, монтаж и диагностика."
