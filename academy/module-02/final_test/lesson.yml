objectives:
  - Проверить понимание систем водоснабжения.
  - Проверить расчёт расхода, напора, потерь и рабочей точки.
  - Проверить знание автоматики, гидроаккумулятора и защиты насоса.
  - Проверить понимание монтажа, обвязки и типовых схем подключения.
  - Проверить базовую диагностику типичных неисправностей.

