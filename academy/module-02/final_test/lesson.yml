      - "Если клиент спросил цену"
      - "Если нужна консультация по цвету"
      - "Если нужна новая коробка"
    correct: 0
  - type: true_false
    title: "Верно / неверно 1"
    question: "Для подбора насоса достаточно знать только высоту подъёма воды."
