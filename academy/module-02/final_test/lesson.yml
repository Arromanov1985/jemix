  - type: instructions
    title: "Перед стартом"
    body: "Отвечайте как консультант: насос работает не сам по себе, а в системе. Учитывайте источник, расход, напор, потери, автоматику, монтаж и симптомы."
  - type: quiz
    title: "Вопрос 1"
    question: "Что входит в бытовую систему водоснабжения кроме насоса?"
    answers:
      - "Источник, трубы, автоматика, бак, клапаны, фильтры и потребители"
