lesson: 2.2
title: Потери напора
questions:
  - type: single_choice
    title: Что создаёт потери напора?
    options:
      - text: Трубы, повороты, фильтры и арматура
        correct: true
      - text: Только цвет корпуса насоса
        correct: false
      - text: Только название бренда
        correct: false
    feedback: Сопротивление создают элементы системы, через которые проходит вода.
  - type: true_false
    title: Загрязнённый фильтр может снизить напор у потребителя.
    correct: true
    feedback: Загрязнение фильтра увеличивает сопротивление и снижает фактический напор.
  - type: matching
    title: Соотнесите фактор и эффект
    pairs:
      - left: Длинная труба
        right: Больше сопротивление
      - left: Узкая труба
        right: Выше потери
      - left: Загрязнённый фильтр
        right: Слабее напор
      - left: Подъём на второй этаж
        right: Требуется запас напора
  - type: single_choice
    title: Почему нельзя смотреть только на максимальный напор насоса?
    options:
      - text: В реальной системе часть напора теряется
        correct: true
      - text: Максимальный напор всегда равен нулю
        correct: false
      - text: Напор не влияет на подбор
        correct: false
    feedback: В системе есть потери, поэтому паспортный максимум не равен результату у потребителя.
