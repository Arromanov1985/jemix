id: "2.1"
title: "Системы водоснабжения"
module: 2
lesson: "2_1"
format: "H5P Course Presentation"
status: "v1_h5p_ready"
h5p_file: "h5p/JEMIX_Academy_2_1_Sistemy_vodosnabzheniya.h5p"

objectives:
  - Понять состав бытовой системы водоснабжения.
  - Различать источники воды.
  - Связать источник с выбором насоса.
  - Понимать роль автоматики, гидроаккумулятора и обвязки.
  - Видеть типичные ошибки при сборке системы.

slides:
  - type: title
    title: "2.1 Системы водоснабжения"
    body: "Откуда берём воду, куда подаём и какие элементы нужны в системе."
  - type: image
    title: "Схема бытового водоснабжения"
    asset: "water_supply_scheme.png"
  - type: image
    title: "Задачи системы водоснабжения"
    asset: "water_supply_tasks.png"
  - type: theory
    title: "Что делает система водоснабжения"
    body: "Система водоснабжения должна стабильно доставить воду от источника к потребителю с нужным расходом и давлением. Подбирают не только насос, но и автоматику, гидроаккумулятор, клапаны, фильтры, трубы и фитинги."
  - type: quiz
    title: "Квиз 1"
    question: "Что является задачей системы водоснабжения?"
    answers:
      - "Доставить воду с нужным расходом и давлением"
      - "Только украсить насос"
      - "Только измерить температуру"
      - "Только изменить цвет воды"
    correct: 0
  - type: image
    title: "Типовые источники воды"
    asset: "water_sources.png"
  - type: image
    title: "Источник воды влияет на выбор насоса"
    asset: "sources_depth.png"
  - type: theory
    title: "Источник влияет на насос"
    body: "Для колодца, скважины, ёмкости или магистрали условия разные. Важны глубина до воды, дебит источника, качество воды, уровень воды, давление на входе и риск сухого хода."
  - type: quiz
    title: "Квиз 2"
    question: "Почему источник воды важен для подбора?"
    answers:
      - "Он влияет на тип насоса, глубину, защиту и обвязку"
      - "Он влияет только на цвет корпуса"
      - "Он не влияет на подбор"
      - "Он нужен только для упаковки"
    correct: 0
  - type: image
    title: "Потребители в доме"
    asset: "house_consumers.png"
  - type: theory
    title: "Потребители и расход"
    body: "Чем больше точек водоразбора может работать одновременно, тем выше требуемый расход. Душ, полив и несколько открытых кранов создают разные требования к системе."
  - type: theory
    title: "Давление и комфорт"
    body: "Для клиента результат ощущается как стабильный напор в душе и кранах. Продавец должен учитывать высоту подъёма, потери в трубах, фильтры, клапаны и требуемое давление."
  - type: case
    title: "Кейс 1"
    situation: "Вода из ёмкости, уровень может падать."
    correct_solution: "Важно предложить защиту от сухого хода."
  - type: case
    title: "Кейс 2"
    situation: "Клиент хочет водоснабжение дома из скважины."
    correct_solution: "Уточняем глубину, дебит, расход, напор и качество воды."
  - type: image
    title: "Частые ошибки"
    asset: "water_supply_errors.png"
  - type: true_false
    title: "Проверка"
    question: "В системе водоснабжения важно подбирать не только насос, но и обвязку, автоматику и защиту."
    correct: true
  - type: checklist
    title: "Чек-лист продавца"
    items:
      - "Источник воды: скважина, колодец, ёмкость или магистраль?"
      - "Глубина до воды и расстояние до дома?"
      - "Сколько точек водоразбора и что работает одновременно?"
      - "Какое давление нужно получить?"
      - "Нужны ли автоматика, гидроаккумулятор и защита от сухого хода?"
      - "Какие трубы, фильтры, клапаны и фитинги будут в системе?"
  - type: quiz
    title: "Итоговый тест 1"
    question: "Что снижает частые пуски насоса в системе с реле давления?"
    answers:
      - "Гидроаккумулятор"
      - "Цвет корпуса"
      - "Длина инструкции"
      - "Тип наклейки"
    correct: 0
  - type: true_false
    title: "Итоговый тест 2"
    question: "Узкая труба, фильтры и фитинги могут увеличить потери напора."
    correct: true
  - type: summary
    title: "Итоги"
    body: "Система водоснабжения — это насос плюс источник, автоматика, бак, трубы и обвязка. Следующий урок: 2.2 Расчёт расхода и напора."
