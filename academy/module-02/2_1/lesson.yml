objectives:
  - Понять водоснабжение как систему, а не как отдельный насос.
  - Уточнять источник, линию, точки водоразбора и условия монтажа.
  - Связывать расход и напор с задачей клиента.
  - Избегать подбора только по мощности.
  - Предлагать комплект: насос, автоматику, защиту и обвязку.

