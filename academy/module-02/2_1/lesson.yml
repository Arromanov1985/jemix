id: "2.1"
title: "Давление, расход, напор"
module: 2
lesson: "2_1"
format: "H5P Course Presentation"
status: "scaffold"

objectives:
  - Объяснить различие между давлением, расходом и напором.
  - Показать, почему эти параметры важны при подборе насоса.
  - Подготовить слушателя к расчётным кейсам.

slides:
  - type: title
    title: "2.1 Давление, расход, напор"
  - type: text
    title: "Три ключевых параметра"
    body: "Расход показывает, сколько жидкости проходит через систему. Напор показывает энергетическую возможность насоса поднять или продвинуть жидкость. Давление показывает воздействие жидкости на стенки системы."
  - type: quiz
    title: "Проверка"
    question: "Что показывает расход?"
    answers:
      - "Количество жидкости за единицу времени"
      - "Цвет воды"
      - "Температуру воздуха"
      - "Вес коробки"
    correct: 0
  - type: summary
    title: "Итоги"
    body: "При подборе насоса важно учитывать расход, напор и требуемое давление в системе."
