slides:
  - type: title
    title: "2.4 Кавитация и высота всасывания"
  - type: text
    title: "Что такое кавитация"
    body: "Кавитация возникает, когда в потоке образуются и схлопываются паровые пузырьки. Это может приводить к шуму, вибрации и повреждению насоса."
  - type: quiz
    title: "Проверка"
    question: "Что может вызвать кавитацию?"
    answers:
      - "Плохие условия всасывания"
      - "Цвет корпуса"
      - "Размер коробки"
      - "Название бренда"
    correct: 0
  - type: summary
    title: "Итоги"
    body: "Чтобы снизить риск кавитации, важно соблюдать допустимую высоту всасывания и делать всасывающую линию герметичной и правильно подобранной."
