id: "2.4"
title: "Монтаж, обвязка и типовые схемы подключения"
module: 2
lesson: "2_4"
format: "H5P Course Presentation"
status: "v1_h5p_ready"
h5p_file: "h5p/JEMIX_Academy_2_4_Montazh_obvyazka_i_shemy_podklyucheniya.h5p"

objectives:
  - Понимать назначение обвязки насоса.
  - Знать основные элементы подключения.
  - Различать схемы для поверхностного и погружного насоса.
  - Видеть ошибки монтажа, которые приводят к проблемам.
  - Уметь собрать комплект для клиента.

slides:
  - type: title
    title: "2.4 Монтаж, обвязка и типовые схемы подключения"
    body: "Как элементы системы соединяются между собой и какие ошибки важно предупредить."
  - type: image
    title: "Типовая обвязка поверхностного насоса"
    asset: "surface_pump_piping.png"
  - type: image
    title: "Типовая схема погружного насоса"
    asset: "submersible_pump_scheme.png"
  - type: image
    title: "Элементы обвязки"
    asset: "piping_elements.png"
  - type: theory
    title: "Зачем нужна обвязка"
    body: "Обвязка — это труба или шланг, обратный клапан, фильтр, фитинги, краны, манометр, автоматика и защита. Без правильной обвязки даже хороший насос может работать плохо."
  - type: quiz
    title: "Квиз 1"
    question: "Зачем нужен обратный клапан?"
    answers:
      - "Не даёт воде уйти обратно"
      - "Нагревает воду"
      - "Измеряет расход"
      - "Заменяет насос"
    correct: 0
  - type: image
    title: "Базовые правила монтажа"
    asset: "installation_rules.png"
  - type: theory
    title: "Герметичность всасывающей линии"
    body: "Для поверхностного насоса особенно важна герметичная всасывающая линия. Подсос воздуха может привести к потере производительности, шуму и нестабильной работе."
  - type: quiz
    title: "Квиз 2"
    question: "Что может вызвать подсос воздуха во всасывающей линии?"
    answers:
      - "Нестабильную работу и потерю производительности"
      - "Увеличение гарантии"
      - "Автоматическую очистку фильтра"
      - "Рост давления без насоса"
    correct: 0
  - type: image
    title: "Типовые схемы"
    asset: "common_schemes.png"
  - type: theory
    title: "Колодец или ёмкость + поверхностный насос"
    body: "В такой схеме критичны обратный клапан, герметичность всасывания, фильтр, правильный диаметр трубы и защита от сухого хода, если уровень воды нестабилен."
  - type: theory
    title: "Скважина + погружной насос"
    body: "Для скважинного насоса важны трос, кабель, труба, обратный клапан, защита, автоматика и правильное подключение к гидроаккумулятору или системе управления."
  - type: case
    title: "Кейс 1"
    situation: "После отключения насоса давление быстро падает, явных утечек нет."
    correct_solution: "Проверить обратный клапан и герметичность."
  - type: case
    title: "Кейс 2"
    situation: "Клиент ставит насос на длинную трассу узкой трубой."
    correct_solution: "Риск — большие потери напора."
  - type: image
    title: "Ошибки монтажа"
    asset: "installation_mistakes.png"
  - type: true_false
    title: "Проверка"
    question: "Перед первым пуском нужно проверить наличие воды, направление потока, герметичность и давление."
    correct: true
  - type: checklist
    title: "Чек-лист комплекта"
    items:
      - "Труба или шланг нужного диаметра"
      - "Обратный клапан"
      - "Фильтр при необходимости"
      - "Фитинги и переходники"
      - "Краны для обслуживания"
      - "Манометр и автоматика"
      - "Защита от сухого хода, если источник нестабилен"
      - "Кабель, трос и крепёж для погружного насоса"
  - type: quiz
    title: "Итоговый тест 1"
    question: "Почему важно не занижать диаметр трубы?"
    answers:
      - "Чтобы не увеличивать потери напора"
      - "Чтобы труба была красивее"
      - "Чтобы насос стал легче"
      - "Чтобы не нужен был фильтр"
    correct: 0
  - type: true_false
    title: "Итоговый тест 2"
    question: "Обвязку нужно подбирать вместе с насосом, а не после продажи наугад."
    correct: true
  - type: summary
    title: "Итоги"
    body: "Обвязка влияет на стабильность, ресурс и удобство обслуживания. Следующий урок: 2.5 Типичные неисправности и диагностика."
