id: "2.2"
title: "Расчёт расхода и напора"
module: 2
lesson: "2_2"
format: "H5P Course Presentation"
status: "v1_h5p_ready"
h5p_file: "h5p/JEMIX_Academy_2_2_Raschet_rashoda_i_napora.h5p"

objectives:
  - Понять, как оценивать требуемый расход.
  - Увидеть, из чего складывается напор.
  - Учитывать высоту, давление и потери.
  - Не путать максимальные значения с рабочим режимом.
  - Разобрать частые ошибки расчёта.

slides:
  - type: title
    title: "2.2 Расчёт расхода и напора"
    body: "Простая логика подбора насоса для бытовой системы."
  - type: image
    title: "Как считать бытовую систему"
    asset: "calculation_scheme.png"
  - type: image
    title: "Оценка расхода"
    asset: "flow_estimation.png"
  - type: theory
    title: "Расход: сколько воды нужно"
    body: "Расход определяется не количеством всех точек в доме, а тем, сколько из них реально может работать одновременно. Душ, кухня и полив дают разные нагрузки."
  - type: quiz
    title: "Квиз 1"
    question: "Что важно уточнить для оценки расхода?"
    answers:
      - "Сколько точек работает одновременно"
      - "Только цвет корпуса"
      - "Только длину коробки"
      - "Только год покупки"
    correct: 0
  - type: image
    title: "Из чего складывается требуемый напор"
    asset: "head_stack.png"
  - type: theory
    title: "Напор: не только высота"
    body: "Требуемый напор складывается из высоты подъёма, нужного давления у потребителя, потерь в трубах и разумного запаса. Ошибка — считать только высоту от воды до дома."
  - type: image
    title: "Что увеличивает потери"
    asset: "loss_factors.png"
  - type: quiz
    title: "Квиз 2"
    question: "Что увеличивает потери напора?"
    answers:
      - "Длинная узкая труба, фильтры, клапаны и фитинги"
      - "Только цвет трубы"
      - "Только название насоса"
      - "Только наклейка на корпусе"
    correct: 0
  - type: theory
    title: "Рабочая точка"
    body: "После оценки расхода и напора насос выбирают по рабочей точке: он должен давать нужный расход при нужном напоре. Максимальный расход и максимальный напор не рассматривают отдельно."
  - type: image
    title: "Пример разговора"
    asset: "client_case_22.png"
  - type: case
    title: "Кейс 1"
    situation: "Клиент говорит: дом, душ, кухня, полив."
    correct_solution: "Спросить, что будет работать одновременно и какая трасса."
  - type: case
    title: "Кейс 2"
    situation: "Высота небольшая, но трасса длинная и узкая."
    correct_solution: "Важно учесть потери напора в трубопроводе."
  - type: image
    title: "Ошибки расчёта"
    asset: "calculation_mistakes.png"
  - type: true_false
    title: "Проверка"
    question: "Для подбора насоса достаточно знать только высоту подъёма воды."
    correct: false
  - type: checklist
    title: "Чек-лист расчёта"
    items:
      - "Сколько точек водоразбора?"
      - "Что работает одновременно?"
      - "Какая высота от уровня воды до верхней точки?"
      - "Какое давление нужно получить?"
      - "Какая длина и диаметр трубы?"
      - "Есть ли фильтры, клапаны, повороты и фитинги?"
      - "Какой разумный запас нужен?"
  - type: quiz
    title: "Итоговый тест 1"
    question: "Что такое рабочая точка?"
    answers:
      - "Нужный расход при нужном напоре в конкретной системе"
      - "Только максимальный расход"
      - "Только максимальный напор"
      - "Только мощность двигателя"
    correct: 0
  - type: true_false
    title: "Итоговый тест 2"
    question: "Фильтры и обратные клапаны могут добавлять сопротивление системе."
    correct: true
  - type: summary
    title: "Итоги"
    body: "Расход зависит от одновременной работы потребителей. Напор складывается из высоты, давления, потерь и запаса. Следующий урок: 2.3 Автоматика, гидроаккумулятор и защита насоса."
