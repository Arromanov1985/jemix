lesson: 2.3
title: Рабочая точка насоса
questions:
  - type: single_choice
    title: Что такое рабочая точка?
    options:
      - text: Место, где насос установлен на полу
        correct: false
      - text: Реальный режим работы насоса в конкретной системе
        correct: true
      - text: Только максимальный напор из паспорта
        correct: false
    feedback: Рабочая точка показывает, как насос реально работает в системе.
  - type: true_false
    title: Насос всегда работает на максимальном расходе из паспорта.
    correct: false
    feedback: В реальной системе расход зависит от сопротивления системы и рабочей точки.
  - type: matching
    title: Соотнесите фактор и влияние
    pairs:
      - left: Загрязнённый фильтр
        right: Больше сопротивление
      - left: Второй этаж
        right: Требуется больше напора
      - left: Узкая труба
        right: Потери выше
      - left: Больше открытых точек
        right: Требуется больше расхода
  - type: single_choice
    title: Почему нельзя выбирать насос только по максимальному расходу?
    options:
      - text: В системе есть сопротивление, и реальный расход будет другим
        correct: true
      - text: Максимальный расход всегда равен нулю
        correct: false
      - text: Расход не нужен при подборе
        correct: false
    feedback: Максимальные параметры не показывают реальную работу в системе.
