id: "2.3"
title: "Автоматика, гидроаккумулятор и защита насоса"
module: 2
lesson: "2_3"
format: "H5P Course Presentation"
status: "v1_h5p_ready"
h5p_file: "h5p/JEMIX_Academy_2_3_Avtomatika_gidroakkumulyator_i_zashchita.h5p"

objectives:
  - Понять роль автоматики в системе водоснабжения.
  - Разобраться с реле давления и блоком автоматики.
  - Понять назначение гидроаккумулятора.
  - Объяснять защиту от сухого хода.
  - Видеть типичные ошибки настройки и монтажа.

slides:
  - type: title
    title: "2.3 Автоматика, гидроаккумулятор и защита насоса"
    body: "Как система включается, отключается и защищает насос."
  - type: image
    title: "Автоматика в системе водоснабжения"
    asset: "auto_system_scheme.png"
  - type: image
    title: "Основные элементы автоматики"
    asset: "automation_elements_23.png"
  - type: theory
    title: "Зачем нужна автоматика"
    body: "Автоматика включает насос при водоразборе или падении давления, отключает его при достижении нужного режима и помогает защитить оборудование."
  - type: quiz
    title: "Квиз 1"
    question: "Что делает реле давления?"
    answers:
      - "Включает и отключает насос по давлению"
      - "Измельчает стоки"
      - "Измеряет цвет воды"
      - "Нагревает теплоноситель"
    correct: 0
  - type: image
    title: "Логика работы реле давления"
    asset: "pressure_relay_logic.png"
  - type: image
    title: "Зачем нужен гидроаккумулятор"
    asset: "hydrotank_roles.png"
  - type: theory
    title: "Гидроаккумулятор"
    body: "Гидроаккумулятор создаёт запас воды под давлением. Благодаря этому насос не включается при каждом небольшом открытии крана, а работает реже и стабильнее."
  - type: quiz
    title: "Квиз 2"
    question: "Что снижает частые пуски насоса?"
    answers:
      - "Гидроаккумулятор"
      - "Только манометр"
      - "Цвет корпуса"
      - "Длина инструкции"
    correct: 0
  - type: image
    title: "Когда нужна защита сухого хода"
    asset: "dry_run_risks.png"
  - type: theory
    title: "Защита от сухого хода"
    body: "Сухой ход возникает, когда насос работает без воды или с недостаточной подачей воды. Это опасный режим: насос может перегреться и выйти из строя."
  - type: case
    title: "Кейс 1"
    situation: "Клиент берёт воду из ёмкости, вода может закончиться."
    correct_solution: "Предложить защиту от сухого хода."
  - type: case
    title: "Кейс 2"
    situation: "Насос часто включается даже при малом расходе."
    correct_solution: "Проверить гидроаккумулятор, давление воздуха, утечки и настройки реле."
  - type: image
    title: "Ошибки настройки и монтажа"
    asset: "automation_mistakes_23.png"
  - type: true_false
    title: "Проверка"
    question: "Манометр сам по себе не включает и не выключает насос."
    correct: true
  - type: checklist
    title: "Чек-лист продавца"
    items:
      - "Какая система: скважина, колодец, ёмкость или магистраль?"
      - "Нужно реле давления или блок автоматики?"
      - "Есть ли гидроаккумулятор и какой объём нужен?"
      - "Нужна ли защита от сухого хода?"
      - "Есть ли обратный клапан и фильтр?"
      - "Как будут контролировать давление?"
      - "Кто будет настраивать систему после монтажа?"
  - type: quiz
    title: "Итоговый тест 1"
    question: "Что показывает манометр?"
    answers:
      - "Давление"
      - "Расход в м³/ч"
      - "Размер частиц"
      - "Глубину скважины"
    correct: 0
  - type: true_false
    title: "Итоговый тест 2"
    question: "При нестабильном источнике воды защита от сухого хода снижает риск повреждения насоса."
    correct: true
  - type: summary
    title: "Итоги"
    body: "Автоматика управляет включением и отключением насоса. Гидроаккумулятор снижает частые пуски. Следующий урок: 2.4 Монтаж, обвязка и типовые схемы подключения."
