id: "4.5"
title: "Работа с возражениями, ошибками клиента и сервисными случаями"
module: 4
lesson: "4_5"
format: "H5P Course Presentation"
status: "v1_h5p_ready"
h5p_file: "h5p/JEMIX_Academy_4_5_Vozrazheniya_oshibki_klienta_i_servis.h5p"

objectives:
  - Корректно отвечать на типовые возражения.
  - Объяснять ценность комплекта и защиты.
  - Видеть ошибки клиента до продажи.
  - Понимать границу консультации и сервиса.
  - Использовать безопасные формулировки.

slides:
  - type: title
    title: "4.5 Работа с возражениями, ошибками клиента и сервисными случаями"
    body: "Как отвечать спокойно, продавать комплектно и не обещать лишнего."
  - type: image
    title: "Алгоритм ответа на возражение"
    asset: "objection_flow.png"
  - type: image
    title: "Возражение — грамотный ответ"
    asset: "objection_response_matrix.png"
  - type: theory
    title: "Главная идея"
    body: "Возражение — не конфликт, а сигнал, что клиенту не хватает понимания. Задача продавца — уточнить условия, объяснить риски и предложить безопасное решение."
  - type: image
    title: "Типовые возражения клиента"
    asset: "common_objections_45.png"
  - type: quiz
    title: "Квиз 1"
    question: "Клиент говорит: «Дайте самый мощный насос». Что правильнее ответить?"
    answers:
      - "Сначала уточнить задачу, расход, напор и условия"
      - "Продать самый дорогой без вопросов"
      - "Сказать, что мощность решает всё"
      - "Предложить любой насос"
    correct: 0
  - type: image
    title: "Ошибки клиента"
    asset: "client_errors_45.png"
  - type: theory
    title: "Ошибки клиента нужно предупреждать"
    body: "Клиент может не знать глубину, перепутать тип воды, поставить узкую трубу, убрать обратный клапан или отказаться от защиты. Важно объяснить последствия до продажи."
  - type: quiz
    title: "Квиз 2"
    question: "Клиент хочет убрать защиту от сухого хода при нестабильном источнике. Что сделать?"
    answers:
      - "Объяснить риск и предложить защиту как часть решения"
      - "Согласиться без предупреждения"
      - "Сказать, что насос никогда не ломается"
      - "Заменить защиту цветом корпуса"
    correct: 0
  - type: image
    title: "Граница консультации и сервиса"
    asset: "service_boundary_45.png"
  - type: theory
    title: "Когда не стоит ставить диагноз на словах"
    body: "Если есть запах гари, выбивает автомат, насос не запускается после базовых проверок, слышно заклинивание или есть повреждение корпуса, нужно направлять в сервис."
  - type: case
    title: "Кейс 1"
    situation: "Насос выбивает автомат, клиент включал несколько раз."
    correct_solution: "Не продолжать включать, нужна проверка питания/насоса и сервис."
  - type: case
    title: "Кейс 2"
    situation: "У соседа такой же насос работает."
    correct_solution: "Объяснить, что условия источника, трассы, расхода и монтажа могут отличаться."
  - type: image
    title: "Безопасные фразы продавца"
    asset: "safe_phrases_45.png"
  - type: image
    title: "Фразы, которых избегаем"
    asset: "bad_phrases_45.png"
  - type: true_false
    title: "Проверка"
    question: "Если данных по системе нет, продавец должен честно обозначить ограничения подбора и запросить недостающую информацию."
    correct: true
  - type: summary
    title: "Итоги"
    body: "Возражение переводим в уточнение задачи и условий. Комплект и защита продаются через объяснение риска. Следующий шаг: итоговый тест модуля 4."
