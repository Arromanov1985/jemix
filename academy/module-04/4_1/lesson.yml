id: "4.1"
title: "Подбор насоса под задачу клиента"
module: 4
lesson: "4_1"
format: "H5P Course Presentation"
status: "v1_h5p_ready"
h5p_file: "h5p/JEMIX_Academy_4_1_Podbor_nasosa_pod_zadachu_klienta.h5p"

objectives:
  - Связать знания из модулей 1–3 в практический алгоритм.
  - Вести разговор с клиентом по структуре.
  - Быстро определять продуктовую группу.
  - Видеть красные флаги и риски подбора.
  - Предлагать не один насос, а комплектное решение.

slides:
  - type: title
    title: "4.1 Подбор насоса под задачу клиента"
    body: "Как провести разговор, выбрать продуктовую группу и собрать полное решение."
  - type: image
    title: "Подбор насоса: логика разговора"
    asset: "selection_dialog_flow.png"
  - type: image
    title: "От задачи клиента к продуктовой группе"
    asset: "task_to_product_map.png"
  - type: theory
    title: "Главная идея практического подбора"
    body: "Сначала выясняем задачу клиента, среду, источник, параметры и условия монтажа. Только после этого выбирается продуктовая группа, модель и комплектующие."
  - type: quiz
    title: "Квиз 1"
    question: "С чего начинается грамотный подбор насоса?"
    answers:
      - "С задачи клиента и условий работы"
      - "С самой дешёвой модели"
      - "Только с мощности"
      - "С цвета корпуса"
    correct: 0
  - type: image
    title: "Вопросы, которые нельзя пропускать"
    asset: "client_questions_41.png"
  - type: theory
    title: "Среда определяет группу"
    body: "Чистая вода, грязная вода, стоки и теплоноситель требуют разных решений. Ошибка в определении среды ведёт к неверному подбору."
  - type: quiz
    title: "Квиз 2"
    question: "Клиенту нужно откачать воду из подвала после подтопления. Какая группа ближе?"
    answers:
      - "Дренажный насос"
      - "Циркуляционный насос"
      - "Повышающий насос"
      - "Реле давления"
    correct: 0
  - type: image
    title: "Красные флаги при подборе"
    asset: "selection_red_flags_41.png"
  - type: image
    title: "Полное решение, а не один насос"
    asset: "complete_solution_41.png"
  - type: theory
    title: "Комплектность продажи"
    body: "Насос часто требует обвязки: обратного клапана, фильтра, трубы или шланга, фитингов, автоматики, защиты сухого хода и гидроаккумулятора."
  - type: case
    title: "Кейс 1"
    situation: "Дом, скважина, хочу стабильное давление."
    correct_solution: "Уточнить глубину, дебит, расход, напор, автоматику, защиту и обвязку."
  - type: case
    title: "Кейс 2"
    situation: "Вода есть, но слабый напор в квартире."
    correct_solution: "Рассмотреть повышающий насос и условия входного давления."
  - type: image
    title: "Ошибки продавца"
    asset: "seller_mistakes_41.png"
  - type: true_false
    title: "Проверка"
    question: "Правильный подбор — это выбор насоса, автоматики и комплектующих под задачу, а не продажа одной модели наугад."
    correct: true
  - type: summary
    title: "Итоги"
    body: "Подбор начинается с задачи клиента. Среда, источник и монтаж определяют продуктовую группу. Следующий урок: 4.2 Практические кейсы водоснабжения дома."
