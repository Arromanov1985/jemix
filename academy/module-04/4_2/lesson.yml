objectives:
  - Разбирать типовые запросы по водоснабжению дома.
  - Быстро определять, какие вопросы задать.
  - Отличать скважину, колодец, ёмкость и повышение давления.
  - Собирать комплектное решение.
  - Предупреждать типовые ошибки клиента.

slides:
  - type: title
    title: "4.2 Практические кейсы водоснабжения дома"
    body: "Скважина, колодец, ёмкость, слабое давление и полное решение для клиента."
  - type: image
    title: "Кейсы водоснабжения"
    asset: "home_water_case_router.png"
  - type: image
    title: "Кейс — вопросы — решение"
    asset: "home_solution_matrix.png"
  - type: theory
    title: "Главная идея кейсов"
    body: "Водоснабжение дома нельзя решать одной фразой «берите насос». Нужно понять источник, условия, потребителей, расход и напор, затем предложить насос, автоматику, защиту и обвязку."
  - type: image
    title: "Кейс: водоснабжение из скважины"
    asset: "well_case_42.png"
  - type: quiz
    title: "Квиз 1"
    question: "Клиенту нужен насос для скважины. Что критично уточнить?"
    answers:
      - "Глубину, уровни воды, дебит, диаметр и потребителей"
      - "Только цвет корпуса"
      - "Только размер упаковки"
      - "Только название магазина"
    correct: 0
  - type: image
    title: "Кейс: колодец или ёмкость"
    asset: "well_house_case_42.png"
  - type: theory
    title: "Колодец и ёмкость"
    body: "В колодце важен сезонный уровень воды и условия всасывания. В ёмкости главный риск — работа без воды, поэтому важны защита сухого хода и контроль уровня."
  - type: quiz
    title: "Квиз 2"
    question: "Если насос берёт воду из ёмкости, где уровень может упасть, что обязательно обсудить?"
    answers:
      - "Защиту от сухого хода"
      - "Только цвет шланга"
      - "Только мощность без условий"
      - "Только бренд фильтра"
    correct: 0
  - type: image
    title: "Кейс: слабое давление"
    asset: "pressure_boost_case_42.png"
  - type: theory
    title: "Слабое давление"
    body: "Повышающий насос помогает, когда вода есть, но давления недостаточно. Если воды нет или входные условия неподходящие, повышение давления не решит проблему."
  - type: case
    title: "Кейс 1"
    situation: "В квартире слабый напор."
    correct_solution: "Уточнить наличие стабильной воды и входное давление."
  - type: case
    title: "Кейс 2"
    situation: "Насос для полива, шланг длинный."
    correct_solution: "Уточнить расход, длину трассы, диаметр шланга и требуемый напор."
  - type: image
    title: "Как оформить предложение"
    asset: "selling_solution_42.png"
  - type: image
    title: "Ошибки в кейсах"
    asset: "case_errors_42.png"
  - type: true_false
    title: "Проверка"
    question: "Повышающий насос не решает проблему полного отсутствия воды на входе."
    correct: true
  - type: summary
    title: "Итоги"
    body: "Кейс начинается с источника и задачи. Скважина требует данных по глубине и дебиту, ёмкость — защиты сухого хода. Следующий урок: 4.3 Кейсы водоотведения, дренажа и канализации."
