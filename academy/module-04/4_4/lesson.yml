h5p_file: "h5p/JEMIX_Academy_4_4_Kejsy_otopleniya_cirkulyacii_i_povysheniya_davleniya.h5p"

objectives:
  - Различать задачи циркуляции и повышения давления.
  - Понимать кейсы отопления и водоснабжения.
  - Задавать вопросы по контуру, температуре, давлению и расходу.
  - Видеть типовые ошибки выбора.
  - Предлагать комплект и проверку перед продажей.

slides:
  - type: title
    title: "4.4 Кейсы отопления, циркуляции и повышения давления"
    body: "Как отличать циркуляционный насос от повышающего и задавать правильные вопросы клиенту."
  - type: image
    title: "Циркуляция и повышение давления"
    asset: "circulation_vs_booster.png"
  - type: image
    title: "Кейс отопления"
    asset: "heating_circulation_scheme.png"
  - type: theory
    title: "Главная идея"
    body: "Циркуляционный насос двигает теплоноситель по замкнутому контуру. Повышающий насос увеличивает давление в линии водоснабжения, если вода уже есть."
  - type: quiz
    title: "Квиз 1"
    question: "Какая задача у циркуляционного насоса?"
    answers:
      - "Двигать теплоноситель по контуру отопления"
      - "Откачивать фекальные стоки"
      - "Поднимать воду из глубокой скважины"
      - "Измельчать мусор"
    correct: 0
  - type: image
    title: "Вопросы по отоплению"
    asset: "heating_questions_44.png"
  - type: theory
    title: "Кейс отопления"
    body: "В отоплении важно понять тип системы, температуру теплоносителя, место установки, присоединение, монтажную длину, направление потока и причину обращения."
  - type: quiz
    title: "Квиз 2"
    question: "Что важно проверить при замене циркуляционного насоса?"
    answers:
      - "Резьбу, монтажную длину, направление потока и режимы"
      - "Только цвет корпуса"
      - "Только высоту коробки"
      - "Только цену шланга"
    correct: 0
  - type: image
    title: "Вопросы по повышению давления"
    asset: "booster_questions_44.png"
  - type: theory
    title: "Кейс повышения давления"
    body: "Повышающий насос помогает при слабом давлении, но только если вода на входе есть. Нужно уточнить входное давление, расход, количество точек и условия подключения."
  - type: case
    title: "Кейс 1"
    situation: "Воды иногда вообще нет."
    correct_solution: "Обычный повышающий насос не решит задачу; сначала нужно разобраться с наличием воды и источником."
  - type: case
    title: "Кейс 2"
    situation: "Клиент жалуется на холодные радиаторы."
    correct_solution: "Не продавать насос сразу, а уточнить систему отопления, воздух, балансировку, место установки."
  - type: image
    title: "Типовые кейсы"
    asset: "heating_booster_cases_44.png"
  - type: image
    title: "Ошибки выбора"
    asset: "mistakes_44.png"
  - type: image
    title: "Комплект и проверка"
    asset: "complete_solution_44.png"
  - type: true_false
    title: "Проверка"
    question: "Повышающий насос не решает проблему полного отсутствия воды на входе."
    correct: true
  - type: summary
    title: "Итоги"
    body: "Циркуляционный насос — для движения теплоносителя в контуре. Повышающий насос — для роста давления при наличии воды на входе. Следующий урок: 4.5 Работа с возражениями, ошибками клиента и сервисными случаями."
