  - type: theory
    title: "Главная идея"
    body: "Водоотведение начинается с вопроса: что именно нужно отвести? Вода из подвала, грязная вода с частицами и фекальные стоки — разные задачи."
  - type: image
    title: "Кейс: дренажная откачка"
    asset: "drainage_case_43.png"
  - type: quiz
    title: "Квиз 1"
    question: "Клиенту нужно откачать воду из подвала после подтопления. С какой группы начать?"
    answers:
      - "Дренажный насос"
      - "Циркуляционный насос"
      - "Повышающий насос"
      - "Реле давления"
    correct: 0
  - type: image
    title: "Кейс: канализация и стоки"
    asset: "sewage_case_43.png"
  - type: theory
    title: "Канализационная задача"
    body: "Если есть фекальные стоки, санузел ниже уровня стояка или нужно принудительно отвести воду от сантехники, рассматривают фекальные насосы или канализационные установки."
  - type: quiz
    title: "Квиз 2"
    question: "Санузел ниже уровня канализационного стояка. Что ближе всего к решению?"
    answers:
      - "Канализационная установка"
      - "Поверхностный насос для чистой воды"
      - "Циркуляционный насос"
      - "Манометр"
    correct: 0
  - type: image
    title: "Вопросы по грязной воде"
    asset: "dirty_water_questions_43.png"
  - type: theory
    title: "Среда решает всё"
    body: "Для грязной воды важно уточнить характер загрязнения: песок, ил, частицы, волокна, органика, температура, режим работы и возможность обслуживания."
  - type: case
    title: "Кейс 1"
    situation: "Вода грязная, может быть песок и мусор."
    correct_solution: "Уточнить размер и характер включений."
  - type: case
    title: "Кейс 2"
    situation: "Нужна автоматическая откачка воды из приямка."
    correct_solution: "Уточнить поплавок, уровень включения и место установки."
  - type: image
    title: "Ошибки выбора"
    asset: "wastewater_mistakes_43.png"
  - type: image
    title: "Комплектное решение"
    asset: "complete_set_43.png"
  - type: true_false
    title: "Проверка"
    question: "Дренажный насос можно считать универсальной заменой канализационной установки для санузла ниже стояка."
    correct: false
