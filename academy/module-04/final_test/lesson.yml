objectives:
  - Проверить практический алгоритм подбора под задачу клиента.
  - Проверить разбор кейсов водоснабжения дома.
  - Проверить разбор кейсов водоотведения, дренажа и канализации.
  - Проверить отличия отопления, циркуляции и повышения давления.
  - Проверить работу с возражениями, ошибками клиента и сервисными ситуациями.

