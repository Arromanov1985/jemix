id: "jemix-academy-case-catalog"
title: "Каталог кейсов JEMIX"
module: "support"
lesson: "case_catalog"
format: "H5P Course Presentation"
status: "v1_h5p_ready"
h5p_file: "h5p/JEMIX_Academy_Case_Catalog.h5p"

objectives:
  - Дать продавцам практическую базу типовых ситуаций.
  - Тренировать логику «ситуация → вопросы → группа → комплект → риски».
  - Закрепить различия между водоснабжением, дренажом, КНС, бустерами и циркуляцией.
  - Помочь руководителю проводить короткие тренировки по кейсам.
  - Снизить ошибки подбора и коммуникации с клиентом.

slides:
  - type: title
    title: "Каталог кейсов JEMIX"
    body: "Практическая база ситуаций: кейс → вопросы → группа решения → комплект → риски → фраза продавца."
  - type: image
    title: "Каталог кейсов JEMIX"
    asset: "case_catalog_map.png"
  - type: image
    title: "Формула каждого кейса"
    asset: "case_formula.png"
  - type: image
    title: "Что проверяет каталог"
    asset: "case_catalog_checks.png"
  - type: instructions
    title: "Как использовать каталог"
    body: "Руководитель выбирает 3–5 кейсов на тренировку. Продавец должен назвать уточняющие вопросы, группу решения, комплект и безопасную фразу клиенту."
  - type: case
    title: "Кейс 1. Нужен насос на дачу"
    situation: "Клиент говорит: нужен насос на дачу."
    correct_solution: "Спросить, что именно нужно: водоснабжение, полив, откачка или повышение давления."
  - type: case
    title: "Кейс 2. Скважина для дома"
    situation: "Клиент хочет насос для скважины и дома."
    correct_solution: "Уточнить глубину, уровни, дебит, диаметр, потребителей, напор, автоматику и защиту."
  - type: case
    title: "Кейс 3. Вода из ёмкости"
    situation: "Насос берёт воду из ёмкости, уровень может падать."
    correct_solution: "Обсудить риск сухого хода и предложить защиту."
  - type: case
    title: "Кейс 4. Подвал после дождя"
    situation: "После дождя в подвале вода."
    correct_solution: "Рассмотреть дренажный насос, уточнить грязность воды, высоту отвода, шланг и поплавок."
  - type: case
    title: "Кейс 5. Приямок должен откачиваться сам"
    situation: "Клиент хочет автоматическую откачку приямка."
    correct_solution: "Проверить необходимость поплавка, уровень включения, место установки и обратный поток."
  - type: case
    title: "Кейс 6. Санузел в цоколе"
    situation: "Санузел расположен ниже канализационного стояка."
    correct_solution: "Рассмотреть КНС, точки подключения, высоту подъёма и длину линии."
  - type: case
    title: "Кейс 7. Слабый душ"
    situation: "Вода есть, но напор в душе слабый."
    correct_solution: "Проверить наличие воды на входе, входное давление, фильтры, трассу и количество точек."
  - type: case
    title: "Кейс 8. Нет воды вообще"
    situation: "Воды иногда совсем нет."
    correct_solution: "Объяснить, что повышающий насос не создаёт воду из ничего; сначала разобраться с источником."
  - type: case
    title: "Кейс 9. Холодные радиаторы"
    situation: "Клиент жалуется на холодные радиаторы."
    correct_solution: "Уточнить систему отопления, воздух, балансировку, циркуляционный насос и монтаж."
  - type: case
    title: "Кейс 10. Грязная вода с мусором"
    situation: "Нужно откачивать грязную воду с мусором."
    correct_solution: "Уточнить размер и характер включений, песок, волокна, температуру и режим работы."
  - type: case
    title: "Кейс 11. Часто включается насос"
    situation: "Насос часто включается при небольшом расходе воды."
    correct_solution: "Проверить гидроаккумулятор, давление воздуха, утечки, реле и клапан."
  - type: case
    title: "Кейс 12. Клиент хочет без защиты"
    situation: "Клиент хочет убрать защиту сухого хода, чтобы сэкономить."
    correct_solution: "Объяснить риск работы без воды и возможной поломки."
  - type: case
    title: "Кейс 13. У соседа работает"
    situation: "Клиент говорит: у соседа такой насос работает."
    correct_solution: "Объяснить, что условия источника, трассы, расхода и монтажа могут отличаться."
  - type: case
    title: "Кейс 14. Насос не качает"
    situation: "Клиент жалуется: насос не качает."
    correct_solution: "Собрать модель, документы, условия, симптом, фото и базовые проверки."
  - type: case
    title: "Кейс 15. Запах гари"
    situation: "От насоса появился запах гари."
    correct_solution: "Не включать повторно, остановить эксплуатацию и направить в сервис."
  - type: true_false
    title: "Проверка"
    question: "Каталог кейсов нужен не для заучивания ответов, а для тренировки логики консультации."
    correct: true
  - type: summary
    title: "Итоги"
    body: "Каталог можно пополнять реальными ситуациями из магазинов по формуле: ситуация → вопросы → группа → комплект → риски → фраза."
