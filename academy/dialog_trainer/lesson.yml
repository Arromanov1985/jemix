id: "jemix-academy-dialog-trainer"
title: "Тренажёр диалогов продавца"
module: "support"
lesson: "dialog_trainer"
format: "H5P Course Presentation"
status: "v1_h5p_ready"
h5p_file: "h5p/JEMIX_Academy_Dialog_Trainer.h5p"

objectives:
  - Тренировать правильный следующий вопрос продавца.
  - Закрепить консультацию через задачу, среду, условия и параметры.
  - Научить не угадывать модель без данных.
  - Отработать возражения и сервисные реакции.
  - Подготовить продавца к практической аттестации.

slides:
  - type: title
    title: "Тренажёр диалогов продавца"
    body: "Тренировка правильного следующего вопроса и безопасной реакции на реплики клиента."
  - type: image
    title: "Тренажёр диалогов продавца"
    asset: "dialog_trainer_map.png"
  - type: image
    title: "Правильный следующий вопрос"
    asset: "dialog_next_question.png"
  - type: image
    title: "Чего избегать"
    asset: "dialog_bad_reactions.png"
  - type: instructions
    title: "Инструкция"
    body: "В каждом сценарии выберите лучший следующий шаг продавца. Цель — не угадать модель, а правильно продолжить консультацию."
  - type: quiz
    title: "Диалог 1"
    question: "Клиент: «Нужен насос». Что ответить первым?"
    answers:
      - "Для какой задачи: подать воду, откачать, повысить давление или отопление?"
      - "Берите самый мощный"
      - "Сколько денег есть?"
      - "Цвет важен?"
    correct: 0
  - type: quiz
    title: "Диалог 2"
    question: "Клиент: «На дачу, чтобы была вода». Следующий вопрос?"
    answers:
      - "Откуда берём воду: скважина, колодец, ёмкость или магистраль?"
      - "Нужен дренажный насос"
      - "Берите КНС"
      - "Нужен циркуляционный насос"
    correct: 0
  - type: quiz
    title: "Диалог 3"
    question: "Клиент: «Скважина, дом». Следующий вопрос?"
    answers:
      - "Глубина, уровни воды, дебит, диаметр скважины и потребители?"
      - "Какой цвет насоса?"
      - "Нужна ли коробка?"
      - "Хотите самый мощный?"
    correct: 0
  - type: quiz
    title: "Диалог 4"
    question: "Клиент: «В подвале вода». Следующий вопрос?"
    answers:
      - "Какая вода: чистая, грязная, есть ли мусор, куда отводить?"
      - "Нужен бустер"
      - "Нужна КНС для унитаза"
      - "Нужен гидробак"
    correct: 0
  - type: quiz
    title: "Диалог 5"
    question: "Клиент: «Вода грязная». Следующий вопрос?"
    answers:
      - "Какие включения и размер частиц: песок, ил, мусор, волокна?"
      - "Какой цвет корпуса?"
      - "Нужен ли манометр?"
      - "Сколько стоит соседний насос?"
    correct: 0
  - type: quiz
    title: "Диалог 6"
    question: "Клиент: «Хочу санузел в подвале». Следующий вопрос?"
    answers:
      - "Какие точки подключения, высота подъёма и длина напорной линии?"
      - "Какой цвет унитаза?"
      - "Нужен дренажный насос?"
      - "Нужен циркуляционный насос?"
    correct: 0
  - type: quiz
    title: "Диалог 7"
    question: "Клиент: «Слабый напор в душе». Следующий вопрос?"
    answers:
      - "Вода на входе есть стабильно? Какое давление и сколько точек?"
      - "Нужна КНС"
      - "Вода грязная?"
      - "Какой размер частиц?"
    correct: 0
  - type: quiz
    title: "Диалог 8"
    question: "Клиент: «Воды иногда вообще нет». Правильная реакция?"
    answers:
      - "Сначала разобраться с источником; бустер не создаёт воду из ничего"
      - "Поставить бустер и всё решится"
      - "Поставить циркуляционный насос"
      - "Поставить КНС"
    correct: 0
  - type: quiz
    title: "Диалог 9"
    question: "Клиент: «Хочу самый мощный». Что сказать?"
    answers:
      - "Сначала уточним задачу, расход, напор и условия, чтобы не ошибиться"
      - "Конечно, мощность решает всё"
      - "Любой мощный подойдёт"
      - "Комплект не нужен"
    correct: 0
  - type: quiz
    title: "Диалог 10"
    question: "Клиент: «Защита сухого хода не нужна, дорого». Что сказать?"
    answers:
      - "Объяснить риск работы без воды и стоимость возможной поломки"
      - "Согласиться без предупреждения"
      - "Сказать, что насос вечный"
      - "Убрать защиту и клапан"
    correct: 0
  - type: quiz
    title: "Диалог 11"
    question: "Клиент: «У соседа такой работает». Что ответить?"
    answers:
      - "Условия скважины, трассы и расхода могут отличаться; уточним ваши данные"
      - "Значит, берите такой же"
      - "Не нужно ничего уточнять"
      - "Сосед всегда прав"
    correct: 0
  - type: quiz
    title: "Диалог 12"
    question: "Клиент: «Насос не качает». Первый шаг?"
    answers:
      - "Собрать модель, условия, симптом, фото/видео и базовые проверки"
      - "Сразу обещать замену"
      - "Снять защиту"
      - "Включить ещё раз"
    correct: 0
  - type: quiz
    title: "Диалог 13"
    question: "Клиент: «Запах гари». Что ответить?"
    answers:
      - "Не включайте насос, нужна проверка/сервис"
      - "Включите ещё раз"
      - "Снимите автомат"
      - "Увеличьте давление"
    correct: 0
  - type: quiz
    title: "Диалог 14"
    question: "Клиент: «Часто включается насос». Что уточнить?"
    answers:
      - "Гидроаккумулятор, давление воздуха, утечки, реле, клапан"
      - "Размер частиц"
      - "КНС ниже стояка"
      - "Температуру теплоносителя"
    correct: 0
  - type: quiz
    title: "Диалог 15"
    question: "Клиент: «Насос для отопления». Что спросить?"
    answers:
      - "Тип системы, присоединение, монтажная длина, температура, направление потока"
      - "Глубина скважины"
      - "Размер фекальных включений"
      - "Уровень в приямке"
    correct: 0
  - type: true_false
    title: "Проверка"
    question: "Лучший продавец ведёт диалог вопросами и фактами, а не быстрыми обещаниями."
    correct: true
  - type: summary
    title: "Итоги"
    body: "Тренажёр можно использовать после модулей 4–6 как практическую аттестацию продавца."
