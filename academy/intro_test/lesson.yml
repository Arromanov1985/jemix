id: "jemix-academy-intro-test"
title: "Вводный тест перед обучением"
module: "support"
lesson: "intro_test"
format: "H5P Course Presentation"
status: "v1_h5p_ready"
h5p_file: "h5p/JEMIX_Academy_Intro_Test.h5p"

objectives:
  - Определить стартовый уровень продавца перед обучением.
  - Проверить базовые понятия Q, H, давление и рабочая точка.
  - Проверить понимание типов насосов и задач клиента.
  - Выявить слабые темы до прохождения основного курса.
  - Помочь руководителю выбрать темп и маршрут обучения.

slides:
  - type: title
    title: "Вводный тест JEMIX Academy"
    body: "Диагностика перед обучением: стартовый уровень продавца и слабые темы."
  - type: image
    title: "Вводный тест перед обучением"
    asset: "intro_test_map.png"
  - type: image
    title: "Как трактовать результат"
    asset: "intro_score_rules.png"
  - type: instructions
    title: "Инструкция"
    body: "Ответьте на вопросы без подсказок. Ошибки показывают, какие темы нужно усилить в процессе обучения."
  - type: quiz
    title: "Вопрос 1"
    question: "Что обозначает расход Q?"
    answers:
      - "Объём воды за единицу времени"
      - "Только высоту подъёма"
      - "Мощность двигателя"
      - "Диаметр трубы"
    correct: 0
  - type: quiz
    title: "Вопрос 2"
    question: "Что такое напор H?"
    answers:
      - "Способность преодолевать высоту, давление и потери"
      - "Цена насоса"
      - "Цвет корпуса"
      - "Объём бака"
    correct: 0
  - type: quiz
    title: "Вопрос 3"
    question: "Почему нельзя выбирать насос только по Qmax?"
    answers:
      - "Нужна рабочая точка при заданном напоре"
      - "Qmax всегда рабочий режим"
      - "Напор не важен"
      - "Потерь не бывает"
    correct: 0
  - type: quiz
    title: "Вопрос 4"
    question: "С чего начинается подбор насоса?"
    answers:
      - "С задачи клиента и условий"
      - "С самой мощной модели"
      - "Только с цены"
      - "С цвета корпуса"
    correct: 0
  - type: quiz
    title: "Вопрос 5"
    question: "Клиенту нужно откачать подвал. Какая группа ближе?"
    answers:
      - "Дренажный насос"
      - "Циркуляционный насос"
      - "КНС для санузла"
      - "Гидроаккумулятор"
    correct: 0
  - type: quiz
    title: "Вопрос 6"
    question: "Санузел ниже стояка. Что ближе?"
    answers:
      - "КНС / канализационная установка"
      - "Дренажный насос для дождя"
      - "Циркуляционный насос"
      - "Фильтр"
    correct: 0
  - type: quiz
    title: "Вопрос 7"
    question: "Слабый напор при наличии воды. Что может подойти?"
    answers:
      - "Повышающий насос после проверки условий"
      - "Фекальный насос"
      - "Дренажный насос"
      - "КНС"
    correct: 0
  - type: quiz
    title: "Вопрос 8"
    question: "Какая задача у циркуляционного насоса?"
    answers:
      - "Двигать теплоноситель по контуру"
      - "Откачивать подвал"
      - "Поднимать воду из скважины"
      - "Измельчать стоки"
    correct: 0
  - type: quiz
    title: "Вопрос 9"
    question: "Что снижает частые пуски насоса?"
    answers:
      - "Гидроаккумулятор"
      - "Шланг для дренажа"
      - "КНС"
      - "Манометр без системы"
    correct: 0
  - type: quiz
    title: "Вопрос 10"
    question: "Что важно при грязной воде?"
    answers:
      - "Размер и характер включений"
      - "Только цвет корпуса"
      - "Только цена"
      - "Только вес"
    correct: 0
  - type: quiz
    title: "Вопрос 11"
    question: "Что входит в комплектное предложение?"
    answers:
      - "Насос, автоматика, защита, клапаны, фильтры, трубы/шланги, фитинги"
      - "Только насос"
      - "Только чек"
      - "Только коробка"
    correct: 0
  - type: quiz
    title: "Вопрос 12"
    question: "Клиент говорит: «Дайте самый мощный». Что делать?"
    answers:
      - "Уточнить задачу, Q, H и условия"
      - "Продать самый мощный"
      - "Сказать, что мощность решает всё"
      - "Не задавать вопросов"
    correct: 0
  - type: quiz
    title: "Вопрос 13"
    question: "Если есть запах гари или выбивает автомат:"
    answers:
      - "Не включать, направить в сервис"
      - "Включать ещё раз"
      - "Снять защиту"
      - "Увеличить давление"
    correct: 0
  - type: quiz
    title: "Вопрос 14"
    question: "Что нужно собрать при сервисном обращении?"
    answers:
      - "Модель, документы, условия, симптом, фото/видео"
      - "Только цвет насоса"
      - "Только имя клиента"
      - "Только цену"
    correct: 0
  - type: quiz
    title: "Вопрос 15"
    question: "Карточка товара должна содержать:"
    answers:
      - "Назначение, параметры, ограничения и комплектующие"
      - "Только цену"
      - "Только мощность"
      - "Только фото"
    correct: 0
  - type: true_false
    title: "Проверка 1"
    question: "Если продавец ошибается в дренажных, КНС и циркуляционных задачах, его нужно вернуть к типам насосов."
    correct: true
  - type: true_false
    title: "Проверка 2"
    question: "Вводный тест заменяет весь курс и финальный экзамен."
    correct: false
  - type: summary
    title: "Итоги диагностики"
    body: "Используйте результат как стартовую карту: слабые темы превращаются в приоритеты обучения."
