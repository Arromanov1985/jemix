objectives:
  - Понять структуру продуктового модуля.
  - Ориентироваться в основных группах насосов JEMIX.
  - Связывать задачу клиента с продуктовой группой.
  - Видеть ошибки при навигации по ассортименту.
  - Готовить комплектное предложение.

slides:
  - type: title
    title: "5.1 Линейка насосов JEMIX"
    body: "Как ориентироваться в ассортименте и переводить задачу клиента в продуктовую группу."
  - type: image
    title: "Ассортимент JEMIX"
    asset: "jemix_product_family_map.png"
  - type: image
    title: "Как читать линейку"
    asset: "jemix_range_logic.png"
  - type: theory
    title: "Главная идея продуктовой навигации"
    body: "Ассортимент удобно читать не с названий моделей, а с задач клиента: подать воду, откачать, повысить давление, обеспечить циркуляцию или организовать канализацию."
  - type: image
    title: "Основные продуктовые группы"
    asset: "jemix_groups_51.png"
  - type: quiz
    title: "Квиз 1"
    question: "Клиент хочет откачать воду из подвала. С какой группы начинаем?"
    answers:
      - "Дренажные насосы"
      - "Циркуляционные насосы"
      - "Повышающие насосы"
      - "Гидроаккумуляторы"
    correct: 0
  - type: image
    title: "Какие вопросы ведут к группе"
    asset: "selection_by_group_51.png"
  - type: theory
    title: "Почему важна среда"
    body: "Чистая вода, грязная вода, стоки и теплоноситель требуют разных продуктовых групп и разных ограничений по применению."
  - type: quiz
    title: "Квиз 2"
    question: "Санузел ниже уровня канализационного стояка. Какая группа ближе?"
    answers:
      - "Канализационная установка / КНС"
      - "Циркуляционный насос"
      - "Повышающий насос"
      - "Фильтр для воды"
    correct: 0
  - type: image
    title: "Ошибки ориентации в ассортименте"
    asset: "range_mistakes_51.png"
  - type: image
    title: "Как презентовать линейку клиенту"
    asset: "complete_offer_51.png"
  - type: image
    title: "Что будет в модуле 5"
    asset: "module5_path_51.png"
  - type: case
    title: "Кейс 1"
    situation: "Вода есть, но напор слабый."
    correct_solution: "После проверки входных условий рассмотреть повышающие насосы."
  - type: case
    title: "Кейс 2"
    situation: "Насос для контура отопления."
    correct_solution: "Рассмотреть циркуляционный насос."
  - type: true_false
    title: "Проверка"
