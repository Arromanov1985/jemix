id: "5.3"
title: "Дренаж, канализация и КНС в линейке JEMIX"
module: 5
lesson: "5_3"
format: "H5P Course Presentation"
status: "v1_h5p_ready"
h5p_file: "h5p/JEMIX_Academy_5_3_Drenazh_kanalizaciya_i_KNS_v_linejke_JEMIX.h5p"

objectives:
  - Ориентироваться в дренажных и канализационных группах.
  - Отличать дренажную воду от фекальных стоков.
  - Понимать, когда нужна КНС.
  - Подбирать комплект для отвода воды.
  - Предупреждать ошибки выбора и эксплуатации.

slides:
  - type: title
    title: "5.3 Дренаж, канализация и КНС в линейке JEMIX"
    body: "Как выбирать решения для откачки воды, грязной воды, стоков и принудительной канализации."
  - type: image
    title: "JEMIX: дренаж, канализация и КНС"
    asset: "drainage_range_map_53.png"
  - type: image
    title: "Среда — продуктовая группа — вопросы"
    asset: "drainage_decision_matrix_53.png"
  - type: theory
    title: "Главная идея"
    body: "В этой группе всё решает среда: чистая или мутная вода, грязная вода с частицами, фекальные стоки или задача принудительной канализации."
  - type: image
    title: "Дренажные решения"
    asset: "drainage_products_53.png"
  - type: quiz
    title: "Квиз 1"
    question: "Клиенту нужно откачать воду из подвала после подтопления. Какая группа ближе?"
    answers:
      - "Дренажный насос"
      - "Циркуляционный насос"
      - "Повышающий насос"
      - "Гидроаккумулятор"
    correct: 0
  - type: image
    title: "Фекальные насосы и КНС"
    asset: "sewage_products_53.png"
  - type: theory
    title: "Когда нужна КНС"
    body: "Канализационная установка нужна, когда сантехника расположена ниже уровня стояка или нет самотёчного отвода. Важно уточнить точки подключения, высоту подъёма, длину линии и доступ к обслуживанию."
  - type: quiz
    title: "Квиз 2"
    question: "Санузел ниже уровня канализационного стояка. Что ближе всего к решению?"
    answers:
      - "Канализационная установка / КНС"
      - "Насос для чистой воды"
      - "Циркуляционный насос"
      - "Манометр"
    correct: 0
  - type: image
    title: "Проверки по грязной воде"
    asset: "dirty_water_checks_53.png"
  - type: theory
    title: "Грязная вода — это не один сценарий"
    body: "Нужно уточнить размер частиц, песок, волокна, температуру, режим работы и уровень воды. Это влияет на выбор насоса, ресурс и риск засора."
  - type: case
    title: "Кейс 1"
    situation: "Вода грязная, может быть мусор."
    correct_solution: "Спросить размер и характер включений."
  - type: case
    title: "Кейс 2"
    situation: "Клиент хочет автоматическую откачку приямка."
    correct_solution: "Уточнить поплавок, уровень включения и место установки."
  - type: image
    title: "Комплект для отвода воды"
    asset: "bundle_53.png"
  - type: image
    title: "Ошибки продажи"
    asset: "mistakes_53.png"
  - type: true_false
    title: "Проверка"
    question: "Дренажный насос можно считать универсальной заменой КНС для санузла ниже стояка."
    correct: false
  - type: summary
    title: "Итоги"
    body: "Дренаж, грязная вода, фекальные стоки и КНС — разные задачи. Следующий урок: 5.4 Повышающие, циркуляционные насосы и автоматика JEMIX."
