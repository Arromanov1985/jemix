objectives:
  - Проверить ориентацию в линейке JEMIX.
  - Проверить выбор группы для водоснабжения, дренажа, канализации и КНС.
  - Проверить понимание повышающих и циркуляционных насосов.
  - Проверить знание автоматики, защиты и гидроаккумуляторов.
  - Проверить принципы комплектной продажи и карточки товара.

