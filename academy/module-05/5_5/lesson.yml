id: "5.5"
title: "Комплектная продажа и карточка товара JEMIX"
module: 5
lesson: "5_5"
format: "H5P Course Presentation"
status: "v1_h5p_ready"
h5p_file: "h5p/JEMIX_Academy_5_5_Komplektnaya_prodazha_i_kartochka_tovara_JEMIX.h5p"

objectives:
  - Понимать принцип комплектной продажи.
  - Предлагать насос вместе с нужной обвязкой и защитой.
  - Формулировать предложение без давления.
  - Понимать, что должно быть в карточке товара.
  - Снижать риск возвратов из-за неправильного монтажа.

slides:
  - type: title
    title: "5.5 Комплектная продажа и карточка товара JEMIX"
    body: "Как превращать подбор насоса в готовое предложение для клиента."
  - type: image
    title: "Комплектная продажа"
    asset: "complete_offer_flow_55.png"
  - type: image
    title: "Карточка товара"
    asset: "product_card_template_55.png"
  - type: theory
    title: "Главная идея"
    body: "Клиенту нужен не просто насос, а работающая система: насос, автоматика, защита, клапаны, фильтры, трубы или шланги, фитинги и понятные условия эксплуатации."
  - type: image
    title: "Комплект по задаче"
    asset: "bundle_by_task_55.png"
  - type: quiz
    title: "Квиз 1"
    question: "Что лучше предложить клиенту для скважинного водоснабжения кроме насоса?"
    answers:
      - "Трос, кабель, обратный клапан, автоматику, защиту и обвязку"
      - "Только коробку"
      - "Только наклейку"
      - "Только цветной шланг"
    correct: 0
  - type: image
    title: "Скрипт предложения"
    asset: "sales_script_55.png"
  - type: theory
    title: "Допродажа через пользу"
    body: "Комплектующие продаются не как «ещё что-нибудь», а как защита результата: чтобы насос не работал без воды, давление было стабильным, монтаж был корректным, а обслуживание — удобным."
  - type: quiz
    title: "Квиз 2"
    question: "Как корректно объяснить защиту сухого хода?"
    answers:
      - "Она снижает риск поломки при отсутствии воды"
      - "Она нужна только для красоты"
      - "Она заменяет насос"
      - "Она увеличивает глубину скважины"
    correct: 0
  - type: image
    title: "Текстовые блоки карточки"
    asset: "card_text_blocks_55.png"
  - type: image
    title: "Допродажа без давления"
    asset: "upsell_without_pressure_55.png"
  - type: case
    title: "Кейс 1"
    situation: "Клиент берёт дренажный насос для подвала."
    correct_solution: "Добавить шланг нужного диаметра, хомуты/переходники и поплавок при автоматической работе."
  - type: case
    title: "Кейс 2"
    situation: "В карточке товара указаны только мощность и цена."
    correct_solution: "Добавить назначение, среду, параметры, ограничения и комплектующие."
  - type: image
    title: "Ошибки комплектной продажи"
    asset: "mistakes_55.png"
  - type: true_false
    title: "Проверка"
    question: "Комплектная продажа должна объяснять клиенту пользу и риски, а не навязывать случайные товары."
    correct: true
  - type: summary
    title: "Итоги"
    body: "Комплектная продажа закрывает задачу клиента целиком. Следующий шаг: итоговый тест модуля 5."
