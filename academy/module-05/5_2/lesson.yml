id: "5.2"
title: "Водоснабжение в линейке JEMIX"
module: 5
lesson: "5_2"
format: "H5P Course Presentation"
status: "v1_h5p_ready"
h5p_file: "h5p/JEMIX_Academy_5_2_Vodosnabzhenie_v_linejke_JEMIX.h5p"

objectives:
  - Ориентироваться в группах водоснабжения JEMIX.
  - Отличать скважинные, колодезные, поверхностные насосы и станции.
  - Понимать, какие вопросы ведут к правильной группе.
  - Предлагать комплект для стабильной работы.
  - Видеть ошибки продажи водоснабжения.

slides:
  - type: title
    title: "5.2 Водоснабжение в линейке JEMIX"
    body: "Как выбирать решения для дома, скважины, колодца, ёмкости и насосной станции."
  - type: image
    title: "Водоснабжение JEMIX"
    asset: "water_supply_range_map_52.png"
  - type: image
    title: "Группа — когда предлагать — что уточнить"
    asset: "water_supply_product_matrix_52.png"
  - type: theory
    title: "Главная идея"
    body: "Водоснабжение выбирается от источника: скважина, колодец, ёмкость или магистраль. Дальше уточняем глубину, расход, напор, давление, трассу и комплект автоматики."
  - type: image
    title: "Скважинное водоснабжение"
    asset: "borehole_solution_52.png"
  - type: quiz
    title: "Квиз 1"
    question: "Клиенту нужен насос для скважины. Что критично уточнить?"
    answers:
      - "Глубину, уровни воды, дебит, диаметр и потребителей"
      - "Только цвет корпуса"
      - "Только размер коробки"
      - "Только цену фитинга"
    correct: 0
  - type: image
    title: "Поверхностные насосы и станции"
    asset: "surface_station_52.png"
  - type: theory
    title: "Насосная станция"
    body: "Насосная станция удобна для автоматического водоснабжения: в одном решении есть насос, гидроаккумулятор и автоматика. Но всё равно нужно учитывать источник, всасывающую линию, напор, расход и защиту."
  - type: quiz
    title: "Квиз 2"
    question: "Что особенно важно для поверхностного насоса на всасывающей линии?"
    answers:
      - "Герметичность и обратный клапан"
      - "Цвет кабеля"
      - "Размер наклейки"
      - "Наличие КНС"
    correct: 0
  - type: image
    title: "Колодец и ёмкость"
    asset: "well_tank_solution_52.png"
  - type: image
    title: "Комплект для водоснабжения"
    asset: "water_supply_bundle_52.png"
  - type: case
    title: "Кейс 1"
    situation: "Вода из ёмкости, уровень может закончиться."
    correct_solution: "Добавить защиту от сухого хода."
  - type: case
    title: "Кейс 2"
    situation: "Дом из скважины, хочу стабильное давление."
    correct_solution: "Насос, автоматика, гидробак или управление, защита, клапан и обвязка."
  - type: image
    title: "Ошибки продажи водоснабжения"
    asset: "mistakes_52.png"
  - type: true_false
    title: "Проверка"
    question: "Водоснабжение нужно продавать как систему: насос, автоматика, защита, клапаны, фильтры и обвязка."
    correct: true
  - type: summary
    title: "Итоги"
    body: "Водоснабжение начинается с источника. Следующий урок: 5.3 Дренаж, канализация и КНС в линейке JEMIX."
