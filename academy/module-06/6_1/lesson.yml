id: "6.1"
title: "Сервис, гарантия и послепродажная поддержка"
module: 6
lesson: "6_1"
format: "H5P Course Presentation"
status: "v1_h5p_ready"
h5p_file: "h5p/JEMIX_Academy_6_1_Servis_garantiya_i_posleprodazhnaya_podderzhka.h5p"

objectives:
  - Понять роль продавца после продажи.
  - Собирать данные по обращению клиента.
  - Отличать консультацию от сервисного случая.
  - Видеть опасные признаки.
  - Говорить с клиентом профессионально и без лишних обещаний.

slides:
  - type: title
    title: "6.1 Сервис, гарантия и послепродажная поддержка"
    body: "Как принять обращение клиента, собрать данные и корректно направить к решению."
  - type: image
    title: "Сервисный сценарий"
    asset: "service_flow_61.png"
  - type: image
    title: "Симптомы и действия"
    asset: "service_symptom_matrix_61.png"
  - type: theory
    title: "Главная идея"
    body: "Послепродажная поддержка — это сбор фактов, базовая проверка условий и корректное направление: консультация, проверка монтажа или сервис."
  - type: image
    title: "Какие данные собрать у клиента"
    asset: "client_data_61.png"
  - type: quiz
    title: "Квиз 1"
    question: "Клиент говорит: «Насос не работает». Что нужно сделать сначала?"
    answers:
      - "Собрать модель, условия, симптом, фото и базовые проверки"
      - "Сразу обещать замену"
      - "Сразу обвинить клиента"
      - "Посоветовать снять защиту"
    correct: 0
  - type: image
    title: "Граница консультации"
    asset: "service_boundaries_61.png"
  - type: theory
    title: "Граница ответственности"
    body: "Продавец может помочь собрать данные и подсказать безопасные базовые проверки. Точный диагноз без осмотра и решение по гарантии требуют регламента и сервисной проверки."
  - type: quiz
    title: "Квиз 2"
    question: "Клиент говорит: «Выбивает автомат, я включал несколько раз». Что правильно?"
    answers:
      - "Не продолжать включать и направить на проверку/в сервис"
      - "Включать ещё чаще"
      - "Снять защиту"
      - "Сказать, что это точно фильтр"
    correct: 0
  - type: image
    title: "Документы и подтверждения"
    asset: "documents_61.png"
  - type: image
    title: "Опасные признаки"
    asset: "danger_signs_61.png"
  - type: case
    title: "Кейс 1"
    situation: "Есть запах гари от насоса."
    correct_solution: "Остановить использование и направить в сервис."
  - type: case
    title: "Кейс 2"
    situation: "Клиент жалуется на слабый напор после установки."
    correct_solution: "Проверить фильтр, трубу, потери, клапан, источник и подбор до вывода о поломке."
  - type: image
    title: "Как говорить с клиентом"
    asset: "communication_61.png"
  - type: true_false
    title: "Проверка"
    question: "Без осмотра системы и насоса нельзя обещать точную причину неисправности и гарантийное решение."
    correct: true
  - type: summary
    title: "Итоги"
    body: "Сначала собираем факты, документы, фото и условия. Опасные признаки требуют остановки эксплуатации и сервиса. Следующий урок: 6.2 Финальный практический сценарий продавца."
