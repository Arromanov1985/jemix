id: "6.2"
title: "Финальный практический сценарий продавца"
module: 6
lesson: "6_2"
format: "H5P Course Presentation"
status: "v1_h5p_ready"
h5p_file: "h5p/JEMIX_Academy_6_2_Finalnyj_prakticheskij_scenarij_prodavca.h5p"

objectives:
  - Собрать все модули в единый сценарий.
  - Вести консультацию по шагам.
  - Разбирать комплексный запрос клиента.
  - Предлагать насос, комплект и следующий шаг.
  - Не выходить за границы безопасной консультации.

slides:
  - type: title
    title: "6.2 Финальный практический сценарий продавца"
    body: "Полный разговор с клиентом: от первого вопроса до готового решения."
  - type: image
    title: "Финальный сценарий продавца"
    asset: "final_seller_flow_62.png"
  - type: image
    title: "Комплексный клиент"
    asset: "complex_case_map_62.png"
  - type: theory
    title: "Главная идея"
    body: "Сильный продавец не угадывает модель и не спорит с клиентом. Он управляет разговором: выясняет задачу, среду, условия, параметры, выбирает группу, собирает комплект и честно обозначает риски."
  - type: image
    title: "Вопросы в начале разговора"
    asset: "dialog_questions_62.png"
  - type: quiz
    title: "Квиз 1"
    question: "С чего начинается финальный сценарий подбора?"
    answers:
      - "С задачи клиента и условий"
      - "С самой мощной модели"
      - "С цены без вопросов"
      - "С обещания гарантии"
    correct: 0
  - type: image
    title: "Маршрутизатор решения"
    asset: "decision_router_62.png"
  - type: quiz
    title: "Квиз 2"
    question: "Клиент: «Санузел ниже стояка». Куда ведёт сценарий?"
    answers:
      - "КНС / канализационная установка"
      - "Циркуляционный насос"
      - "Повышающий насос"
      - "Гидроаккумулятор"
    correct: 0
  - type: image
    title: "Полное предложение"
    asset: "complete_solution_62.png"
  - type: theory
    title: "Полное решение"
    body: "В финальном сценарии продавец не ограничивается названием насоса. Он показывает клиенту комплект: автоматика, защита, клапаны, фильтры, трубы или шланги, фитинги, монтажные проверки и условия эксплуатации."
  - type: image
    title: "Если клиент возражает"
    asset: "objection_handling_62.png"
  - type: case
    title: "Кейс 1"
    situation: "Клиент говорит: «Дайте самый мощный, чтобы точно хватило»."
    correct_solution: "Вернуться к задаче, расходу, напору и условиям."
  - type: case
    title: "Кейс 2"
    situation: "Клиент жалуется: «Не качает, замените по гарантии»."
    correct_solution: "Собрать модель, документы, условия, симптом, фото и базовые проверки."
  - type: image
    title: "Ошибки финального сценария"
    asset: "seller_mistakes_62.png"
  - type: image
    title: "Финальный чек-лист продавца"
    asset: "final_checklist_62.png"
  - type: true_false
    title: "Проверка"
    question: "Финальный сценарий должен завершаться понятным следующим шагом: покупка комплекта, уточнение данных, проверка монтажа или сервис."
    correct: true
  - type: summary
    title: "Итоги"
    body: "Финальный сценарий объединяет технический подбор, продуктовую навигацию, комплектную продажу и сервисную границу. Следующий шаг: итоговый экзамен JEMIX Academy."
