id: "3.10"
title: "Циркуляционные насосы JEMIX"
module: 3
lesson: "3_10"
format: "H5P Course Presentation"
status: "v1_h5p_ready"
h5p_file: "h5p/JEMIX_Academy_3_10_Cirkulyacionnye_nasosy.h5p"

objectives:
  - Понять назначение циркуляционных насосов.
  - Отличать циркуляционные насосы от повышающих, дренажных и фекальных.
  - Читать ключевые параметры: расход, напор, монтажная длина, присоединение и режимы.
  - Подбирать насос под контур отопления, тёплого пола или ГВС-рециркуляции.
  - Видеть типичные ошибки монтажа и эксплуатации.

slides:
  - type: title
    title: "3.10 Циркуляционные насосы JEMIX"
    body: "Назначение, контуры, параметры и монтаж."

  - type: theory
    title: "Что делает циркуляционный насос"
    body: "Циркуляционный насос обеспечивает движение теплоносителя по замкнутому контуру. Типовые системы: отопление, тёплый пол, рециркуляция горячей воды."

  - type: image
    title: "Циркуляционный насос в контуре"
    asset: "circulation_loop.png"

  - type: theory
    title: "Где применяются"
    bullets:
      - "Отопление: движение теплоносителя по радиаторам."
      - "Тёплый пол: контуры с повышенным гидравлическим сопротивлением."
      - "ГВС-рециркуляция: быстрая подача горячей воды к точке разбора."
      - "Котельные и коллекторные группы."

  - type: quiz
    title: "Квиз 1"
    question: "Главная задача циркуляционного насоса:"
    answers:
      - "Перемещать теплоноситель по замкнутому контуру"
      - "Откачивать грязную воду из подвала"
      - "Измельчать стоки"
      - "Повышать давление в городской магистрали"
    correct: 0

  - type: theory
    title: "Ключевые параметры"
    bullets:
      - "Монтажная длина: проверяется по месту установки."
      - "Присоединение: резьба и диаметр должны совпадать с обвязкой."
      - "Напор: способность преодолевать сопротивление контура."
      - "Расход: объём теплоносителя для передачи тепла."
      - "Скорости или режимы управления."
      - "Температурная совместимость."

  - type: quiz
    title: "Квиз 2"
    question: "Что обязательно проверяют при замене циркуляционного насоса?"
    answers:
      - "Монтажную длину и присоединение"
      - "Только цвет корпуса"
      - "Только вес упаковки"
      - "Только длину кабеля"
    correct: 0

  - type: case
    title: "Кейс 1"
    situation: "Клиент говорит: часть радиаторов холодная, контур заполнен, воздуха нет."
    correct_solution: "Рассматриваем циркуляционные насосы и проверяем параметры контура."

  - type: case
    title: "Кейс 2"
    situation: "Насос шумит после запуска отопления."
    correct_solution: "Сначала проверить наличие воздуха и заполнение контура."

  - type: theory
    title: "Типичные ошибки"
    bullets:
      - "Включение без заполненного контура."
      - "Воздух в системе."
      - "Монтаж против направления стрелки потока."
      - "Несовпадение монтажной длины или резьбы."
      - "Отсутствие фильтра."
      - "Путаница с повышающими насосами."

  - type: true_false
    title: "Проверка"
    question: "Циркуляционный насос можно включать без заполненного контура, чтобы проверить работу."
    correct: false

  - type: theory
    title: "Отличие от повышающего насоса"
    body: "Повышающий насос увеличивает давление в системе водоснабжения. Циркуляционный насос обеспечивает движение теплоносителя в замкнутом контуре."

  - type: checklist
    title: "Чек-лист продавца"
    items:
      - "Какой контур: отопление, тёплый пол или ГВС?"
      - "Какая монтажная длина?"
      - "Какое присоединение?"
      - "Какой нужен расход и напор?"
      - "Сколько скоростей или режимов требуется?"
      - "Есть ли фильтр и воздухоудаление?"
      - "Правильно ли задано направление потока?"

  - type: quiz
    title: "Итоговый тест 1"
    question: "Какой параметр связан с преодолением сопротивления контура?"
    answers:
      - "Напор"
      - "Цвет корпуса"
      - "Тип упаковки"
      - "Длина инструкции"
    correct: 0

  - type: true_false
    title: "Итоговый тест 2"
    question: "При монтаже важно соблюдать направление стрелки потока на корпусе насоса."
    correct: true

  - type: summary
    title: "Итоги"
    body: "Циркуляционный насос работает в замкнутом контуре. Ключевые параметры: расход, напор, монтажная длина, присоединение и режимы. Следующий урок: 3.11 Автоматика и комплектующие."
