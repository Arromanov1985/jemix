format: "H5P Course Presentation"
source_catalog: "Каталог JEMIX 2026, раздел Автоматические насосные станции"
status: "draft"

objectives:
  - Объяснить назначение автоматических насосных станций.
  - Разобрать основные узлы станции: насос, гидроаккумулятор, реле давления, манометр.
  - Изучить серии НС-СМАРТ, АПНВ, АПЦН и АППН.
  - Научиться читать новую маркировку.
  - Понимать базовый алгоритм подбора.

slides:
  - type: title
    title: "3.2 Автоматические насосные станции JEMIX"
    subtitle: "Устройство, серии и подбор"
  - type: text
    title: "Назначение"
    body: "Автоматическая насосная станция подаёт чистую воду из источника и автоматически поддерживает давление в системе водоснабжения."
  - type: infographic
    title: "Устройство станции"
    items:
      - "Насос"
      - "Гидроаккумулятор"
      - "Реле давления"
      - "Манометр"
      - "Обратный клапан"
      - "Всасывающая и напорная линии"
  - type: table
    title: "Основные серии"
    rows:
      - series: "НС-СМАРТ"
        note: "частотное регулирование"
      - series: "АПНВ"
        note: "компактная вихревая станция"
      - series: "АПЦН"
        note: "центробежные станции"
      - series: "АППН"
        note: "станции с высокой подачей"
  - type: quiz
    title: "Проверка"
    question: "Что делает реле давления?"
    answers:
      - "Включает и отключает насос по давлению"
      - "Фильтрует воду"
      - "Измельчает частицы"
      - "Нагревает воду"
    correct: 0
  - type: summary
    title: "Итоги"
    body: "Подбор станции выполняется по источнику, глубине всасывания, расходу, напору и требованиям к стабильности давления."
