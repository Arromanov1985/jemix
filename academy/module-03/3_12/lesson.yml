id: "3.12"
title: "Итоговый экзамен модуля 3"
module: 3
lesson: "3_12"
format: "H5P Course Presentation"
status: "v1_h5p_ready"
h5p_file: "h5p/JEMIX_Academy_3_12_Itogovyj_ekzamen_modul_3.h5p"

objectives:
  - Проверить знание продуктовых групп насосов JEMIX.
  - Закрепить выбор группы оборудования по задаче клиента.
  - Проверить понимание подбора по среде, расходу, напору, глубине и условиям монтажа.
  - Закрепить типичные ошибки эксплуатации и подбора.
  - Проверить понимание роли автоматики и комплектующих.

exam_scope:
  - Автоматические насосные станции
  - Поверхностные насосы
  - Скважинные насосы
  - Колодезные насосы
  - Дренажные насосы
  - Фекальные насосы
  - Канализационные установки
  - Повышающие насосы
  - Циркуляционные насосы
  - Автоматика и комплектующие

slides:
  - type: title
    title: "3.12 Итоговый экзамен модуля 3"
    body: "Ассортимент JEMIX: выбор группы, подбор и типичные ошибки."

  - type: theory
    title: "Что проверяет экзамен"
    bullets:
      - "Понимание групп насосов JEMIX и их задач."
      - "Выбор группы оборудования по ситуации клиента."
      - "Условия монтажа и ограничения."
      - "Автоматика: реле, защита, гидроаккумулятор, манометр."
      - "Типичные ошибки: сухой ход, неверный тип, загрязнения, воздух."

  - type: theory
    title: "Карта продуктовых групп"
    bullets:
      - "Насосные станции: автоматическое водоснабжение из источника."
      - "Поверхностные насосы: подача воды при ограниченной глубине всасывания."
      - "Скважинные насосы: подача воды из глубоких скважин."
      - "Дренажные насосы: откачка чистой или загрязнённой воды."
      - "Фекальные насосы и КНС: сточные воды и принудительная канализация."
      - "Повышающие насосы и циркуляционные насосы: давление или циркуляция в контуре."

  - type: instructions
    title: "Правила прохождения"
    body: "В каждом вопросе сначала определяйте задачу клиента: источник воды, среда, требуемый напор, расход, глубина, загрязнённость, автоматика и условия монтажа."

  - type: quiz
    title: "Вопрос 1"
    question: "В дом нужно организовать автоматическое водоснабжение из колодца с включением по давлению. Какая группа ближе всего?"
    answers:
      - "Насосная станция"
      - "Фекальный насос"
      - "Циркуляционный насос"
      - "Дренажный насос"
    correct: 0

  - type: quiz
    title: "Вопрос 2"
    question: "Клиент хочет поднять воду из глубокой скважины. Что рассматриваем в первую очередь?"
    answers:
      - "Скважинный насос"
      - "Канализационную установку"
      - "Циркуляционный насос"
      - "Реле давления"
    correct: 0

  - type: quiz
    title: "Вопрос 3"
    question: "Нужно откачать воду из подвала после подтопления. Какая группа подходит?"
    answers:
      - "Дренажный насос"
      - "Повышающий насос"
      - "Скважинный насос"
      - "Фекальный насос"
    correct: 0

  - type: quiz
    title: "Вопрос 4"
    question: "Для сточных вод с включениями выбираем:"
    answers:
      - "Фекальный насос или канализационную установку"
      - "Циркуляционный насос"
      - "Поверхностный насос для чистой воды"
      - "Манометр"
    correct: 0

  - type: quiz
    title: "Вопрос 5"
    question: "В квартире есть вода, но слабый напор в душе. Какая группа нужна?"
    answers:
      - "Повышающий насос"
      - "Дренажный насос"
      - "Скважинный насос"
      - "Фекальный насос"
    correct: 0

  - type: quiz
    title: "Вопрос 6"
    question: "Нужно обеспечить движение теплоносителя по отопительному контуру. Что подходит?"
    answers:
      - "Циркуляционный насос"
      - "Скважинный насос"
      - "Поверхностный насос"
      - "Канализационная установка"
    correct: 0

  - type: quiz
    title: "Вопрос 7"
    question: "Что показывает манометр?"
    answers:
      - "Давление"
      - "Температуру воздуха"
      - "Глубину скважины"
      - "Количество песка"
    correct: 0

  - type: quiz
    title: "Вопрос 8"
    question: "Что снижает количество частых пусков насоса в системе с реле давления?"
    answers:
      - "Гидроаккумулятор"
      - "Дренажный шланг"
      - "Измельчитель"
      - "Поплавок"
    correct: 0

  - type: quiz
    title: "Вопрос 9"
    question: "Какой риск возникает при работе насоса без воды?"
    answers:
      - "Сухой ход и повреждение насоса"
      - "Увеличение гарантийного срока"
      - "Самоочистка рабочего колеса"
      - "Снижение шума"
    correct: 0

  - type: quiz
    title: "Вопрос 10"
    question: "Что важно проверить при замене циркуляционного насоса?"
    answers:
      - "Монтажную длину и присоединение"
      - "Цвет упаковки"
      - "Наличие колёс"
      - "Глубину зеркала воды"
    correct: 0

  - type: quiz
    title: "Вопрос 11"
    question: "Что делает реле давления?"
    answers:
      - "Включает и отключает насос по давлению"
      - "Измельчает стоки"
      - "Охлаждает двигатель воздухом"
      - "Фильтрует песок"
    correct: 0

  - type: quiz
    title: "Вопрос 12"
    question: "Почему нельзя подбирать насос только по мощности?"
    answers:
      - "Нужны расход, напор, условия среды и рабочая точка"
      - "Мощность никогда не указывается"
      - "Все насосы одинаковые"
      - "Мощность важна только для цвета"
    correct: 0

  - type: true_false
    title: "Верно / неверно 1"
    question: "Повышающий насос решает проблему полного отсутствия воды в магистрали."
    correct: false

  - type: true_false
    title: "Верно / неверно 2"
    question: "Дренажный насос подбирают с учётом загрязнённости воды и допустимого размера частиц."
    correct: true

  - type: true_false
    title: "Верно / неверно 3"
    question: "Манометр сам по себе не включает и не выключает насос."
    correct: true

  - type: true_false
    title: "Верно / неверно 4"
    question: "Циркуляционный насос предназначен для движения теплоносителя в замкнутом контуре."
    correct: true

  - type: case
    title: "Финальный кейс"
    situation: "Клиенту нужно: вода из скважины, защита от сухого хода, стабильное давление в доме."
    correct_solution: "Скважинный насос + автоматика/защита + гидроаккумулятор и обвязка."

  - type: summary
    title: "Итоги модуля 3"
    body: "Модуль 3 завершён. Ключевой навык — быстро определить группу насоса по задаче клиента и проверить среду, расход, напор, глубину, монтаж и автоматику."
