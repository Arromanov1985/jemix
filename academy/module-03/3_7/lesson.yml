id: "3.7"
title: "Фекальные насосы JEMIX"
module: 3
lesson: "3_7"
format: "H5P Course Presentation"
source_catalog: "Каталог JEMIX 2026, раздел Фекальные насосы"
status: "draft"

objectives:
  - Объяснить назначение фекальных насосов.
  - Отличать фекальные насосы от дренажных.
  - Понимать серии ФН, ФНН, Ф-КОМБИ, CUT, SUPERCUT и FESTOCK.
  - Подбирать насос по типу воды, размеру включений, подаче и подъёму.
  - Понимать, когда нужен режущий механизм.

slides:
  - type: title
    title: "3.7 Фекальные насосы JEMIX"
    subtitle: "Назначение, серии и основы подбора"

  - type: text
    title: "Назначение"
    body: |
      Фекальные насосы применяются для перекачивания загрязнённой воды, сточных вод и жидкостей с более крупными включениями, чем допускают дренажные насосы.
      Их нельзя путать с обычными дренажными насосами.

  - type: comparison
    title: "Дренажный или фекальный"
    rows:
      - group: "Дренажный насос"
        use: "дождевая, дренажная, слабозагрязнённая вода"
        particles: "обычно мелкие включения"
      - group: "Фекальный насос"
        use: "сточные воды и загрязнённая вода"
        particles: "крупнее включения, отдельные модели с режущим механизмом"

  - type: infographic
    title: "Основные серии"
    items:
      - "ФН — базовая серия"
      - "ФНН — корпус из нержавеющей стали"
      - "Ф-КОМБИ — комбинированные решения"
      - "CUT — режущий механизм"
      - "SUPERCUT — усиленный режущий механизм"
      - "FESTOCK — специальные модели"

  - type: quiz
    title: "Квиз 1"
    question: "Когда дренажного насоса может быть недостаточно?"
    answers:
      - "Когда есть сточные воды или крупные включения"
      - "Когда вода абсолютно чистая"
      - "Когда нужно отопление"
      - "Когда нужно повысить давление в кране"
    correct: 0

  - type: quiz
    title: "Квиз 2"
    question: "Какие серии связаны с режущим механизмом?"
    answers:
      - "CUT и SUPERCUT"
      - "ЦН и ПНВ"
      - "ДНБ и ДНУ"
      - "НС-СМАРТ и АПЦН"
    correct: 0

  - type: case
    title: "Кейс 1. Сточная вода с включениями"
    situation: "Нужно перекачивать загрязнённую воду с включениями."
    correct_solution: "Начать подбор с фекальных насосов, а не с дренажных."

  - type: case
    title: "Кейс 2. Возможны волокнистые включения"
    situation: "В воде могут быть включения, которые лучше измельчать перед перекачиванием."
    correct_solution: "Рассмотреть модели с режущим механизмом: CUT или SUPERCUT."

  - type: text
    title: "Типичные ошибки"
    body: |
      - Ставят дренажный насос вместо фекального.
      - Не учитывают размер включений.
      - Не проверяют наличие режущего механизма.
      - Выбирают только по мощности.
      - Не проверяют подъём и производительность.
      - Не обеспечивают правильный монтаж и обслуживание.

  - type: checklist
    title: "Чек-лист подбора"
    items:
      - "Какая жидкость?"
      - "Есть ли твёрдые или волокнистые включения?"
      - "Нужен ли режущий механизм?"
      - "Какой расход требуется?"
      - "На какую высоту нужно поднимать?"
      - "Какой материал корпуса предпочтителен?"

  - type: summary
    title: "Итоги"
    body: |
      Фекальный насос выбирают не вместо дренажного, а когда условия действительно требуют работы со сточными и загрязнёнными водами.
      Для сложных включений рассматривают серии с режущим механизмом.
