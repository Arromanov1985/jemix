objectives:
  - Объяснить назначение поверхностных насосов.
  - Разобрать серии ПЦН, ПЦН/Н, ПНВ, ППН, ПЦН/П и ГМН.
  - Показать ограничения по всасыванию и качеству воды.
  - Научить выбирать серию по задаче.

slides:
  - type: title
    title: "3.3 Поверхностные насосы JEMIX"
    subtitle: "Серии, ограничения и подбор"
  - type: text
    title: "Назначение"
    body: "Поверхностный насос устанавливается вне воды и забирает воду через всасывающую магистраль."
  - type: infographic
    title: "Ключевые условия"
    items:
      - "Насос стоит вне воды"
      - "Нужна герметичная всасывающая линия"
      - "Нужен обратный клапан"
      - "Важно учитывать глубину всасывания"
      - "Вода должна соответствовать требованиям каталога"
  - type: table
    title: "Основные серии"
    rows:
      - series: "ПЦН"
        note: "центробежные насосы"
      - series: "ПЦН/Н"
        note: "корпус из нержавеющей стали"
      - series: "ПНВ"
        note: "вихревые насосы"
      - series: "ППН"
        note: "высокая подача"
      - series: "ПЦН/П"
        note: "самовсасывающие насосы"
      - series: "ГМН"
        note: "многоступенчатые насосы"
  - type: quiz
    title: "Проверка"
    question: "Где устанавливается поверхностный насос?"
    answers:
      - "Вне воды"
      - "Только на дне скважины"
      - "Внутри радиатора"
      - "Только в канализации"
    correct: 0
  - type: summary
    title: "Итоги"
    body: "Поверхностные насосы выбирают по источнику воды, глубине всасывания, требуемому расходу, напору и условиям монтажа."
