id: "3.8"
title: "Канализационные установки JEMIX"
module: 3
lesson: "3_8"
format: "H5P Course Presentation"
source_catalog: "Каталог JEMIX 2026, раздел Канализационные установки"
status: "draft"

objectives:
  - Объяснить назначение канализационных установок.
  - Показать отличие установки от обычного фекального насоса.
  - Разобрать подключение унитаза, раковины, душа и бытовой техники.
  - Понять ограничения по температуре, включениям и режиму работы.
  - Научиться выбирать установку по задаче помещения.

slides:
  - type: title
    title: "3.8 Канализационные установки JEMIX"
    subtitle: "Назначение, подключение и ограничения"

  - type: text
    title: "Что такое канализационная установка"
    body: |
      Канализационная установка — компактный насосный блок для отвода сточных вод от сантехнических приборов, когда самотёчный отвод невозможен или затруднён.

  - type: infographic
    title: "Где применяются"
    items:
      - "санузел ниже уровня канализации"
      - "дополнительный туалет"
      - "душевая или раковина далеко от стояка"
      - "переоборудование помещения"
      - "небольшие бытовые стоки"

  - type: comparison
    title: "Установка или фекальный насос"
    rows:
      - group: "Канализационная установка"
        use: "подключение сантехнических приборов внутри помещения"
        note: "компактный корпус, патрубки, автоматика"
      - group: "Фекальный насос"
        use: "перекачка сточных вод из приямков, ёмкостей, септиков"
        note: "погружное исполнение и другие условия монтажа"

  - type: quiz
    title: "Квиз 1"
    question: "Когда обычно нужна канализационная установка?"
    answers:
      - "Когда самотёчный отвод сточных вод невозможен или затруднён"
      - "Когда нужно повысить давление воды в кране"
      - "Когда нужно перемешивать теплоноситель"
      - "Когда нужно откачать дождевую воду из приямка"
    correct: 0

  - type: quiz
    title: "Квиз 2"
    question: "Что важно проверить перед подбором установки?"
    answers:
      - "Какие приборы подключаются и куда нужно отводить стоки"
      - "Только цвет корпуса"
      - "Только вес коробки"
      - "Только наличие манометра"
    correct: 0

  - type: case
    title: "Кейс 1. Дополнительный санузел"
    situation: "Нужно сделать туалет в помещении ниже уровня основной канализации."
    correct_solution: "Рассмотреть канализационную установку с возможностью подключения унитаза."

  - type: case
    title: "Кейс 2. Душ и раковина"
    situation: "Нужно отвести стоки от душа и раковины, расположенных далеко от стояка."
    correct_solution: "Подбирать установку по количеству подключений, температуре и высоте/дальности отвода."

  - type: text
    title: "Типичные ошибки"
    body: |
      - Подключают приборы, для которых установка не предназначена.
      - Не проверяют температуру стоков.
      - Игнорируют высоту и длину напорной линии.
      - Допускают попадание предметов, которые не должны попадать в установку.
      - Не предусматривают доступ для обслуживания.

  - type: checklist
    title: "Чек-лист подбора"
    items:
      - "Какие сантехнические приборы подключаются?"
      - "Есть ли унитаз?"
      - "Какая температура стоков?"
      - "На какую высоту и длину нужно перекачивать?"
      - "Нужен ли измельчитель?"
      - "Будет ли доступ для обслуживания?"

  - type: summary
    title: "Итоги"
    body: |
      Канализационная установка решает задачу отвода бытовых сточных вод там, где самотёк невозможен.
      Подбор начинается с подключаемых приборов и условий отвода.
