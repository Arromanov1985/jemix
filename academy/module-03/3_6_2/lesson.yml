id: "3.6.2"
title: "Дренажные насосы JEMIX. Подбор и практика"
module: 3
lesson: "3_6_2"
format: "H5P Course Presentation"
source_catalog: "Каталог JEMIX 2026, раздел Дренажные насосы, стр. 16-17"
status: "draft"

objectives:
  - Подбирать дренажный насос по задаче клиента.
  - Отличать серии ДН, ДНН, Д-КОМБИ, ДНБ, ДАН и ДНУ.
  - Учитывать размер примесей, глубину погружения, производительность и подъём.
  - Объяснять клиенту, когда дренажный насос не подходит и нужен фекальный.

slides:
  - type: title
    title: "3.6.2 Дренажные насосы JEMIX"
    subtitle: "Подбор и практика"

  - type: text
    title: "Что повторяем"
    body: |
      Дренажные насосы JEMIX применяются для откачивания чистой, грязной, сточной и дождевой воды.
      Для основных дренажных серий учитываем твёрдые примеси до 5 мм и содержание до 100 г/м³.

  - type: infographic
    title: "Алгоритм подбора"
    items:
      - "1. Что откачиваем"
      - "2. Насколько грязная вода"
      - "3. Нужная производительность"
      - "4. Высота подъёма"
      - "5. Материал корпуса"
      - "6. Условия включения и выключения"

  - type: table
    title: "Сравнение серий"
    rows:
      - series: "ДН"
        use: "универсальная откачка воды"
        body: "пластик"
        max_flow: "116–233 л/мин"
        max_head: "6,5–9,5 м"
      - series: "ДНН"
        use: "условия, где важен корпус из нержавеющей стали"
        body: "нержавеющая сталь"
        max_flow: "116–208 л/мин"
        max_head: "6,5–9 м"
      - series: "Д-КОМБИ"
        use: "низкий уровень воды: включение 10 см, выключение 5 см"
        body: "пластик"
        max_flow: "116–183 л/мин"
        max_head: "6,5–9 м"
      - series: "ДНБ"
        use: "бочки и ёмкости"
        body: "пластик"
        max_flow: "40 л/мин"
        max_head: "12 м"
      - series: "ДАН"
        use: "чистая вода, высокий подъём"
        body: "пластик"
        max_flow: "92–100 л/мин"
        max_head: "30–45 м"
      - series: "ДНУ"
        use: "универсальная откачка с низким остаточным уровнем"
        body: "пластик"
        max_flow: "83 л/мин"
        max_head: "6,5 м"

  - type: quiz
    title: "Квиз 1"
    question: "Для откачки воды из бочки логичнее начать с какой серии?"
    answers:
      - "ДНБ"
      - "ЦН"
      - "ФН"
      - "НС-СМАРТ"
    correct: 0

  - type: quiz
    title: "Квиз 2"
    question: "Какая серия имеет корпус из нержавеющей стали?"
    answers:
      - "ДНН"
      - "ДН"
      - "ДНБ"
      - "Д-КОМБИ"
    correct: 0

  - type: case
    title: "Кейс 1. Затопленный подвал"
    situation: "Нужно быстро откачать дождевую воду из подвала. Вода без крупных включений."
    correct_solution: "Начать подбор с серий ДН или ДНН по требуемой производительности и подъёму."

  - type: case
    title: "Кейс 2. Бочка для полива"
    situation: "Клиент хочет перекачивать чистую воду из бочки для полива."
    correct_solution: "Рассмотреть ДНБ-40-12 как бочковой дренажный насос."

  - type: case
    title: "Кейс 3. Нужен высокий подъём"
    situation: "Вода чистая, требуется подъём до 30–45 м."
    correct_solution: "Рассмотреть серию ДАН."

  - type: true_false
    title: "Проверка"
    question: "Дренажный насос всегда можно использовать вместо фекального."
    correct: false

  - type: text
    title: "Типичные ошибки"
    body: |
      - Выбирают дренажный насос для крупных включений.
      - Не проверяют высоту подъёма.
      - Не учитывают остаточный уровень воды.
      - Блокируют ход поплавкового выключателя.
      - Пережимают напорный шланг.
      - Выбирают только по мощности, а не по задаче.

  - type: checklist
    title: "Чек-лист продавца"
    items:
      - "Что нужно откачать?"
      - "Есть ли крупные включения?"
      - "Какой объём воды нужно удалить?"
      - "На какую высоту поднимать воду?"
      - "Нужен ли корпус из нержавеющей стали?"
      - "Нужно ли откачивать почти до сухого остатка?"

  - type: summary
    title: "Итоги"
    body: |
      Подбор дренажного насоса начинается с задачи и состава воды.
      ДН — базовая серия, ДНН — нержавеющий корпус, Д-КОМБИ — низкий уровень включения/выключения, ДНБ — бочки, ДАН — чистая вода и высокий подъём, ДНУ — универсальная откачка.
