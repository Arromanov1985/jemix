id: "3.11"
title: "Автоматика и комплектующие JEMIX"
module: 3
lesson: "3_11"
format: "H5P Course Presentation"
status: "v1_h5p_ready"
h5p_file: "h5p/JEMIX_Academy_3_11_Avtomatika_i_komplektuyushchie.h5p"

objectives:
  - Понять назначение автоматики в насосных системах.
  - Различать реле давления, блок автоматики, защиту сухого хода и манометр.
  - Объяснять роль гидроаккумулятора.
  - Подбирать комплектующие под задачу клиента.
  - Видеть типичные ошибки монтажа и настройки.

slides:
  - type: title
    title: "3.11 Автоматика и комплектующие JEMIX"
    body: "Управление насосом, защита и элементы обвязки."

  - type: theory
    title: "Зачем нужна автоматика"
    body: "Автоматика управляет включением и отключением насоса, помогает поддерживать рабочее давление и защищает оборудование от опасных режимов."

  - type: image
    title: "Автоматика в системе водоснабжения"
    asset: "automation_system.png"

  - type: theory
    title: "Основные группы автоматики"
    bullets:
      - "Реле давления: включает и отключает насос по давлению."
      - "Блок автоматики: автоматический пуск и останов, часто с защитными функциями."
      - "Защита сухого хода: отключает насос при отсутствии воды."
      - "Манометр: показывает давление для настройки и контроля."
      - "Гидроаккумулятор: запас воды и снижение частых пусков."
      - "Фитинги, клапаны и элементы обвязки."

  - type: quiz
    title: "Квиз 1"
    question: "Что делает реле давления?"
    answers:
      - "Включает и отключает насос по давлению"
      - "Измеряет температуру воздуха"
      - "Измельчает стоки"
      - "Фильтрует песок"
    correct: 0

  - type: theory
    title: "Что делает автоматика"
    bullets:
      - "Повышает комфорт: насос работает без ручного управления."
      - "Защищает насос от опасных режимов."
      - "Помогает поддерживать рабочий диапазон давления."
      - "Снижает число лишних запусков."
      - "Упрощает диагностику через контроль давления."

  - type: theory
    title: "Роль гидроаккумулятора"
    body: "Гидроаккумулятор создаёт запас воды под давлением и уменьшает количество частых пусков насоса. Это особенно важно для систем с реле давления."

  - type: quiz
    title: "Квиз 2"
    question: "Зачем в системе нужен манометр?"
    answers:
      - "Контролировать давление"
      - "Измельчать включения"
      - "Качать воду из скважины"
      - "Нагревать воду"
    correct: 0

  - type: theory
    title: "Алгоритм подбора"
    bullets:
      - "Определить тип насоса и системы."
      - "Понять задачу: автозапуск, защита, контроль давления."
      - "Уточнить нужный диапазон давления."
      - "Проверить необходимость гидроаккумулятора."
      - "Проверить резьбы, питание и место установки."
      - "Настроить и проверить систему после монтажа."

  - type: case
    title: "Кейс 1"
    situation: "Насос часто включается и выключается."
    correct_solution: "Проверить гидроаккумулятор, утечки и настройки давления."

  - type: case
    title: "Кейс 2"
    situation: "Клиент боится, что насос сгорит при отсутствии воды."
    correct_solution: "Предложить защиту от сухого хода или блок автоматики с защитой."

  - type: theory
    title: "Типичные ошибки"
    bullets:
      - "Нет гидроаккумулятора — насос часто включается и выключается."
      - "Неверно настроено давление включения и отключения."
      - "Нет защиты сухого хода при нестабильном источнике."
      - "Плохая герметичность вызывает частые пуски."
      - "Нет обратного клапана — давление уходит из системы."
      - "Манометр путают с реле давления."

  - type: true_false
    title: "Проверка"
    question: "Манометр сам по себе не включает и не выключает насос."
    correct: true

  - type: theory
    title: "Комплектность продажи"
    body: "При продаже автоматики важно уточнять комплект обвязки: обратный клапан, фильтр, фитинги, кабель, гидроаккумулятор, манометр, уплотнение и доступ к сервису."

  - type: checklist
    title: "Чек-лист продавца"
    items:
      - "Какой насос и какая система?"
      - "Нужно автоматическое включение или только защита?"
      - "Какой диапазон давления требуется?"
      - "Есть ли гидроаккумулятор?"
      - "Нужна ли защита от сухого хода?"
      - "Какие резьбы и место монтажа?"
      - "Есть ли обратный клапан, фильтр и манометр?"

  - type: quiz
    title: "Итоговый тест 1"
    question: "Что снижает количество частых пусков насоса?"
    answers:
      - "Гидроаккумулятор"
      - "Цвет корпуса"
      - "Длина коробки"
      - "Тип этикетки"
    correct: 0

  - type: true_false
    title: "Итоговый тест 2"
    question: "Защита от сухого хода нужна, чтобы отключать насос при отсутствии воды."
    correct: true

  - type: summary
    title: "Итоги"
    body: "Автоматика управляет насосом и защищает систему. Реле давления работает по давлению, манометр только показывает давление. Гидроаккумулятор снижает количество пусков. Следующий урок: 3.12 Итоговый экзамен модуля 3."
