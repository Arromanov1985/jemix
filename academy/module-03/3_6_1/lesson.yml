objectives:
  - Объяснить назначение дренажных насосов.
  - Отличать дренажные насосы от фекальных.
  - Разобрать серии ДН, ДНН, Д-КОМБИ, ДНБ, ДАН и ДНУ.
  - Понимать ограничения по примесям, поплавку и режиму работы.

slides:
  - type: title
    title: "3.6.1 Дренажные насосы JEMIX"
    subtitle: "Основы"
  - type: text
    title: "Назначение"
    body: "Дренажные насосы применяются для откачивания чистой, грязной, дождевой и сточной воды без крупных включений."
  - type: table
    title: "Основные серии"
    rows:
      - series: "ДН"
        note: "базовая серия"
      - series: "ДНН"
        note: "корпус из нержавеющей стали"
      - series: "Д-КОМБИ"
        note: "низкий уровень включения и выключения"
      - series: "ДНБ"
        note: "бочковой насос"
      - series: "ДАН"
        note: "чистая вода и высокий подъём"
      - series: "ДНУ"
        note: "универсальная откачка"
  - type: quiz
    title: "Проверка"
    question: "Для чего применяют дренажный насос?"
    answers:
      - "Для откачки воды из подвала, приямка или ёмкости"
      - "Для отопления"
      - "Для повышения давления в квартире"
      - "Для унитаза с измельчителем"
    correct: 0
  - type: summary
    title: "Итоги"
    body: "Дренажный насос выбирают по составу воды, размеру примесей, производительности, подъёму и условиям включения/выключения."
