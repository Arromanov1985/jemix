id: "jemix-academy-final-exam"
title: "Финальный экзамен JEMIX Academy"
module: "final"
lesson: "final_exam"
format: "H5P Course Presentation"
status: "v1_h5p_ready"
h5p_file: "h5p/JEMIX_Academy_Final_Exam.h5p"

objectives:
  - Проверить весь путь обучения JEMIX Academy.
  - Проверить базовые параметры насосов и рабочую точку.
  - Проверить подбор по задачам клиента и типам насосов.
  - Проверить продуктовую ориентацию в линейке JEMIX.
  - Проверить комплектную продажу, работу с возражениями и сервисную границу.

slides:
  - type: title
    title: "Финальный экзамен JEMIX Academy"
    body: "Технические основы, подбор, продуктовая линейка, комплектная продажа, возражения и сервис."
  - type: image
    title: "Финальный экзамен JEMIX Academy"
    asset: "academy_final_map.png"
  - type: image
    title: "Алгоритм сильного продавца"
    asset: "final_seller_algorithm.png"
  - type: image
    title: "Правила финального экзамена"
    asset: "final_exam_rules.png"
  - type: image
    title: "Финальный кейс"
    asset: "final_complex_case.png"
  - type: instructions
    title: "Перед стартом"
    body: "Отвечайте как профессиональный консультант: сначала задача и условия, затем параметры, продуктовая группа, комплект, риски и следующий шаг. Не обещайте точную диагностику без проверки."
  - type: quiz
    title: "Вопрос 1"
    question: "Что такое напор насоса в практическом подборе?"
    answers:
      - "Способность насоса преодолевать высоту, давление и потери"
      - "Только потребляемая мощность"
      - "Только размер корпуса"
      - "Только длина кабеля"
    correct: 0
  - type: quiz
    title: "Вопрос 2"
    question: "Почему нельзя выбирать насос только по Qmax?"
    answers:
      - "Qmax указан без нужного напора; нужна рабочая точка"
      - "Qmax всегда равен рабочему режиму"
      - "Напор не влияет"
      - "Потери в системе не существуют"
    correct: 0
  - type: quiz
    title: "Вопрос 3"
    question: "С чего начинается грамотный подбор?"
    answers:
      - "С задачи клиента, среды и условий работы"
      - "С самой дорогой модели"
      - "Только с цены"
      - "С цвета корпуса"
    correct: 0
  - type: quiz
    title: "Вопрос 4"
    question: "Клиенту нужен насос для скважины. Что критично уточнить?"
    answers:
      - "Глубину, уровни воды, дебит, диаметр и потребителей"
      - "Только цвет корпуса"
      - "Только упаковку"
      - "Только название магазина"
    correct: 0
  - type: quiz
    title: "Вопрос 5"
    question: "Если насос берёт воду из ёмкости, уровень может закончиться. Что важно?"
    answers:
      - "Защита от сухого хода"
      - "Циркуляционный насос"
      - "КНС"
      - "Только манометр"
    correct: 0
  - type: quiz
    title: "Вопрос 6"
    question: "Клиенту нужно откачать подвал после дождя. Какая группа ближе?"
    answers:
      - "Дренажный насос"
      - "Циркуляционный насос"
      - "Повышающий насос"
      - "Гидроаккумулятор"
    correct: 0
  - type: quiz
    title: "Вопрос 7"
    question: "Санузел ниже уровня канализационного стояка. Что ближе всего к решению?"
    answers:
      - "Канализационная установка / КНС"
      - "Насос для чистой воды"
      - "Циркуляционный насос"
      - "Манометр"
    correct: 0
  - type: quiz
    title: "Вопрос 8"
    question: "Что обязательно уточнить при подборе насоса для грязной воды?"
    answers:
      - "Размер частиц и характер загрязнений"
      - "Только цвет корпуса"
      - "Только высоту коробки"
      - "Только цену"
    correct: 0
  - type: quiz
    title: "Вопрос 9"
    question: "Повышающий насос уместен, когда:"
    answers:
      - "Вода на входе есть, но давления недостаточно"
      - "Воды вообще нет"
      - "Нужно откачать фекальные стоки"
      - "Нужна циркуляция отопления"
    correct: 0
  - type: quiz
    title: "Вопрос 10"
    question: "Какая задача у циркуляционного насоса?"
    answers:
      - "Двигать теплоноситель по контуру отопления"
      - "Поднимать воду из скважины"
      - "Измельчать мусор"
      - "Измерять давление"
    correct: 0
  - type: quiz
    title: "Вопрос 11"
    question: "Что снижает частые пуски насоса в системе водоснабжения?"
    answers:
      - "Гидроаккумулятор"
      - "Дренажный шланг"
      - "КНС"
      - "Фекальный насос"
    correct: 0
  - type: quiz
    title: "Вопрос 12"
    question: "Что входит в комплектное предложение кроме насоса?"
    answers:
      - "Автоматика, защита, клапаны, фильтры, трубы/шланги и фитинги"
      - "Только коробка"
      - "Только чек"
      - "Только логотип"
    correct: 0
  - type: quiz
    title: "Вопрос 13"
    question: "Клиент говорит: «Дайте самый мощный насос». Что правильно?"
    answers:
      - "Уточнить задачу, расход, напор и условия"
      - "Сразу продать самый мощный"
      - "Сказать, что мощность решает всё"
      - "Не задавать вопросов"
    correct: 0
  - type: quiz
    title: "Вопрос 14"
    question: "Клиент жалуется: «Насос не качает, замените». Что сначала?"
    answers:
      - "Собрать модель, документы, условия, симптом, фото и базовые проверки"
      - "Сразу обещать замену"
      - "Снять защиту"
      - "Обвинить клиента"
    correct: 0
  - type: quiz
    title: "Вопрос 15"
    question: "Когда нужно прекратить включать насос и направить в сервис?"
    answers:
      - "Запах гари, выбивает автомат, заклинивание, повреждение корпуса"
      - "Клиент спросил цену"
      - "Нужно выбрать шланг"
      - "Нужно узнать диаметр трубы"
    correct: 0
  - type: true_false
    title: "Верно / неверно 1"
    question: "Максимальный расход и максимальный напор насоса обычно не означают рабочий режим системы."
    correct: true
  - type: true_false
    title: "Верно / неверно 2"
    question: "Дренажный насос можно считать универсальной заменой КНС для санузла ниже стояка."
    correct: false
  - type: true_false
    title: "Верно / неверно 3"
    question: "Повышающий насос решает проблему полного отсутствия воды на входе."
    correct: false
  - type: true_false
    title: "Верно / неверно 4"
    question: "Комплектная продажа должна объяснять пользу и риски, а не навязывать случайные товары."
    correct: true
  - type: true_false
    title: "Верно / неверно 5"
    question: "Без осмотра системы и насоса нельзя обещать точную причину неисправности и гарантийное решение."
    correct: true
  - type: case
    title: "Финальный кейс"
    situation: "Дом из скважины, слабый душ, подвал иногда топит, санузел ниже стояка."
    correct_solution: "Разделить задачи: водоснабжение + проверка давления/автоматики + дренаж + КНС, собрать данные и комплект по каждой задаче."
  - type: summary
    title: "Итоги JEMIX Academy"
    body: "JEMIX Academy завершена. Правильный подбор начинается с задачи, среды и условий; рабочая система включает насос, автоматику, защиту, обвязку и грамотный монтаж."
