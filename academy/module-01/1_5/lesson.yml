id: "1.5"
title: "Базовый алгоритм подбора насоса"
module: 1
lesson: "1_5"
format: "H5P Course Presentation"
status: "ux_v2_h5p_ready"
h5p_file: "h5p/JEMIX_Academy_1_5_Bazovyj_algoritm_podbora_nasosa_UX_Redesign_v2.h5p"
ux_version: "v2"
design_system:
  font: "PT Sans"
  layout: "JEMIX Academy UX v2"
  principles:
    - "Один смысловой фокус на слайд"
    - "Минимум текста, больше карточек и схем"
    - "Единый верхний бар с модулем и уроком"
    - "Подбор от задачи клиента к комплекту"

objectives:
  - Собрать базовый алгоритм подбора в одну схему.
  - Начинать подбор с задачи клиента, а не с модели или мощности.
  - Уточнять среду и условия монтажа.
  - Собирать расход и напор как основу подбора.
  - Проверять комплект: автоматику, защиту и обвязку.

slides:
  - type: ux_title
    title: "Алгоритм подбора насоса"
    body: "Подбор — это не угадывание модели, а последовательная консультация от задачи к комплекту."

  - type: ux_goals
    title: "Что нужно понять"
    points:
      - "Начинать с задачи клиента, а не с модели"
      - "Уточнять среду и условия монтажа"
      - "Собирать расход и напор как основу подбора"
      - "Проверять автоматику, защиту и обвязку"
      - "Формулировать клиенту понятное решение"

  - type: ux_step
    title: "Шаг 1. Задача клиента"
    body: "Первый вопрос определяет продуктовую группу."
    tasks:
      - "Подать воду"
      - "Откачать воду"
      - "Перекачать стоки"
      - "Повысить давление"

  - type: ux_step
    title: "Шаг 2. Среда"
    body: "Нельзя подбирать насос, пока не ясно, что именно перекачиваем."
    media:
      - "Чистая вода"
      - "Грязная вода"
      - "Стоки"
      - "Теплоноситель"

  - type: ux_step
    title: "Шаг 3. Условия"
    body: "Одинаковая задача может требовать разных насосов из-за условий."
    checks:
      - "Источник"
      - "Высота"
      - "Трасса"
      - "Монтаж"

  - type: ux_step
    title: "Шаг 4. Параметры"
    body: "Для базового подбора нужны две опоры: расход и напор."
    parameters:
      - "Расход Q"
      - "Напор H"

  - type: ux_step
    title: "Шаг 5. Комплект"
    body: "Хороший подбор — это не только насос, но и всё, что делает систему надёжной."
    kit:
      - "Обратный клапан"
      - "Фильтр"
      - "Автоматика"
      - "Защита"
      - "Гидроаккумулятор"
      - "Фитинги"

  - type: ux_dialogue
    title: "Как это звучит в продаже"
    client: "Нужен насос для дома"
    seller: "Уточним источник воды, количество точек, высоту подачи и автоматику. Тогда подберём не просто насос, а рабочую систему."

  - type: ux_quiz_intro
    title: "Быстрая проверка"
    question: "Что нужно уточнить в самом начале подбора насоса?"

  - type: quiz
    title: "Квиз"
    question: "Что нужно уточнить в самом начале подбора насоса?"
    answers:
      - "Задачу клиента: что нужно сделать"
      - "Только цвет корпуса"
      - "Только цену"
      - "Только бренд конкурента"
    correct: 0

  - type: true_false
    title: "Верно / неверно"
    question: "Хороший подбор включает не только насос, но и автоматику, защиту и обвязку."
    correct: true

  - type: ux_summary
    title: "Итоги модуля"
    points:
      - "1. Задача — что нужно сделать."
      - "2. Среда — что перекачиваем."
      - "3. Условия — откуда, куда и как."
      - "4. Параметры — расход и напор."
      - "5. Комплект — автоматика и обвязка."
