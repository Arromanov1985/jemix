id: "1.5"
title: "Базовый алгоритм подбора насоса"
module: 1
lesson: "1_5"
format: "H5P Course Presentation"
status: "v1_h5p_ready"
h5p_file: "h5p/JEMIX_Academy_1_5_Bazovyj_algoritm_podbora_nasosa.h5p"

objectives:
  - Собрать базовый алгоритм подбора в одну схему.
  - Научиться задавать правильные вопросы клиенту.
  - Выбирать группу насоса по задаче.
  - Проверять риски: сухой ход, загрязнения, потери и совместимость.
  - Закрепить материал модуля 1 на практических кейсах.

slides:
  - type: title
    title: "1.5 Базовый алгоритм подбора насоса"
    body: "Как вести первый разговор с клиентом и не ошибиться с группой насоса."
  - type: image
    title: "Базовый алгоритм подбора насоса"
    asset: "selection_algorithm.png"
  - type: theory
    title: "Шаг 1. Определить задачу"
    body: "Начинаем не с модели, цены или мощности, а с задачи клиента: подать воду, откачать воду, повысить давление, обеспечить циркуляцию или перекачать стоки."
  - type: image
    title: "Вопросы клиенту"
    asset: "customer_questions.png"
  - type: quiz
    title: "Квиз 1"
    question: "С чего правильно начинать подбор насоса?"
    answers:
      - "С задачи клиента и условий работы"
      - "Только с цены"
      - "Только с мощности"
      - "Только с цвета корпуса"
    correct: 0
  - type: theory
    title: "Шаг 2. Уточнить среду"
    body: "Среда определяет допустимую группу насоса. Чистая вода, загрязнённая вода, стоки и теплоноситель требуют разных решений."
  - type: image
    title: "Выбор группы по задаче"
    asset: "selection_by_task.png"
  - type: quiz
    title: "Квиз 2"
    question: "Клиенту нужно откачать грязную воду из приямка. Какая группа ближе?"
    answers:
      - "Дренажные насосы"
      - "Циркуляционные насосы"
      - "Повышающие насосы"
      - "Манометры"
    correct: 0
  - type: theory
    title: "Шаг 3. Проверить параметры"
    body: "После выбора группы проверяем расход, напор, давление, глубину, длину трассы и потери. Максимальные цифры из паспорта нельзя читать отдельно от условий системы."
  - type: image
    title: "Что обязательно проверить"
    asset: "selection_risks.png"
  - type: theory
    title: "Шаг 4. Подобрать комплект"
    body: "Насос редко работает один. Для корректной установки часто нужны обратный клапан, фильтр, шланг или труба, фитинги, автоматика, защита от сухого хода и гидроаккумулятор."
  - type: case
    title: "Кейс 1"
    situation: "Дом, скважина, нужно стабильное давление и защита от сухого хода."
    correct_solution: "Скважинный насос + автоматика/защита + обвязка."
  - type: case
    title: "Кейс 2"
    situation: "В квартире есть вода, но слабый напор."
    correct_solution: "Рассматриваем повышающий насос."
  - type: image
    title: "Ошибки продавца"
    asset: "seller_mistakes_15.png"
  - type: true_false
    title: "Проверка"
    question: "Правильный подбор начинается с вопроса «что должен сделать насос?»."
    correct: true
  - type: checklist
    title: "Мини-скрипт продавца"
    items:
      - "Для какой задачи нужен насос?"
      - "Какую жидкость перекачиваем?"
      - "Откуда берём и куда подаём?"
      - "Какой нужен расход и сколько точек работает одновременно?"
      - "Какая высота, длина трассы и давление?"
      - "Нужна ли автоматика и защита?"
      - "Какие комплектующие потребуются для монтажа?"
  - type: quiz
    title: "Итоговый тест 1"
    question: "Почему нельзя подбирать насос только по мощности?"
    answers:
      - "Нужны задача, среда, расход, напор и условия монтажа"
      - "Мощность всегда скрыта"
      - "Мощность влияет только на цвет"
      - "Все насосы одинаковые"
    correct: 0
  - type: true_false
    title: "Итоговый тест 2"
    question: "Если источник воды нестабильный, нужно думать о защите от сухого хода."
    correct: true
  - type: summary
    title: "Итоги"
    body: "Алгоритм подбора: задача → среда → источник → параметры → монтаж → комплект. Модуль 1 готов к финальному тесту."
