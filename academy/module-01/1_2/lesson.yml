id: "1.2"
title: "Основные параметры насоса"
module: 1
lesson: "1_2"
format: "H5P Course Presentation"
status: "v1_h5p_ready"
h5p_file: "h5p/JEMIX_Academy_1_2_Osnovnye_parametry_nasosa.h5p"

objectives:
  - Понять расход, напор и давление.
  - Увидеть, из чего складывается общий напор.
  - Разобрать идею рабочей точки.
  - Научиться задавать правильные вопросы клиенту.
  - Избегать подбора только по мощности.

slides:
  - type: title
    title: "1.2 Основные параметры насоса"
    body: "Расход, напор, давление и рабочая точка."

  - type: theory
    title: "Три базовых параметра"
    bullets:
      - "Расход Q: сколько воды нужно подать за время."
      - "Напор H: на какую высоту и с каким давлением подать воду."
      - "Давление P: что чувствует потребитель в кране или системе."
      - "Глубина: откуда насос берёт воду."
      - "Потери: трубы, фитинги, фильтры и клапаны."
      - "Рабочая точка: место, где насос и система совпали."

  - type: theory
    title: "Расход Q"
    body: "Расход показывает, сколько воды насос может подать за единицу времени. Для клиента это связано с количеством точек водоразбора и одновременностью их работы."

  - type: theory
    title: "Как объяснять расход"
    bullets:
      - "Один кран — небольшой водоразбор."
      - "Душ потребляет больше, чем один кран."
      - "Дом — несколько точек могут работать одновременно."
      - "Полив часто требует большего расхода."
      - "Запас нужен разумный, но без завышения."
      - "Главный вопрос клиенту: сколько точек будет работать одновременно?"

  - type: quiz
    title: "Квиз 1"
    question: "Что показывает расход насоса?"
    answers:
      - "Сколько воды насос подаёт за время"
      - "Только высоту подъёма"
      - "Только давление в розетке"
      - "Только вес насоса"
    correct: 0

  - type: theory
    title: "Напор H"
    body: "Напор показывает энергетическую способность насоса: поднять воду, протолкнуть её по трубе, преодолеть сопротивление и обеспечить давление у потребителя."

  - type: theory
    title: "Из чего складывается напор"
    bullets:
      - "Высота: геодезический подъём воды."
      - "Давление: требуемое давление у потребителя."
      - "Потери: сопротивление трубопровода и арматуры."
      - "Длина трубы: чем длиннее, тем больше потери."
      - "Диаметр: узкая труба увеличивает потери."
      - "Фильтры и клапаны тоже создают сопротивление."

  - type: quiz
    title: "Квиз 2"
    question: "Что входит в расчёт общего напора?"
    answers:
      - "Высота, требуемое давление и потери"
      - "Только цвет трубы"
      - "Только цена насоса"
      - "Только длина кабеля"
    correct: 0

  - type: theory
    title: "Давление P"
    body: "Давление — то, что клиент обычно ощущает в кране, душе или системе. В насосном подборе важно связать давление с напором, но не путать эти понятия."

  - type: theory
    title: "Рабочая точка"
    body: "Рабочая точка — это реальный режим, где возможности насоса совпали с сопротивлением системы. Именно поэтому насос нельзя выбирать только по максимальному напору или максимальному расходу."

  - type: case
    title: "Кейс 1"
    situation: "Клиенту нужен насос для дома: душ, кран и полив."
    correct_solution: "Уточнить, сколько точек будет работать одновременно, какой нужен расход и какое давление."

  - type: case
    title: "Кейс 2"
    situation: "Трасса длинная, много фитингов и фильтр."
    correct_solution: "Учитываем повышенные потери напора в системе."

  - type: theory
    title: "Ошибки при подборе"
    bullets:
      - "Выбирать насос только по мощности."
      - "Игнорировать потери в длинной трассе."
      - "Не уточнять расход и количество точек."
      - "Путать напор и высоту."
      - "Брать систему без разумного запаса."
      - "Делать слишком большой запас: дороже, шумнее и хуже режим."

  - type: true_false
    title: "Проверка"
    question: "Максимальный расход и максимальный напор обычно достигаются не одновременно."
    correct: true

  - type: checklist
    title: "Чек-лист вопросов"
    items:
      - "Сколько точек водоразбора?"
      - "Сколько точек работают одновременно?"
      - "Какая высота подъёма?"
      - "Какая длина и диаметр трубы?"
      - "Есть ли фильтры, клапаны, фитинги?"
      - "Какое давление нужно получить?"

  - type: quiz
    title: "Итоговый тест 1"
    question: "Почему нельзя выбирать насос только по максимальному напору?"
    answers:
      - "Нужно учитывать расход и рабочую точку"
      - "Максимальный напор всегда равен нулю"
      - "Напор не указывается"
      - "Это влияет только на цвет"
    correct: 0

  - type: true_false
    title: "Итоговый тест 2"
    question: "Потери в трубопроводе зависят от длины, диаметра, фитингов и арматуры."
    correct: true

  - type: summary
    title: "Итоги"
    body: "Расход отвечает на вопрос «сколько воды». Напор отвечает на вопрос «с какой энергией подать воду». Давление важно для комфорта потребителя. Рабочая точка важнее максимальных цифр в отдельности. Следующий урок: 1.3 Виды насосов и области применения."
