id: "1.2"
title: "Основные параметры насоса"
module: 1
lesson: "1_2"
format: "H5P Course Presentation"
status: "ux_v2_h5p_ready"
h5p_file: "h5p/JEMIX_Academy_1_2_Osnovnye_parametry_nasosa_UX_Redesign_v2.h5p"
ux_version: "v2"
design_system:
  font: "PT Sans"
  layout: "JEMIX Academy UX v2"
  principles:
    - "Один смысловой фокус на слайд"
    - "Минимум текста, больше карточек и схем"
    - "Единый верхний бар с модулем и уроком"
    - "Практические ошибки клиента и проверка понимания"

objectives:
  - Понять расход, напор, давление и мощность.
  - Объяснять клиенту параметры простыми словами.
  - Различать напор и давление.
  - Показывать, почему параметры работают вместе.
  - Избегать подбора только по мощности.

slides:
  - type: ux_title
    title: "Основные параметры насоса"
    body: "Главное в подборе — понимать не название модели, а её рабочие параметры."

  - type: ux_goals
    title: "Что нужно понять"
    points:
      - "Что такое расход"
      - "Что такое напор"
      - "Чем давление отличается от напора"
      - "Что означает мощность"
      - "Почему нельзя смотреть только на один параметр"

  - type: ux_theory
    title: "Расход"
    body: "Расход показывает, сколько жидкости насос подаёт за единицу времени."
    units:
      - "м³/ч"
      - "л/мин"
      - "л/с"

  - type: ux_theory
    title: "Напор"
    body: "Напор показывает, какое сопротивление насос может преодолеть."
    includes:
      - "Высота"
      - "Потери в трубопроводе"
      - "Фильтры, клапаны и арматура"

  - type: ux_compare
    title: "Давление и напор — не одно и то же"
    left:
      title: "Напор"
      body: "Энергия потока. Обычно выражается в метрах водяного столба."
    right:
      title: "Давление"
      body: "То, что мы часто видим на манометре. Часто указывают в барах."
    note: "Практически: 10 м напора ≈ 1 бар давления."

  - type: ux_theory
    title: "Мощность"
    body: "Мощность показывает, сколько энергии потребляет насос или его двигатель."
    key_point: "Большая мощность не означает автоматический правильный выбор."

  - type: ux_scheme
    title: "Параметры работают вместе"
    parameters:
      - "Расход"
      - "Напор"
      - "Мощность"
      - "Условия"

  - type: ux_right_wrong
    title: "Типичная ошибка"
    wrong: "Мне нужен насос помощнее"
    right: "Давайте уточним расход, напор и условия работы системы"

  - type: ux_quiz_intro
    title: "Быстрая проверка"
    question: "Какой параметр показывает, сколько воды насос подаёт за единицу времени?"

  - type: quiz
    title: "Квиз"
    question: "Какой параметр показывает, сколько воды насос подаёт за единицу времени?"
    answers:
      - "Расход"
      - "Напор"
      - "Мощность"
      - "Давление"
    correct: 0

  - type: true_false
    title: "Верно / неверно"
    question: "Большая мощность сама по себе не гарантирует, что насос подходит под задачу."
    correct: true

  - type: ux_summary
    title: "Итоги урока"
    points:
      - "Расход отвечает на вопрос: сколько воды нужно."
      - "Напор отвечает на вопрос: что нужно преодолеть."
      - "Давление часто видим на манометре."
      - "Мощность — это потребление энергии, а не критерий выбора сама по себе."
