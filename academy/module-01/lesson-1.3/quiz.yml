lesson: 1.3
title: Как устроен насос и почему он качает воду
questions:
  - type: single_choice
    title: Что делает рабочее колесо?
    options:
      - text: Охлаждает двигатель
        correct: false
      - text: Передаёт энергию воде
        correct: true
      - text: Измеряет давление
        correct: false
      - text: Отключает насос
        correct: false
    feedback: Рабочее колесо вращается и передаёт воде энергию, за счёт чего появляется поток.

  - type: true_false
    title: Насос можно долго включать без воды.
    correct: false
    feedback: Работа без воды называется сухим ходом. Она может привести к перегреву и поломке насоса.

  - type: drag_and_drop
    title: Подпишите основные детали насоса
    items:
      - Двигатель
      - Вал
      - Рабочее колесо
      - Корпус
    feedback: Эти элементы помогают объяснить принцип работы большинства бытовых насосов.

  - type: single_choice
    title: Что показывает расход?
    options:
      - text: Сколько воды насос подаёт за определённое время
        correct: true
      - text: Вес насоса
        correct: false
      - text: Цвет корпуса
        correct: false
      - text: Длину кабеля
        correct: false
    feedback: Расход показывает количество воды за единицу времени.

  - type: single_choice
    title: Что показывает напор?
    options:
      - text: Способность насоса преодолеть высоту и сопротивление системы
        correct: true
      - text: Температуру двигателя
        correct: false
      - text: Материал корпуса
        correct: false
      - text: Наличие вилки в комплекте
        correct: false
    feedback: Напор связан с высотой, расстоянием и потерями в системе.
