lesson: 1.6
title: Практический экзамен модуля 1
passing_score: 80
questions:
  - type: single_choice
    title: После дождя затопило подвал. Какая группа оборудования нужна?
    options:
      - text: Дренажный насос
        correct: true
      - text: Циркуляционный насос
        correct: false
      - text: Насос повышения давления
        correct: false
    feedback: Нужно удалить воду из помещения, поэтому выбираем дренажное направление.
  - type: single_choice
    title: Клиент говорит: «Нужен насос на дачу». Что сделать первым?
    options:
      - text: Назвать самую мощную модель
        correct: false
      - text: Уточнить задачу клиента
        correct: true
      - text: Спросить только бюджет
        correct: false
    feedback: Сначала выясняем, что именно нужно сделать: водоснабжение, полив, откачка или другая задача.
  - type: matching
    title: Соотнесите ситуацию и направление
    pairs:
      - left: Слабый напор
        right: Повышение давления
      - left: Батареи плохо греют
        right: Циркуляционный насос
      - left: Санузел в подвале
        right: Канализационный насос
      - left: Нет воды из скважины
        right: Водоснабжение
  - type: true_false
    title: Насос можно выбирать только по мощности.
    correct: false
    feedback: Насос выбирают под задачу, параметры системы и условия работы.
