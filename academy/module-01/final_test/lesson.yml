id: "module-01-final-test"
title: "Итоговый тест модуля 1"
module: 1
lesson: "final_test"
format: "H5P Course Presentation"
status: "ux_v2_h5p_ready"
h5p_file: "h5p/JEMIX_Academy_1_Final_Test_Modul_1_UX_Redesign_v2.h5p"
ux_version: "v2"
design_system:
  font: "PT Sans"
  layout: "JEMIX Academy UX v2"
  principles:
    - "Проверка понимания через кейсы и базовые параметры"
    - "Фокус на логике продавца-консультанта"
    - "Закрепление всего модуля 1 перед переходом к модулю 2"

objectives:
  - Проверить понимание базовых понятий насосной техники.
  - Проверить знание расхода, напора, давления и мощности.
  - Проверить выбор группы насоса по задаче клиента.
  - Проверить умение читать характеристики и не путать максимальные значения с рабочим режимом.
  - Проверить базовый алгоритм подбора: задача, среда, условия, параметры, комплект.

slides:
  - type: ux_title
    title: "Финальный тест модуля 1"
    body: "Проверяем базовое понимание насосов, параметров, групп оборудования и логики подбора."

  - type: ux_scope
    title: "Что проверяет тест"
    topics:
      - "1.1 — что делает насос"
      - "1.2 — расход, напор, давление, мощность"
      - "1.3 — виды насосов и задачи"
      - "1.4 — характеристики и рабочая точка"
      - "1.5 — алгоритм подбора"

  - type: ux_rules
    title: "Правила прохождения"
    body: "Вопросы проверяют не память, а умение выбрать правильную логику."

  - type: ux_case_logic
    title: "Кейсовая логика"
    body: "Клиент говорит: «Нужен насос». Это ещё не задача. Нужно уточнить: подать воду, откачать, повысить давление, обеспечить циркуляцию или перекачать стоки."

  - type: ux_parameters
    title: "Параметры в тесте"
    parameters:
      - key: "Q"
        value: "расход"
      - key: "H"
        value: "напор"
      - key: "P"
        value: "мощность"
      - key: "бар"
        value: "давление"

  - type: ux_warning
    title: "Главная ловушка"
    wrong: "Чем больше мощность или напор, тем лучше"
    right: "Подбор идёт по задаче, среде, расходу, напору и условиям."

  - type: quiz
    title: "Вопрос 1"
    question: "Главная задача насоса:"
    answers:
      - "Перемещать жидкость и помогать системе преодолеть сопротивление"
      - "Только нагревать воду"
      - "Только фильтровать песок"
      - "Только измерять давление"
    correct: 0

  - type: quiz
    title: "Вопрос 2"
    question: "Что показывает расход Q?"
    answers:
      - "Сколько воды насос подаёт за единицу времени"
      - "Только высоту подъёма"
      - "Только мощность двигателя"
      - "Только диаметр корпуса"
    correct: 0

  - type: quiz
    title: "Вопрос 3"
    question: "Клиенту нужно откачать воду из подвала. С какой группы начать?"
    answers:
      - "Дренажные насосы"
      - "Циркуляционные насосы"
      - "Повышающие насосы"
      - "Насосы для отопления"
    correct: 0

  - type: quiz
    title: "Вопрос 4"
    question: "Почему нельзя выбирать насос только по максимальному напору?"
    answers:
      - "Нужно смотреть напор при нужном расходе"
      - "Максимальный напор всегда равен мощности"
      - "Напор не влияет на подбор"
      - "Это нужно только для цвета корпуса"
    correct: 0

  - type: quiz
    title: "Вопрос 5"
    question: "Что нужно уточнить в самом начале подбора?"
    answers:
      - "Задачу клиента"
      - "Только цену"
      - "Только цвет корпуса"
      - "Только вес упаковки"
    correct: 0

  - type: true_false
    title: "Вопрос 6"
    question: "Максимальный расход и максимальный напор обычно не достигаются одновременно."
    correct: true

  - type: true_false
    title: "Вопрос 7"
    question: "Насос можно правильно подобрать только по мощности, без расхода, напора и среды."
    correct: false

  - type: quiz
    title: "Вопрос 8"
    question: "Если вода уже есть в системе, но давления не хватает, какая группа может подойти?"
    answers:
      - "Повышающие насосы"
      - "Фекальные насосы"
      - "Циркуляционные насосы"
      - "Дренажные насосы"
    correct: 0

  - type: quiz
    title: "Вопрос 9"
    question: "Что важнее для практического подбора?"
    answers:
      - "Сочетание расхода и напора в рабочей точке"
      - "Только максимальный расход"
      - "Только максимальный напор"
      - "Только мощность"
    correct: 0

  - type: true_false
    title: "Вопрос 10"
    question: "Хороший подбор включает не только насос, но и автоматику, защиту и обвязку."
    correct: true

  - type: ux_finish
    title: "После теста"
    body: "Если результат ниже порога — вернитесь к урокам 1.2–1.5."

  - type: ux_summary
    title: "Модуль 1 завершён"
    points:
      - "Насос — часть системы."
      - "Параметры — Q, H, давление, мощность."
      - "Группа выбирается по задаче."
      - "Характеристики читаем через рабочую точку."
      - "Подбор: задача → среда → условия → параметры → комплект."
