id: "1.1"
title: "Что такое насос"
module: 1
lesson: "1_1"
format: "H5P Course Presentation"
status: "ux_v2_h5p_ready"
h5p_file: "h5p/JEMIX_Academy_1_1_Chto_takoe_nasos_UX_Redesign_v2.h5p"
ux_version: "v2"
design_system:
  font: "PT Sans"
  layout: "JEMIX Academy UX v2"
  principles:
    - "Один смысловой фокус на слайд"
    - "Минимум текста, больше карточек и схем"
    - "Единый верхний бар с модулем и уроком"
    - "Практические кейсы и проверка понимания"

objectives:
  - Понять, что насос перемещает жидкость и является частью системы.
  - Объяснить клиенту, зачем нужен напор.
  - Отличать задачу клиента от модели насоса.
  - Не начинать подбор только с мощности.
  - Использовать базовый алгоритм первого разговора.

slides:
  - type: ux_title
    title: "Что такое насос"
    body: "Насос не «создаёт воду». Он перемещает жидкость и помогает системе преодолеть сопротивление."

  - type: ux_goals
    title: "Что важно понять"
    points:
      - "Насос — часть системы"
      - "Один насос не подходит ко всем задачам"
      - "Напор нужен для преодоления высоты и потерь"
      - "Подбор нельзя начинать с мощности"

  - type: ux_scheme
    title: "Насос работает в системе"
    body: "Подбираем насос под связку: источник → трасса → потребитель."

  - type: ux_right_wrong
    title: "Как думает хороший продавец"
    wrong: "Берите самый мощный насос"
    right: "Уточним, для чего нужен насос"

  - type: ux_dialogue
    title: "Мини-диалог"
    client: "Нужен насос на дачу"
    seller: "Для какой задачи — подать воду в дом, полить участок, откачать воду или повысить давление?"

  - type: ux_algorithm
    title: "Алгоритм первого разговора"
    steps:
      - "Задача"
      - "Среда"
      - "Условия"
      - "Параметры"
      - "Комплект"

  - type: ux_terms
    title: "Три слова продавца"
    terms:
      - term: "Расход"
        definition: "Сколько жидкости нужно подать за единицу времени."
      - term: "Напор"
        definition: "Что помогает преодолеть высоту, давление и потери."
      - term: "Среда"
        definition: "Какую жидкость качаем."

  - type: ux_case
    title: "Кейс: вода в подвале"
    situation: "После дождя в подвале стоит вода. Нужен насос."
    correct_solution: "Это задача откачки. Нужно уточнить чистая или грязная вода, есть ли мусор, куда отводить воду и нужен ли автоматический режим."

  - type: ux_quiz_intro
    title: "Быстрая проверка"
    question: "Что должен сделать продавец первым?"

  - type: quiz
    title: "Квиз"
    question: "Клиент говорит: «Нужен насос для воды». Что продавец должен сделать первым?"
    answers:
      - "Уточнить задачу, источник, среду и условия"
      - "Сразу предложить самый мощный насос"
      - "Спросить только бюджет"
      - "Сказать, что любой насос подойдёт"
    correct: 0

  - type: true_false
    title: "Верно или неверно"
    question: "Насос нужно подбирать под систему и задачу, а не только по мощности."
    correct: true

  - type: ux_summary
    title: "Итоги урока"
    points:
      - "Насос перемещает жидкость."
      - "Система создаёт сопротивление."
      - "Подбор начинается с задачи."
      - "Ошибка — выбирать только по мощности."
