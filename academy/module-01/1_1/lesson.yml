id: "1.1"
title: "Что такое насос и зачем он нужен"
module: 1
lesson: "1_1"
format: "H5P Course Presentation"
status: "v1_h5p_ready"
h5p_file: "h5p/JEMIX_Academy_1_1_Chto_takoe_nasos.h5p"

objectives:
  - Понять, что делает насос.
  - Разобраться, зачем нужен напор.
  - Увидеть основные задачи насосов.
  - Познакомиться с группами насосного оборудования.
  - Запомнить первые параметры подбора.

slides:
  - type: title
    title: "1.1 Что такое насос и зачем он нужен"
    body: "Базовое понимание задач насоса и первых параметров подбора."

  - type: theory
    title: "Что такое насос"
    body: "Насос — это оборудование, которое передаёт жидкости энергию. Благодаря этому жидкость перемещается из источника к потребителю, поднимается на высоту, преодолевает сопротивление трубопровода или циркулирует в контуре."

  - type: image
    title: "Принцип работы насоса"
    asset: "pump_principle.png"

  - type: theory
    title: "Зачем нужен насос"
    bullets:
      - "Подать воду из колодца, скважины или ёмкости."
      - "Создать напор и доставить воду до точки потребления."
      - "Откачать воду из подвала, дренажа или резервуара."
      - "Переместить стоки в канализацию."
      - "Обеспечить циркуляцию теплоносителя."
      - "Автоматизировать включение по давлению или расходу."

  - type: quiz
    title: "Квиз 1"
    question: "Главная задача насоса:"
    answers:
      - "Перемещать жидкость и создавать напор"
      - "Только нагревать воду"
      - "Только фильтровать песок"
      - "Только измерять давление"
    correct: 0

  - type: theory
    title: "Что такое напор простыми словами"
    body: "Напор показывает, какую энергию насос передаёт воде. В продаже его часто объясняют как способность поднять воду, протолкнуть её по трубам и обеспечить нужное давление у потребителя."

  - type: theory
    title: "Основные группы насосов"
    bullets:
      - "Поверхностные: стоят вне воды и работают через всасывающую линию."
      - "Погружные: работают в воде или в скважине."
      - "Дренажные: откачивают чистую или грязную воду."
      - "Фекальные: подходят для стоков и включений."
      - "Повышающие: увеличивают давление в системе."
      - "Циркуляционные: двигают теплоноситель по контуру."

  - type: quiz
    title: "Квиз 2"
    question: "Какой насос обычно работает в скважине?"
    answers:
      - "Скважинный погружной"
      - "Циркуляционный"
      - "Повышающий"
      - "Манометр"
    correct: 0

  - type: theory
    title: "Первые параметры"
    bullets:
      - "Расход: сколько воды нужно подать за время."
      - "Напор: на какую высоту и с каким давлением подать воду."
      - "Среда: чистая вода, грязная вода, стоки или теплоноситель."
      - "Глубина: откуда берём воду и где стоит насос."
      - "Питание: напряжение, мощность и условия подключения."
      - "Автоматика: ручной режим, поплавок, реле или блок."

  - type: theory
    title: "Расход"
    body: "Расход показывает, сколько воды нужно подать за единицу времени. Для клиента это связано с количеством точек водоразбора: душ, кран, полив, стиральная машина и другие потребители."

  - type: theory
    title: "Среда перекачивания"
    body: "Перед подбором нужно понять, что именно перекачиваем: чистую воду, загрязнённую воду, сточные воды или теплоноситель. Ошибка со средой часто приводит к неправильному выбору группы насоса."

  - type: case
    title: "Кейс 1"
    situation: "Клиенту нужно откачать воду из подвала."
    correct_solution: "Начинаем с группы дренажных насосов и уточняем загрязнённость воды."

  - type: case
    title: "Кейс 2"
    situation: "Клиенту нужна циркуляция теплоносителя в отоплении."
    correct_solution: "Рассматриваем циркуляционные насосы."

  - type: theory
    title: "Частые ошибки новичка"
    bullets:
      - "Сначала смотреть цену, а не задачу клиента."
      - "Выбирать только по мощности без расхода и напора."
      - "Не учитывать среду перекачивания."
      - "Допускать сухой ход."
      - "Путать группы насосов."
      - "Забывать про обвязку, клапаны, фильтр и автоматику."

  - type: true_false
    title: "Проверка"
    question: "Насос можно правильно подобрать только по мощности, без расхода, напора и среды."
    correct: false

  - type: checklist
    title: "Мини-чек-лист первого разговора"
    items:
      - "Что нужно сделать: подать, поднять, откачать, повысить давление или обеспечить циркуляцию?"
      - "Какая жидкость: чистая вода, грязная вода, стоки, теплоноситель?"
      - "Откуда берём воду и куда подаём?"
      - "Сколько нужно воды?"
      - "Какой нужен напор или давление?"
      - "Какие условия монтажа и автоматика?"

  - type: quiz
    title: "Итоговый тест 1"
    question: "Почему важно знать среду перекачивания?"
    answers:
      - "Разные среды требуют разных типов насосов"
      - "Это нужно только для цвета корпуса"
      - "Среда не влияет на подбор"
      - "Это важно только для упаковки"
    correct: 0

  - type: true_false
    title: "Итоговый тест 2"
    question: "Напор связан со способностью насоса преодолевать высоту и сопротивление трубопровода."
    correct: true

  - type: summary
    title: "Итоги"
    body: "Насос передаёт жидкости энергию и создаёт движение. Первый подбор начинается с задачи, среды, расхода и напора. Нельзя выбирать насос только по мощности или цене. Следующий урок: 1.2 Основные параметры насоса."
