lesson: 1.5
title: Ассортимент JEMIX: как быстро найти нужную группу
questions:
  - type: single_choice
    title: С чего начинается поиск оборудования JEMIX?
    options:
      - text: С самой дорогой модели
        correct: false
      - text: С задачи клиента
        correct: true
      - text: С цвета корпуса
        correct: false
    feedback: Сначала определяем задачу клиента, затем группу оборудования и модель.
  - type: matching
    title: Соотнесите задачу и группу оборудования
    pairs:
      - left: Нет воды в доме
        right: Водоснабжение
      - left: Затопило подвал
        right: Дренажные насосы
      - left: Санузел ниже канализации
        right: Канализационные насосы
      - left: Батареи плохо греют
        right: Циркуляционные насосы
      - left: Слабый напор в душе
        right: Насосы повышения давления
  - type: true_false
    title: Ассортимент лучше запоминать через реальные задачи клиента.
    correct: true
    feedback: Такой подход помогает быстрее перейти от фразы клиента к правильной группе оборудования.
