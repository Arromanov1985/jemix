id: "1.3"
title: "Виды насосов и области применения"
module: 1
lesson: "1_3"
format: "H5P Course Presentation"
status: "ux_v2_h5p_ready"
h5p_file: "h5p/JEMIX_Academy_1_3_Vidy_nasosov_i_oblasti_primeneniya_UX_Redesign_v2.h5p"
ux_version: "v2"
design_system:
  font: "PT Sans"
  layout: "JEMIX Academy UX v2"
  principles:
    - "Один смысловой фокус на слайд"
    - "Минимум текста, больше карточек и схем"
    - "Единый верхний бар с модулем и уроком"
    - "Выбор группы насоса от задачи клиента"

objectives:
  - Различать основные группы насосов.
  - Связывать тип насоса с задачей клиента.
  - Отличать задачи водоснабжения, откачки, канализации, повышения давления и циркуляции.
  - Понимать разницу между поверхностными, скважинными, дренажными, фекальными, повышающими и циркуляционными насосами.
  - Избегать ошибки выбора группы насоса.

slides:
  - type: ux_title
    title: "Виды насосов"
    body: "Задача продавца — быстро связать потребность клиента с правильной группой насосов."

  - type: ux_goals
    title: "Что нужно понять"
    points:
      - "Какие основные группы насосов встречаются в продаже"
      - "Для какой задачи подходит каждая группа"
      - "Какие вопросы помогают не ошибиться"
      - "Какие ошибки чаще всего делает клиент"
      - "Как объяснить выбор простыми словами"

  - type: ux_map
    title: "Карта выбора по задаче"
    body: "Самый быстрый путь к правильной группе — начать с задачи клиента."
    pairs:
      - task: "Подать воду в дом"
        group: "станция / поверхностный"
      - task: "Взять воду из скважины"
        group: "скважинный"
      - task: "Откачать воду из подвала"
        group: "дренажный"
      - task: "Перекачать стоки"
        group: "фекальный / КНС"
      - task: "Повысить давление"
        group: "повышающий"
      - task: "Двигать теплоноситель"
        group: "циркуляционный"

  - type: ux_theory
    title: "Поверхностные насосы и станции"
    body: "Обычно стоят вне воды и забирают её через всасывающую линию. Подходят для воды из колодца, ёмкости, дачи, дома и полива при небольшой глубине всасывания."
    key_question: "Откуда берём воду и какая высота от уровня воды до насоса?"

  - type: ux_theory
    title: "Скважинные насосы"
    body: "Работают внутри скважины и подают воду с большой глубины. Важно учитывать диаметр, глубину, дебит и нужный напор."

  - type: ux_compare
    title: "Дренажные и фекальные"
    left:
      title: "Дренажный"
      body: "Для откачки чистой или загрязнённой воды: подвал, дренаж, ёмкость."
    right:
      title: "Фекальный"
      body: "Для стоков и включений. Важно уточнить размер включений и условия канализации."
    note: "Ключевой вопрос: что именно перекачиваем — воду или стоки?"

  - type: ux_compare
    title: "Повышающие и циркуляционные"
    left:
      title: "Повышающий"
      body: "Нужен, когда вода уже есть в системе, но давления не хватает."
    right:
      title: "Циркуляционный"
      body: "Двигает теплоноситель по замкнутому контуру отопления или ГВС."

  - type: ux_right_wrong
    title: "Типичные ошибки"
    examples:
      - situation: "Вода из подвала"
        wrong: "предлагают станцию"
        right: "нужен дренажный"
      - situation: "Скважина"
        wrong: "предлагают поверхностный"
        right: "нужен скважинный"
      - situation: "Слабый напор"
        wrong: "ищут насос из скважины"
        right: "возможно повышающий"

  - type: ux_quiz_intro
    title: "Быстрая проверка"
    question: "Клиенту нужно откачать воду из подвала после дождя. С какой группы начать?"

  - type: quiz
    title: "Квиз"
    question: "Клиенту нужно откачать воду из подвала после дождя. С какой группы насосов начать?"
    answers:
      - "Дренажные насосы"
      - "Циркуляционные насосы"
      - "Повышающие насосы"
      - "Скважинные насосы"
    correct: 0

  - type: true_false
    title: "Верно / неверно"
    question: "Если вода уже есть в системе, но давления не хватает, можно рассматривать повышающий насос."
    correct: true

  - type: ux_summary
    title: "Итоги урока"
    points:
      - "Дом / дача — станция или поверхностный насос."
      - "Скважина — скважинный насос."
      - "Откачка воды — дренажный насос."
      - "Стоки — фекальный насос или КНС."
      - "Слабое давление — повышающий насос."
      - "Отопление — циркуляционный насос."
