id: "1.3"
title: "Виды насосов и области применения"
module: 1
lesson: "1_3"
format: "H5P Course Presentation"
status: "v1_h5p_ready"
h5p_file: "h5p/JEMIX_Academy_1_3_Vidy_nasosov_i_oblasti_primeneniya.h5p"

objectives:
  - Различать основные виды насосов.
  - Связывать тип насоса с задачей клиента.
  - Отличать чистую воду, грязную воду и стоки.
  - Понимать разницу между поверхностными и погружными насосами.
  - Использовать простой алгоритм выбора группы.

slides:
  - type: title
    title: "1.3 Виды насосов и области применения"
    body: "Как быстро определить нужную группу насоса по задаче клиента."
  - type: image
    title: "Выбор типа насоса по задаче"
    asset: "pump_type_map.png"
  - type: image
    title: "Основные области применения"
    asset: "application_areas.png"
  - type: theory
    title: "Главный принцип выбора"
    body: "Тип насоса выбирают не по названию и не по цене, а по задаче клиента: подать воду, откачать воду, поднять из скважины, повысить давление, перекачать стоки или обеспечить циркуляцию."
  - type: quiz
    title: "Квиз 1"
    question: "Клиенту нужно откачать воду из подвала. С какой группы начать?"
    answers:
      - "Дренажные насосы"
      - "Циркуляционные насосы"
      - "Манометры"
      - "Повышающие насосы"
    correct: 0
  - type: image
    title: "Поверхностный или погружной"
    asset: "surface_vs_submersible.png"
  - type: theory
    title: "Поверхностные и погружные"
    body: "Поверхностный насос стоит вне воды и работает через всасывающую линию. Погружной насос находится в воде: это важно для скважин, колодцев и задач, где источник находится глубоко."
  - type: quiz
    title: "Квиз 2"
    question: "Что сильнее всего влияет на выбор между поверхностным и погружным насосом?"
    answers:
      - "Источник, глубина и условия монтажа"
      - "Цвет корпуса"
      - "Страна упаковки"
      - "Название папки"
    correct: 0
  - type: image
    title: "Чистая вода, грязная вода, стоки"
    asset: "dirty_water_groups.png"
  - type: theory
    title: "Насосы для чистой воды"
    body: "Для чистой воды рассматривают группы водоснабжения: поверхностные, скважинные, колодезные насосы и насосные станции."
  - type: theory
    title: "Дренажные задачи"
    body: "Для откачки воды из подвала, приямка, резервуара или после подтопления рассматривают дренажные насосы. Важно уточнить загрязнённость воды и допустимый размер частиц."
  - type: theory
    title: "Фекальные насосы и КНС"
    body: "Если задача связана со сточными водами и канализацией, нужны фекальные насосы или канализационные установки. Обычный насос для чистой воды здесь не подходит."
  - type: case
    title: "Кейс 1"
    situation: "Клиенту нужна принудительная канализация от санузла ниже уровня стояка."
    correct_solution: "Рассматриваем канализационную установку."
  - type: case
    title: "Кейс 2"
    situation: "В квартире есть вода, но слабый напор."
    correct_solution: "Рассматриваем повышающие насосы."
  - type: image
    title: "Алгоритм выбора группы"
    asset: "choice_algorithm_13.png"
  - type: image
    title: "Типовые ошибки выбора"
    asset: "mistakes_13.png"
  - type: true_false
    title: "Проверка"
    question: "Насос для чистой воды можно без риска использовать для сточных вод с включениями."
    correct: false
  - type: quiz
    title: "Итоговый тест 1"
    question: "Какая группа обеспечивает движение теплоносителя по контуру отопления?"
    answers:
      - "Циркуляционные насосы"
      - "Дренажные насосы"
      - "Фекальные насосы"
      - "Насосные станции"
    correct: 0
  - type: true_false
    title: "Итоговый тест 2"
    question: "Тип насоса всегда нужно связывать с задачей, средой и условиями монтажа."
    correct: true
  - type: summary
    title: "Итоги"
    body: "Сначала определяем задачу клиента, затем среду, источник и условия монтажа. Для каждой задачи есть своя продуктовая группа. Следующий урок: 1.4 Как читать характеристики насоса."
