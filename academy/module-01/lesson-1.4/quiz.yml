lesson: 1.4
title: Как за 10 секунд определить тип насоса
questions:
  - type: single_choice
    title: Какой насос нужен при фразе клиента «затопило подвал»?
    options:
      - text: Скважинный насос
        correct: false
      - text: Дренажный насос
        correct: true
      - text: Циркуляционный насос
        correct: false
      - text: Насос повышения давления
        correct: false
    feedback: Для откачки воды из подвала выбирают дренажный насос.
  - type: single_choice
    title: Какой насос устанавливается в систему отопления?
    options:
      - text: Циркуляционный насос
        correct: true
      - text: Дренажный насос
        correct: false
      - text: Канализационный насос
        correct: false
    feedback: Циркуляционный насос обеспечивает движение теплоносителя по контуру.
  - type: matching
    title: Соотнесите фразу клиента и группу оборудования
    pairs:
      - left: Слабый напор в душе
        right: Насос повышения давления
      - left: Санузел в подвале
        right: Канализационный насос
      - left: Вода глубоко в скважине
        right: Скважинный насос
      - left: Нужно откачать воду
        right: Дренажный насос
