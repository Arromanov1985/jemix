id: "1.4"
title: "Как читать характеристики насоса"
module: 1
lesson: "1_4"
format: "H5P Course Presentation"
status: "v1_h5p_ready"
h5p_file: "h5p/JEMIX_Academy_1_4_Kak_chitat_harakteristiki_nasosa.h5p"

objectives:
  - Понимать основные обозначения в характеристиках.
  - Читать расход, напор, мощность и напряжение.
  - Не путать максимальные значения с рабочим режимом.
  - Видеть ограничения по среде, частицам, температуре и подключению.
  - Использовать характеристики для консультации клиента.

slides:
  - type: title
    title: "1.4 Как читать характеристики насоса"
    body: "Паспорт, каталог, график Q/H и типичные ошибки чтения."
  - type: image
    title: "Паспортная табличка"
    asset: "nameplate_reading.png"
  - type: image
    title: "Ключевые обозначения"
    asset: "spec_terms.png"
  - type: quiz
    title: "Квиз 1"
    question: "Что обычно означает Q в характеристиках насоса?"
    answers:
      - "Расход"
      - "Напряжение"
      - "Температура"
      - "Диаметр упаковки"
    correct: 0
  - type: theory
    title: "Напор и мощность"
    body: "H — напор насоса. P — мощность двигателя. Мощность важна для электропитания, но сама по себе не означает правильный подбор."
  - type: image
    title: "Как читать график Q/H"
    asset: "qh_graph_reading.png"
  - type: image
    title: "Максимум и рабочий режим"
    asset: "max_vs_working.png"
  - type: quiz
    title: "Квиз 2"
    question: "Почему нельзя ориентироваться только на Q max?"
    answers:
      - "При Q max насос обычно не даёт нужный напор"
      - "Q max всегда равен мощности"
      - "Q max показывает диаметр кабеля"
      - "Q max нужен только для цвета"
    correct: 0
  - type: theory
    title: "Рабочая точка в каталоге"
    body: "Если в каталоге есть график, нужно смотреть не только верхние цифры, а зону, где требуемый расход пересекается с нужным напором. Это практический режим подбора."
  - type: image
    title: "Что смотреть в каталоге"
    asset: "catalog_checklist.png"
  - type: theory
    title: "Ограничения по среде"
    body: "Характеристики обязательно нужно связывать со средой: чистая вода, грязная вода, сточные воды или теплоноситель. Для дренажных и фекальных насосов важен допустимый размер частиц."
  - type: case
    title: "Кейс 1"
    situation: "В характеристиках указан размер частиц."
    correct_solution: "Это особенно важно для дренажных и фекальных насосов."
  - type: case
    title: "Кейс 2"
    situation: "Клиент выбирает насос только по мощности."
    correct_solution: "Нужно проверить расход, напор, среду и рабочую точку."
  - type: image
    title: "Ошибки чтения характеристик"
    asset: "reading_mistakes.png"
  - type: true_false
    title: "Проверка"
    question: "Максимальный напор H max не означает, что при этом насос даст максимальный расход."
    correct: true
  - type: checklist
    title: "Чек-лист чтения характеристик"
    items:
      - "Какая задача и среда?"
      - "Какой нужен расход Q?"
      - "Какой нужен напор H?"
      - "Какая рабочая точка на графике?"
      - "Какие ограничения по частицам и температуре?"
      - "Какое питание и мощность?"
      - "Подходят ли патрубки, резьбы и автоматика?"
  - type: quiz
    title: "Итоговый тест 1"
    question: "Что важнее для практического подбора?"
    answers:
      - "Сочетание расхода и напора в рабочей точке"
      - "Только максимальный расход"
      - "Только максимальный напор"
      - "Только цвет корпуса"
    correct: 0
  - type: true_false
    title: "Итоговый тест 2"
    question: "Размер патрубка и тип присоединения нужно проверять до продажи."
    correct: true
  - type: summary
    title: "Итоги"
    body: "Q — расход, H — напор, P — мощность. Максимальные значения не равны рабочему режиму. Характеристики читают вместе с задачей, средой и условиями монтажа. Следующий урок: 1.5 Базовый алгоритм подбора насоса."
