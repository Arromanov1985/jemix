id: "1.4"
title: "Как читать характеристики насоса"
module: 1
lesson: "1_4"
format: "H5P Course Presentation"
status: "ux_v2_h5p_ready"
h5p_file: "h5p/JEMIX_Academy_1_4_Kak_chitat_harakteristiki_nasosa_UX_Redesign_v2.h5p"
ux_version: "v2"
design_system:
  font: "PT Sans"
  layout: "JEMIX Academy UX v2"
  principles:
    - "Один смысловой фокус на слайд"
    - "Минимум текста, больше карточек и схем"
    - "Единый верхний бар с модулем и уроком"
    - "Чтение характеристик через рабочую точку"

objectives:
  - Понимать основные обозначения Q, H, P и другие паспортные параметры.
  - Не путать максимальные значения с рабочим режимом.
  - Читать кривую насоса как связь расхода и напора.
  - Понимать идею рабочей точки.
  - Объяснять клиенту характеристики без перегруза и ошибок.

slides:
  - type: ux_title
    title: "Как читать характеристики"
    body: "Характеристика насоса помогает понять, что он реально даст в системе, а не только на коробке."

  - type: ux_goals
    title: "Что нужно понять"
    points:
      - "Что означают Q, H, P и мощность"
      - "Почему max расход и max напор не работают одновременно"
      - "Что такое кривая насоса"
      - "Как найти рабочую зону"
      - "Как объяснить клиенту характеристики без перегруза"

  - type: ux_theory
    title: "Что смотреть на шильдике"
    terms:
      - key: "Q"
        value: "расход"
      - key: "H"
        value: "напор"
      - key: "P"
        value: "мощность"
      - key: "U"
        value: "напряжение"
      - key: "IP"
        value: "защита корпуса"
    warning: "Не выбираем насос только по самой большой цифре в карточке товара."

  - type: ux_graph
    title: "Максимальные значения"
    body: "Максимальный расход и максимальный напор — это крайние точки, а не рабочий режим."
    key_point: "Продавцу нужна рабочая область, а не рекламная максимальная цифра."

  - type: ux_graph
    title: "Кривая насоса"
    body: "Она показывает, какой напор насос даёт при разном расходе."
    key_point: "Выбираем точку, где нужный расход совпадает с достаточным напором."

  - type: ux_graph
    title: "Рабочая точка"
    body: "Реальный режим появляется там, где кривая насоса встречается с сопротивлением системы."
    key_point: "Если система меняется: труба, фильтр, высота, клапаны — рабочая точка тоже меняется."

  - type: ux_table
    title: "Как читать таблицу"
    body: "Иногда характеристика дана не графиком, а таблицей. При росте расхода доступный напор падает."

  - type: ux_right_wrong
    title: "Типичная ошибка"
    wrong: "У этого насоса напор 50 м — значит точно подойдёт"
    right: "Посмотрим, какой напор он даёт при нужном расходе"

  - type: ux_quiz_intro
    title: "Быстрая проверка"
    question: "Почему нельзя выбирать насос только по максимальному напору?"

  - type: quiz
    title: "Квиз"
    question: "Почему нельзя выбирать насос только по максимальному напору?"
    answers:
      - "Нужно смотреть, какой напор насос даёт при нужном расходе"
      - "Потому что напор не указывается в паспорте"
      - "Потому что расход всегда равен нулю"
      - "Потому что мощность не существует"
    correct: 0

  - type: true_false
    title: "Верно / неверно"
    question: "Максимальный расход и максимальный напор обычно не достигаются одновременно."
    correct: true

  - type: ux_summary
    title: "Итоги урока"
    points:
      - "Q — расход: сколько воды."
      - "H — напор: что преодолеть."
      - "Кривая показывает связь расхода и напора."
      - "Рабочая точка — реальный режим системы."
      - "Ошибка — выбор по максимальной цифре."
