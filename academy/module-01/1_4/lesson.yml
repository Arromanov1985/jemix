id: "1.4"
title: "Основные виды насосов"
module: 1
lesson: "1_4"
format: "H5P Course Presentation"
status: "scaffold"

objectives:
  - Разобрать основные виды насосов.
  - Показать различия между поверхностными, погружными, дренажными, фекальными, циркуляционными и повышающими насосами.
  - Подготовить к продуктовому модулю JEMIX.

slides:
  - type: title
    title: "1.4 Основные виды насосов"
  - type: table
    title: "Классификация"
    rows:
      - type: "Поверхностные"
        use: "подача воды из источника через всасывающую линию"
      - type: "Погружные"
        use: "работа внутри воды"
      - type: "Дренажные"
        use: "откачка воды"
      - type: "Фекальные"
        use: "сточные воды и загрязнённые жидкости"
      - type: "Циркуляционные"
        use: "движение теплоносителя"
      - type: "Повышающие"
        use: "повышение давления"
  - type: quiz
    title: "Проверка"
    question: "Какой насос работает внутри воды?"
    answers:
      - "Погружной"
      - "Только поверхностный"
      - "Только циркуляционный"
      - "Только реле давления"
    correct: 0
  - type: summary
    title: "Итоги"
    body: "Вид насоса выбирают по задаче, жидкости, месту установки и условиям работы."
