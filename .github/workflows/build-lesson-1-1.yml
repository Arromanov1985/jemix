name: Build JEMIX Lesson 1.1

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-lesson-1-1.yml'
      - 'scripts/fetch_terrawater_images.py'
      - 'scripts/fetch_jemix_logo.py'
      - 'scripts/select_jemix_lesson_assets.py'
      - 'scripts/build_scorm_lesson_1_1_with_assets.py'
      - 'scripts/build_scorm_lesson_1_1_final.py'
      - 'scripts/validate_scorm_lesson_1_1.py'
      - 'academy-assets/**'
      - 'voice/modules/module-01/lesson-1.1/audio/**'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright httpx pillow
          playwright install --with-deps chromium

      - name: Fetch original JEMIX logo
        run: |
          python scripts/fetch_jemix_logo.py \
            --url https://www.terrawater.ru/catalog/3 \
            --output academy-assets/logo/jemix-logo.png

      - name: Collect TerraWater product images
        run: |
          python scripts/fetch_terrawater_images.py \
            --url https://www.terrawater.ru/catalog/3 \
            --output academy-assets/catalog-3

      - name: Select lesson images
        run: |
          python scripts/select_jemix_lesson_assets.py \
            --catalog-dir academy-assets/catalog-3 \
            --module-dir academy-assets/module-01

      - name: Check lesson audio
        run: |
          python - <<'PY'
          from pathlib import Path
          root = Path('voice/modules/module-01/lesson-1.1/audio')
          missing = [f'slide{i:02d}.mp3' for i in range(1, 9) if not (root / f'slide{i:02d}.mp3').is_file()]
          if missing:
              raise SystemExit('Missing audio files: ' + ', '.join(missing))
          print('Audio OK: 8 files')
          PY

      - name: Build lesson 1.1 SCORM
        run: python scripts/build_scorm_lesson_1_1_with_assets.py

      - name: Validate lesson 1.1 SCORM
        run: python scripts/validate_scorm_lesson_1_1.py

      - name: Upload SCORM artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: JEMIX-Lesson-1.1-SCORM
          path: |
            dist/module-01/JEMIX_Lesson_1_1_SCORM_FINAL.zip
            academy-assets/module-01/selected-assets.json
          if-no-files-found: warn
          retention-days: 14

      - name: Commit collected lesson assets
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add academy-assets/logo/jemix-logo.png academy-assets/catalog-3 academy-assets/module-01 academy-assets/pumps/jemix-pump.png
          if git diff --cached --quiet; then
            echo "No new assets to commit"
          else
            git commit -m "assets: refresh TerraWater images for lesson 1.1"
            git push
          fi
