name: Module 2 SCORM

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/build_scorm_lesson_2_*.py'
      - 'scripts/build_scorm_module_02.py'
      - 'scripts/validate_scorm_module_02.py'
      - 'scripts/check_module_02.py'
      - 'academy/module-02/**'
      - 'academy-assets/**'
      - 'voice/modules/module-02/**'
      - '.github/workflows/module-02-scorm.yml'

concurrency:
  group: module-02-scorm-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run complete Module 2 readiness check
        run: python scripts/check_module_02.py

      - name: Upload Module 2 SCORM
        uses: actions/upload-artifact@v4
        with:
          name: JEMIX-Module-02-SCORM
          path: dist/module-02/JEMIX_Module_02_SCORM.zip
          if-no-files-found: error
          retention-days: 30
